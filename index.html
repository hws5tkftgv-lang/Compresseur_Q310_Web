<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L — Lecture / Éditeur</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{
  margin:0;background:#0c132e;color:#eaf1ff;
  font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif
}

/* ===== TOP BAR ===== */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:#0f1a3f;
  border-bottom:1px solid rgba(255,255,255,.1)
}
.btn{
  padding:6px 10px;border-radius:8px;
  border:1px solid rgba(255,255,255,.2);
  background:#1b2553;color:#fff;
  cursor:pointer;font-size:13px;font-weight:600
}
.btn.primary{background:#0078ff}
.btn.tiny{border-radius:999px}

/* ===== ZOOM ===== */
.zoomwrap{
  display:flex;align-items:center;gap:8px;
  background:#121c45;padding:6px 10px;border-radius:12px
}
.zoomwrap input{width:140px}

/* ===== LAYOUT ===== */
.wrap{
  display:grid;grid-template-columns:1fr 360px;
  gap:12px;padding:12px
}
.stage{
  position:relative;background:#0b1536;
  border-radius:12px;overflow:hidden;
  min-height:80vh
}
.panel{
  background:#0f1a44;border-radius:12px;
  padding:12px;display:flex;flex-direction:column;gap:8px
}
canvas{display:block}

/* ===== FULLSCREEN ===== */
body.fs-mode{overflow:hidden;background:#020617}
body.fs-mode .wrap{
  position:fixed;inset:0;padding:8px;
  grid-template-columns:70% 30%
}

/* ===== ZONES ===== */
textarea,input,select{
  background:#101a40;color:#fff;border:1px solid rgba(255,255,255,.2);
  border-radius:8px;padding:6px
}
textarea{resize:vertical}
.hr{height:1px;background:rgba(255,255,255,.15);margin:6px 0}
</style>
</head>

<body>

<div class="topbar">
  <b id="modeLabel">Mode : Lecture</b>
  <button id="toggleMode" class="btn">Passer en Éditeur</button>

  <button id="btnSelect" class="btn tiny primary">🖱 Sélection</button>
  <button id="btnRect" class="btn tiny">▭ Zone</button>
  <button id="btnHand" class="btn tiny">✋ Main</button>

  <button id="btnFit" class="btn tiny">⤡ Ajuster</button>

  <div class="zoomwrap">
    <span>Zoom</span>
    <input id="zoomRange" type="range" min="25" max="250" value="100">
    <span id="zoomLbl">100%</span>
  </div>

  <button id="btnFs" class="btn tiny">⤢ Plein écran</button>
</div>

<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
  </div>

  <aside class="panel">
    <h3>Zone</h3>

    <select id="pieceSelect"><option value="">— pièce —</option></select>
    <input id="fName" placeholder="Nom">
    <input id="fRole" placeholder="Rôle">
    <textarea id="fDesc" placeholder="Description"></textarea>

    <button id="btnApply" class="btn primary">Appliquer</button>
    <button id="btnDelete" class="btn">Supprimer</button>
    <button id="btnShowAll" class="btn">Afficher tout</button>
  </aside>
</div>

<script>
/* ===== CONFIG ===== */
const EDIT_PW="PROF";
const BG_URL="actif/compresseur_bg.png";
const JSON_URL="quincy_310L_parts.json";
const LS_KEY="q310_zones_v1";

/* ===== CANVAS ===== */
const canvas=new fabric.Canvas("c",{selection:false});
let bg=null,isReading=true,tool="select";
let drawing=false,start={},rect=null;

/* ===== TOOLS ===== */
function setTool(t){
  tool=t;
  btnSelect.classList.toggle("primary",t==="select");
  btnRect.classList.toggle("primary",t==="rect");
  btnHand.classList.toggle("primary",t==="hand");
  canvas.defaultCursor=t==="hand"?"grab":t==="rect"?"crosshair":"default";
}

/* ===== ZOOM ===== */
function applyZoom(pct){
  const z=pct/100;
  canvas.zoomToPoint(
    new fabric.Point(canvas.width/2,canvas.height/2),z
  );
  zoomLbl.textContent=pct+"%";
}

/* ===== IMAGE ===== */
fabric.Image.fromURL(BG_URL,img=>{
  bg=img;
  bg.selectable=false;
  canvas.add(bg);
  fit();
},{crossOrigin:"anonymous"});

function fit(){
  const cw=canvas.width,ch=canvas.height;
  const s=Math.min(cw/bg.width,ch/bg.height);
  bg.scale(s);
  bg.left=(cw-bg.width*s)/2;
  bg.top=(ch-bg.height*s)/2;
  canvas.requestRenderAll();
}

/* ===== RESIZE ===== */
function resize(){
  const st=document.querySelector(".stage");
  canvas.setWidth(st.clientWidth);
  canvas.setHeight(st.clientHeight);
  fit();
}
window.addEventListener("resize",resize);
setTimeout(resize,50);

/* ===== DRAW RECT ===== */
canvas.on("mouse:down",o=>{
  if(isReading||tool!=="rect"||o.target) return;
  drawing=true;
  const p=canvas.getPointer(o.e);
  start=p;
  rect=new fabric.Rect({
    left:p.x,top:p.y,width:1,height:1,
    fill:"rgba(0,140,255,.15)",
    stroke:"#08f",strokeWidth:2
  });
  canvas.add(rect);
});
canvas.on("mouse:move",o=>{
  if(!drawing||!rect) return;
  const p=canvas.getPointer(o.e);
  rect.set({
    left:Math.min(p.x,start.x),
    top:Math.min(p.y,start.y),
    width:Math.abs(p.x-start.x),
    height:Math.abs(p.y-start.y)
  });
  canvas.requestRenderAll();
});
canvas.on("mouse:up",()=>{
  if(!drawing) return;
  drawing=false;
  rect.partId="";
  canvas.setActiveObject(rect);
  pieceSelect.focus();
  rect=null;
});

/* ===== PAN ===== */
let pan=false,last={};
canvas.on("mouse:down",o=>{
  if(tool!=="hand")return;
  pan=true;last={x:o.e.clientX,y:o.e.clientY}
});
canvas.on("mouse:move",o=>{
  if(!pan)return;
  const v=canvas.viewportTransform;
  v[4]+=o.e.clientX-last.x;
  v[5]+=o.e.clientY-last.y;
  canvas.setViewportTransform(v);
  last={x:o.e.clientX,y:o.e.clientY}
});
canvas.on("mouse:up",()=>pan=false);

/* ===== JSON ===== */
fetch(JSON_URL).then(r=>r.json()).then(d=>{
  d.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id;o.textContent=p.id+" — "+p.name;
    pieceSelect.appendChild(o);
  });
});

/* ===== APPLY ===== */
btnApply.onclick=()=>{
  const r=canvas.getActiveObject();
  if(!r)return;
  r.partId=pieceSelect.value;
  r.name=fName.value;
  r.role=fRole.value;
  r.desc=fDesc.value;
};

/* ===== DELETE ===== */
btnDelete.onclick=()=>{
  const r=canvas.getActiveObject();
  if(r)canvas.remove(r);
};

/* ===== SHOW ALL ===== */
btnShowAll.onclick=()=>{
  fDesc.value=canvas.getObjects().filter(o=>o!==bg)
    .map((o,i)=>`${i+1}. ${o.partId||"?"}`).join("\n");
};

/* ===== MODE ===== */
toggleMode.onclick=()=>{
  if(isReading){
    if(prompt("Mot de passe")!==EDIT_PW)return;
    isReading=false;modeLabel.textContent="Mode : Éditeur";
  }else{
    isReading=true;modeLabel.textContent="Mode : Lecture";
  }
};

/* ===== ZOOM UI ===== */
zoomRange.oninput=e=>applyZoom(+e.target.value);

/* ===== FULLSCREEN ===== */
btnFs.onclick=()=>{
  if(!document.fullscreenElement)
    document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
document.addEventListener("fullscreenchange",()=>setTimeout(resize,100));

/* ===== INIT ===== */
setTool("select");
</script>
</body>
</html>
