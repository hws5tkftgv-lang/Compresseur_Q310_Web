<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Zones interactives</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
  :root { color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#0b1436; color:#eaf1ff; font-family:Arial,Segoe UI,sans-serif; }

  .topbar{
    display:flex; align-items:center; gap:8px;
    padding:10px; background:#0f1a3f; border-bottom:1px solid rgba(255,255,255,.08);
    position:sticky; top:0; z-index:9999;
  }
  .pill{
    padding:6px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.18);
    background:#121c45; font-size:13px;
  }
  .btn{
    padding:7px 12px; background:#1b2553; color:#fff;
    border:1px solid rgba(255,255,255,.18); border-radius:8px;
    cursor:pointer; font-weight:700; font-size:13px;
  }
  .btn:hover{ filter:brightness(1.06); }
  .btn.active{ background:#0078ff; border-color:#0053ad; }
  .btn.danger{ background:#7f1d2d; border-color:#5f1622; }

  .select{
    background:#101a40; color:#fff; border-radius:8px;
    padding:7px 10px; border:1px solid rgba(255,255,255,.18);
  }

  .zoom{
    display:flex; align-items:center; gap:6px;
    padding:6px 10px; border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    background:#121c45;
  }
  .zoom input[type="range"]{ width:160px; }

  .wrap{
    display:grid; grid-template-columns:1fr 360px;
    gap:12px; padding:12px;
  }
  @media(max-width:1000px){
    .wrap{ grid-template-columns:1fr; }
  }

  .stage{
    background:#0b1536; border-radius:12px; overflow:hidden;
    min-height:78vh; position:relative;
  }
  .panel{
    background:#0f1a44; border-radius:12px; padding:12px;
    display:flex; flex-direction:column; gap:10px;
    min-height:78vh;
  }
  .panel h3{ margin:0; font-size:15px; }
  .small{ font-size:12px; opacity:.85; line-height:1.3; }
  .hr{ height:1px; background:rgba(255,255,255,.12); margin:6px 0; }

  label{ font-size:12px; opacity:.9; }
  textarea, input{
    width:100%;
    background:#101a40; color:#fff;
    border:1px solid rgba(255,255,255,.18); border-radius:10px;
    padding:10px;
  }
  textarea{ min-height:90px; resize:vertical; }
  canvas{ display:block; }

  body.fs .wrap{
    position:fixed; inset:56px 0 0 0;
    padding:8px; margin:0;
  }
  body.fs .stage, body.fs .panel{
    height:calc(100vh - 56px - 16px);
    min-height:unset;
  }
</style>
</head>

<body>

<div class="topbar">
  <span class="pill"><b id="modeLabel">Mode : Lecture</b></span>
  <button id="btnMode" class="btn">Basculer Éditeur</button>

  <select id="imgSelect" class="select"></select>

  <button id="btnSelect" class="btn active" title="Sélection">🖱</button>
  <button id="btnDraw" class="btn" title="Dessiner une zone">✏️</button>
  <button id="btnPan" class="btn" title="Main (Pan)">✋</button>
  <button id="btnErase" class="btn danger" title="Supprimer la zone sélectionnée">🧽</button>

  <div class="zoom">
    <b>Zoom</b>
    <input id="zoomRange" type="range" min="50" max="250" value="100">
    <span id="zoomLabel" style="width:52px; text-align:right;">100%</span>
  </div>

  <button id="btnFit" class="btn" title="Ajuster">⤡ Ajuster</button>
  <button id="btnFs" class="btn" title="Plein écran">⤢ Plein écran</button>
</div>

<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
  </div>

  <aside class="panel">
    <h3>🟦 Fiche de la zone</h3>
    <div class="small">
      Lecture : zones invisibles mais cliquables.<br>
      Éditeur : dessin / sélection / pan / suppression.<br>
      Pièce + infos auto dès qu’on clique une zone.
    </div>

    <div class="hr"></div>

    <div>
      <label>Pièce</label>
      <select id="pieceSelect" class="select" style="width:100%"></select>
      <div class="small" style="opacity:.75;margin-top:6px">
        ID : <span id="partIdLabel">—</span>
      </div>
    </div>

    <div>
      <label>Nom</label>
      <input id="nom" placeholder="ex: Filtre à air">
    </div>

    <div>
      <label>Rôle</label>
      <textarea id="role" placeholder="ex: Filtrer l’air entrant"></textarea>
    </div>

    <div>
      <label>Description</label>
      <textarea id="desc" placeholder="ex: Retient les poussières..."></textarea>
    </div>

    <div>
      <label>Circuit</label>
      <input id="circuit" placeholder="LP / HP / LUB / CTRL / TR">
    </div>

    <button id="btnSavePart" class="btn">💾 Ajouter / Mettre à jour la pièce</button>

    <div class="small" style="margin-top:auto; opacity:.75;">
      Pièces ajoutées : sauvegarde locale (n’écrit pas dans le JSON GitHub).
    </div>
  </aside>
</div>

<script>
/* ================= CONFIG ================= */
const JSON_URL = "quincy_310L_parts.json";
const PARTS_CUSTOM_KEY = "q310_parts_custom_v1";

/* ✅ Fond référence par défaut (premier) */
const IMAGES = [
  { label:"Fond référence", url:"actif/compresseur_bg.png" },
  { label:"Vue générale", url:"actif/VUE_GENERAL.jpeg" },
  { label:"Vue générale 2", url:"actif/VUE_GENERAL_2.jpeg" },
  { label:"Vue côté", url:"actif/VUE_1.jpeg" },
  { label:"Vue pompe", url:"actif/VUE_POMPE.jpeg" },
  { label:"Dessus (TOP)", url:"actif/TOP.jpeg" },
  { label:"Tête", url:"actif/TETE.jpeg" },
  { label:"Tête 2", url:"actif/TETE_2.jpeg" },
  { label:"Côté charge (LOAD)", url:"actif/LOAD_SIDE.jpeg" },
  { label:"Vers réservoir", url:"actif/VERS_RESERVOIR.jpeg" },
  { label:"Poulie", url:"actif/POULIE.jpeg" },
  { label:"Filtre air", url:"actif/FILTRE_AIR_COUVERCLE.jpeg" },
  { label:"Soupape unloader", url:"actif/SOUPAPE_UNLOADER.jpeg" },
];

/* ================= HELPERS ================= */
const $ = (id)=>document.getElementById(id);
const LS_ZONES = (imgUrl)=>"q310_zones_v3::"+imgUrl;

function slugify(s){
  return (s||"")
    .toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"_")
    .replace(/^_+|_+$/g,"");
}

/* ================= STATE ================= */
const canvas = new fabric.Canvas("c", { selection:false, preserveObjectStacking:true });

let bg = null;
let isEditor = false;
let tool = "select";          // select | draw | pan
let zoom = 1;
let currentImage = IMAGES[0].url;

/* Parts: base JSON + custom local */
let partsBase = [];     // array {id, nom, role, desc, circuit}
let partsCustom = {};   // map id -> part
let partsMerged = [];   // array merged

/* Drawing */
let drawing=false, startPt=null, curRect=null;

/* Panning */
let isPanning=false, lastClient=null;

/* ================= TOOLS UI ================= */
function setActiveTool(t){
  tool = t;
  $("btnSelect").classList.toggle("active", t==="select");
  $("btnDraw").classList.toggle("active", t==="draw");
  $("btnPan").classList.toggle("active", t==="pan");
  canvas.defaultCursor = (t==="pan") ? "grab" : (t==="draw" ? "crosshair" : "pointer");
}

/* ================= CANVAS SIZE ================= */
function resizeCanvas(){
  const stage = document.querySelector(".stage");
  canvas.setWidth(stage.clientWidth);
  canvas.setHeight(stage.clientHeight);
  if(bg) fitBackgroundAndZones();
  canvas.requestRenderAll();
}
window.addEventListener("resize", resizeCanvas);

/* ================= IMAGE LOAD ================= */
function loadBackground(url){
  return new Promise((resolve)=>{
    fabric.Image.fromURL(url, (img)=>{
      canvas.clear();
      bg = img;
      bg.selectable = false;
      bg.evented = false;
      bg.objectCaching = false;
      canvas.add(bg);

      resetViewToFit();
      loadZones();
      applyModeVisibility();
      resolve();
    }, { crossOrigin:"anonymous" });
  });
}

/* ================= FIT + VIEW ================= */
function resetViewToFit(){
  canvas.setViewportTransform([1,0,0,1,0,0]);
  zoom = 1;
  $("zoomRange").value = "100";
  $("zoomLabel").textContent = "100%";
  fitBackgroundAndZones();
}

/* Fit bg + reposition zones from _imgBox (coords image) */
function fitBackgroundAndZones(){
  if(!bg) return;

  const cw = canvas.getWidth();
  const ch = canvas.getHeight();

  const iw = bg._originalElement ? bg._originalElement.naturalWidth : bg.width;
  const ih = bg._originalElement ? bg._originalElement.naturalHeight : bg.height;

  const baseScale = Math.min(cw/iw, ch/ih);

  bg.set({
    originX:"left", originY:"top",
    left:(cw - iw*baseScale)/2,
    top:(ch - ih*baseScale)/2,
    scaleX:baseScale, scaleY:baseScale
  });
  canvas.sendToBack(bg);

  getZones().forEach(r=>{
    if(!r._imgBox) return;
    const z = r._imgBox;
    r.set({
      left: bg.left + z.x * bg.scaleX,
      top:  bg.top  + z.y * bg.scaleY,
      width: z.w * bg.scaleX,
      height:z.h * bg.scaleY,
      scaleX:1, scaleY:1
    });
    r.setCoords();
  });
}

/* ================= ZONES SAVE/LOAD ================= */
function getZones(){
  return canvas.getObjects().filter(o=>o!==bg && o.type==="rect");
}

function updateImgBoxFromRect(r){
  const x = (r.left - bg.left) / bg.scaleX;
  const y = (r.top  - bg.top ) / bg.scaleY;
  const w = (r.width  * r.scaleX) / bg.scaleX;
  const h = (r.height * r.scaleY) / bg.scaleY;
  r._imgBox = {x,y,w,h};
}

function saveZones(){
  if(!bg) return;
  const zones = getZones().map(r=>{
    updateImgBoxFromRect(r);
    return { imgBox:r._imgBox, partId:(r.partId||"") };
  });
  localStorage.setItem(LS_ZONES(currentImage), JSON.stringify(zones));
}

function loadZones(){
  getZones().forEach(r=>canvas.remove(r));
  const raw = localStorage.getItem(LS_ZONES(currentImage));
  if(!raw) return;
  let zones;
  try{ zones = JSON.parse(raw); }catch{ return; }
  zones.forEach(z=>{
    const r = makeZoneRect();
    r.partId = z.partId || "";
    r._imgBox = z.imgBox || null;
    canvas.add(r);
  });
  fitBackgroundAndZones();
  canvas.requestRenderAll();
}

canvas.on("object:modified", (e)=>{
  if(!e.target || e.target===bg) return;
  saveZones();
});

/* ================= ZONE LOOK ================= */
function makeZoneRect(){
  const r = new fabric.Rect({
    left:0, top:0, width:50, height:50,
    fill:"rgba(0,150,255,0.12)",
    stroke:"rgba(0,150,255,0.95)",
    strokeWidth:2,
    lockRotation:true,
    objectCaching:false
  });
  r.partId = "";
  r._imgBox = null;
  return r;
}

function applyModeVisibility(){
  getZones().forEach(r=>{
    r.opacity = isEditor ? 1 : 0;  // lecture invisible
    r.evented = true;
    r.selectable = isEditor;       // sélectionnable seulement en éditeur
  });
  canvas.discardActiveObject();
  canvas.requestRenderAll();
  $("modeLabel").textContent = isEditor ? "Mode : Éditeur" : "Mode : Lecture";
}

/* ================= PARTS (base + custom) ================= */
function readCustomParts(){
  try{ return JSON.parse(localStorage.getItem(PARTS_CUSTOM_KEY) || "{}"); }
  catch{ return {}; }
}
function writeCustomParts(map){
  localStorage.setItem(PARTS_CUSTOM_KEY, JSON.stringify(map || {}));
}

function mergeParts(){
  const map = {};
  // base
  partsBase.forEach(p=>{ if(p && p.id) map[p.id]=p; });
  // custom overrides/adds
  Object.keys(partsCustom).forEach(id=>{ map[id]=partsCustom[id]; });
  partsMerged = Object.values(map).sort((a,b)=>{
    const A=(a.nom||a.id||"").toLowerCase();
    const B=(b.nom||b.id||"").toLowerCase();
    return A.localeCompare(B,"fr");
  });
}

function fillPartsSelect(){
  const sel = $("pieceSelect");
  sel.innerHTML = '<option value="">— choisir —</option>';
  partsMerged.forEach(p=>{
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = `${p.nom || p.id} (${p.circuit || "-"})`;
    sel.appendChild(o);
  });
}

/* ================= PANEL (auto) ================= */
function clearPanel(){
  $("pieceSelect").value = "";
  $("partIdLabel").textContent = "—";
  $("nom").value = "";
  $("role").value = "";
  $("desc").value = "";
  $("circuit").value = "";
}

function setPanelFromPart(part){
  if(!part){ clearPanel(); return; }
  $("pieceSelect").value = part.id || "";
  $("partIdLabel").textContent = part.id || "—";
  $("nom").value = part.nom || "";
  $("role").value = part.role || "";
  $("desc").value = part.desc || "";
  $("circuit").value = part.circuit || "";
}

function getPartById(id){
  if(!id) return null;
  return partsMerged.find(p=>p.id===id) || null;
}

function setPanelForZone(r){
  if(!r || r===bg){
    clearPanel();
    return;
  }
  const pid = (r.partId||"").toString();
  const p = getPartById(pid);
  if(p) setPanelFromPart(p);
  else {
    // zone associée à un id absent -> on affiche l'id quand même
    clearPanel();
    $("partIdLabel").textContent = pid || "—";
    $("pieceSelect").value = pid;
    $("desc").value = pid ? "(Pièce introuvable dans les listes)" : "";
  }
}

/* ================= PARTS JSON LOAD ================= */
async function loadParts(){
  try{
    const res = await fetch(JSON_URL, { cache:"no-store" });
    if(!res.ok) throw new Error("JSON introuvable");
    const data = await res.json();

    // ton JSON = tableau [{id,nom,role,desc,circuit},...]
    if(Array.isArray(data)){
      partsBase = data
        .map(p=>({
          id: (p.id||"").toString(),
          nom: (p.nom||"").toString(),
          role:(p.role||"").toString(),
          desc:(p.desc||"").toString(),
          circuit:(p.circuit||"").toString()
        }))
        .filter(p=>p.id);
    } else {
      // fallback (si jamais)
      partsBase = [];
    }

    partsCustom = readCustomParts();
    mergeParts();
    fillPartsSelect();
  }catch(e){
    console.error(e);
    partsBase = [];
    partsCustom = readCustomParts();
    mergeParts();
    fillPartsSelect();
    $("desc").value = "⚠️ JSON non chargé. Vérifie qu'il est à la racine : quincy_310L_parts.json";
  }
}

/* ================= PANEL EVENTS ================= */
/* Choisir une pièce => applique à la zone active (si une zone est active) + affiche ses infos */
$("pieceSelect").addEventListener("change", ()=>{
  const id = $("pieceSelect").value;
  const p = getPartById(id);
  if(p) setPanelFromPart(p);
  else {
    $("partIdLabel").textContent = id || "—";
    // on ne wipe pas tout si l'utilisateur veut créer une nouvelle pièce
    if(!id) clearPanel();
  }

  const r = canvas.getActiveObject();
  if(r && r!==bg && r.type==="rect"){
    r.partId = id;
    saveZones();
    // rester cohérent : afficher panel de cette zone
    setPanelForZone(r);
  }
});

/* Ajouter / mettre à jour une pièce (localStorage) */
$("btnSavePart").addEventListener("click", ()=>{
  const nom = $("nom").value.trim();
  const role = $("role").value.trim();
  const desc = $("desc").value.trim();
  const circuit = $("circuit").value.trim();

  // id: si une pièce sélectionnée -> on garde son id, sinon on en crée un
  let id = ($("pieceSelect").value || "").trim();
  if(!id){
    id = slugify(nom);
  }
  if(!id){
    alert("Il faut au minimum un NOM (pour générer un ID).");
    return;
  }

  // enregistrer en custom (ajout ou override)
  partsCustom[id] = { id, nom: nom || id, role, desc, circuit };
  writeCustomParts(partsCustom);

  // refresh list + panel
  mergeParts();
  fillPartsSelect();

  // set selection + label
  $("pieceSelect").value = id;
  $("partIdLabel").textContent = id;

  // si une zone est active, associe automatiquement cette pièce
  const r = canvas.getActiveObject();
  if(r && r!==bg && r.type==="rect"){
    r.partId = id;
    saveZones();
  }

  setPanelFromPart(partsCustom[id]);
});

/* ================= TOOL ACTIONS ================= */
$("btnSelect").onclick = ()=>setActiveTool("select");
$("btnDraw").onclick   = ()=>setActiveTool("draw");
$("btnPan").onclick    = ()=>setActiveTool("pan");

$("btnErase").onclick  = ()=>{
  if(!isEditor) return;
  const r = canvas.getActiveObject();
  if(!r || r===bg || r.type!=="rect") return;
  canvas.remove(r);
  canvas.discardActiveObject();
  saveZones();
  clearPanel();
  canvas.requestRenderAll();
};

$("btnMode").onclick = ()=>{
  isEditor = !isEditor;
  applyModeVisibility();
};

$("btnFit").onclick = ()=>{
  resetViewToFit();
  clearPanel();
};

/* ================= CANVAS EVENTS ================= */
/* Click zone : affiche fiche dans tous les modes */
canvas.on("mouse:down", (opt)=>{
  const t = opt.target;
  if(!t || t===bg) return;
  if(tool==="pan") return;
  setPanelForZone(t);
  if(isEditor && tool==="select"){
    canvas.setActiveObject(t);
  }
});

/* Draw */
canvas.on("mouse:down", (opt)=>{
  if(!isEditor) return;
  if(tool!=="draw") return;
  if(opt.target && opt.target!==bg) return;

  drawing = true;
  startPt = canvas.getPointer(opt.e, true);
  curRect = makeZoneRect();
  curRect.set({ left:startPt.x, top:startPt.y, width:1, height:1 });
  canvas.add(curRect);
  canvas.setActiveObject(curRect);
});

canvas.on("mouse:move", (opt)=>{
  if(drawing && curRect){
    const p = canvas.getPointer(opt.e, true);
    const left = Math.min(p.x, startPt.x);
    const top  = Math.min(p.y, startPt.y);
    const w = Math.abs(p.x - startPt.x);
    const h = Math.abs(p.y - startPt.y);
    curRect.set({ left, top, width:w, height:h, scaleX:1, scaleY:1 });
    curRect.setCoords();
    canvas.requestRenderAll();
  }

  if(isPanning){
    const e = opt.e;
    const vpt = canvas.viewportTransform;
    vpt[4] += (e.clientX - lastClient.x);
    vpt[5] += (e.clientY - lastClient.y);
    lastClient = {x:e.clientX, y:e.clientY};
    canvas.setViewportTransform(vpt);
    canvas.requestRenderAll();
  }
});

canvas.on("mouse:up", ()=>{
  if(drawing && curRect){
    drawing = false;

    if(curRect.width < 10 || curRect.height < 10){
      canvas.remove(curRect);
      curRect = null;
      canvas.requestRenderAll();
      return;
    }

    updateImgBoxFromRect(curRect);
    curRect.partId = "";
    saveZones();

    setPanelForZone(curRect);
    $("pieceSelect").focus();

    curRect = null;
  }

  if(isPanning){
    isPanning = false;
    canvas.defaultCursor = (tool==="pan") ? "grab" : (tool==="draw" ? "crosshair" : "pointer");
  }
});

/* Pan */
canvas.on("mouse:down", (opt)=>{
  if(tool!=="pan") return;
  isPanning = true;
  lastClient = { x:opt.e.clientX, y:opt.e.clientY };
  canvas.defaultCursor = "grabbing";
});

/* Curseur stable */
canvas.on("mouse:over", ()=>{
  if(tool==="pan") canvas.defaultCursor = isPanning ? "grabbing" : "grab";
  else if(tool==="draw") canvas.defaultCursor = "crosshair";
  else canvas.defaultCursor = "pointer";
});

/* ================= ZOOM ================= */
function setZoom(z){
  zoom = Math.max(0.5, Math.min(3, z));
  const center = new fabric.Point(canvas.getWidth()/2, canvas.getHeight()/2);
  canvas.zoomToPoint(center, zoom);
  $("zoomRange").value = String(Math.round(zoom*100));
  $("zoomLabel").textContent = Math.round(zoom*100) + "%";
  canvas.requestRenderAll();
}

$("zoomRange").addEventListener("input", ()=>{
  setZoom(parseInt($("zoomRange").value,10)/100);
});

canvas.on("mouse:wheel", (opt)=>{
  const e = opt.e;
  if(!e.ctrlKey && !e.metaKey) return; // ctrl+molette
  e.preventDefault(); e.stopPropagation();
  const delta = e.deltaY;
  setZoom( zoom * (0.999 ** delta) );
});

/* ================= FULLSCREEN ================= */
$("btnFs").onclick = ()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
};

document.addEventListener("fullscreenchange", ()=>{
  document.body.classList.toggle("fs", !!document.fullscreenElement);
  setTimeout(()=>{ resizeCanvas(); fitBackgroundAndZones(); }, 80);
});

/* ================= IMAGE SELECT ================= */
function fillImageSelect(){
  $("imgSelect").innerHTML = "";
  IMAGES.forEach(i=>{
    const o = document.createElement("option");
    o.value = i.url;
    o.textContent = i.label;
    $("imgSelect").appendChild(o);
  });
  $("imgSelect").value = currentImage;
}

$("imgSelect").addEventListener("change", async ()=>{
  currentImage = $("imgSelect").value;
  await loadBackground(currentImage);
  clearPanel();
});

/* ================= INIT ================= */
(async function init(){
  fillImageSelect();
  setActiveTool("select");

  // parts (base + custom)
  await loadParts();

  // canvas size first
  resizeCanvas();

  // ✅ charge l'image par défaut : Fond référence (premier)
  await loadBackground(currentImage);

  // safety pass for GH Pages rendering timing
  setTimeout(()=>{ resizeCanvas(); fitBackgroundAndZones(); }, 60);

  applyModeVisibility();
  clearPanel();
})();
</script>

</body>
</html>
