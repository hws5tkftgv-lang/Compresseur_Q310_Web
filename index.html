<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L — Lecture / Éditeur</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
html,body{margin:0;background:#0c132e;color:#eaf1ff;font-family:system-ui}
.topbar{display:flex;gap:8px;align-items:center;padding:10px;background:#0f1a3f}
.btn{padding:7px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#1b2553;color:#fff;cursor:pointer}
.wrap{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px}
.stage{position:relative;background:#0b1536;border-radius:12px;overflow:hidden;height:65vh}
.panel{background:#0f1a44;border-radius:12px;padding:12px}
canvas{display:block}
.fs-btn{position:absolute;right:10px;bottom:10px;border-radius:999px}

body.fs-mode{overflow:hidden;background:#020617}
body.fs-mode .topbar{display:none}
body.fs-mode .wrap{position:fixed;inset:0;padding:0;margin:0;grid-template-columns:70% 30%}
body.fs-mode .stage,body.fs-mode .panel{border-radius:0;height:100vh}

.readonly{pointer-events:none;opacity:.85}
</style>
</head>

<body>

<div class="topbar">
  <b id="modeLabel">Lecture</b>
  <button id="toggleMode" class="btn">Passer en Éditeur</button>
  <button class="btn" onclick="tool='pan'">✋ Main</button>
  <button class="btn" onclick="tool='draw'">✏️ Dessiner</button>
  <button class="btn" onclick="tool='select'">🖱️ Sélection</button>
  <button id="btnDelete" class="btn">🗑️ Supprimer</button>
  Zoom <input id="zoom" type="range" min="25" max="300" value="100">
</div>

<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
    <button id="btnFsToggle" class="btn fs-btn">⤢ Plein écran</button>
  </div>

  <aside class="panel">
    <h3>Description</h3>
    <textarea id="desc" rows="12"></textarea>
  </aside>
</div>

<script>
const BG_URL="actif/compresseur_bg.png";
const JSON_URL="quincy_310L_parts.json";
const LS_KEY="q310_hotspots_v1";
const EDIT_PW="PROF";

const canvas=new fabric.Canvas("c",{selection:false});
let bgImg,isReading=true,parts=[],tool="pan";
let drawing=false,start=null,temp=null,pan=false,last=null;

/* ===== Resize & Fit ===== */
function resizeCanvas(){
  const s=document.querySelector(".stage");
  canvas.setWidth(s.clientWidth);
  canvas.setHeight(s.clientHeight);
  fitBG();
}
function fitBG(){
  if(!bgImg)return;
  canvas.setViewportTransform([1,0,0,1,0,0]);
  const cw=canvas.width,ch=canvas.height;
  const sc=Math.min(cw/bgImg.width,ch/bgImg.height);
  bgImg.scale(sc);
  bgImg.set({left:(cw-bgImg.width*sc)/2,top:(ch-bgImg.height*sc)/2});
  canvas.requestRenderAll();
}

/* ===== Load ===== */
async function loadAll(){
  parts=await fetch(JSON_URL).then(r=>r.json());
  fabric.Image.fromURL(BG_URL,img=>{
    bgImg=img;
    img.selectable=false;
    canvas.add(img);
    fitBG();
    loadZones();
  });
}

/* ===== Zones ===== */
function saveZones(){
  const z=canvas.getObjects().filter(o=>o!==bgImg).map(o=>({
    x:o.left,y:o.top,w:o.width*o.scaleX,h:o.height*o.scaleY,id:o.partId
  }));
  localStorage.setItem(LS_KEY,JSON.stringify(z));
}
function loadZones(){
  const raw=localStorage.getItem(LS_KEY);
  if(!raw)return;
  JSON.parse(raw).forEach(z=>{
    const r=new fabric.Rect({
      left:z.x,top:z.y,width:z.w,height:z.h,
      fill:"rgba(0,150,255,.25)",stroke:"#0096ff",strokeWidth:2
    });
    r.partId=z.id;
    canvas.add(r);
  });
}

/* ===== Tools ===== */
canvas.on("mouse:down",o=>{
  if(tool==="pan"){
    pan=true;last={x:o.e.clientX,y:o.e.clientY};
    return;
  }
  if(isReading||tool!=="draw")return;
  const p=canvas.getPointer(o.e);
  drawing=true;start=p;
  temp=new fabric.Rect({left:p.x,top:p.y,width:1,height:1,
    fill:"rgba(0,150,255,.25)",stroke:"#0096ff",strokeWidth:2});
  canvas.add(temp);
});
canvas.on("mouse:move",o=>{
  if(pan){
    canvas.relativePan(new fabric.Point(o.e.clientX-last.x,o.e.clientY-last.y));
    last={x:o.e.clientX,y:o.e.clientY};
    return;
  }
  if(!drawing||!temp)return;
  const p=canvas.getPointer(o.e);
  temp.set({
    left:Math.min(p.x,start.x),
    top:Math.min(p.y,start.y),
    width:Math.abs(p.x-start.x),
    height:Math.abs(p.y-start.y)
  });
  canvas.requestRenderAll();
});
canvas.on("mouse:up",()=>{
  pan=false;
  if(!drawing)return;
  drawing=false;
  const pid=prompt("ID de la pièce:");
  if(!pid){canvas.remove(temp);return;}
  temp.partId=pid.trim();
  temp=null;
  saveZones();
});

/* ===== Delete ===== */
document.getElementById("btnDelete").onclick=()=>{
  if(isReading)return;
  const o=canvas.getActiveObject();
  if(o&&o!==bgImg){canvas.remove(o);saveZones();}
};

/* ===== Click Lecture ===== */
canvas.on("mouse:down",o=>{
  if(!isReading||!o.target||o.target===bgImg)return;
  const p=parts.find(x=>x.id===o.target.partId);
  document.getElementById("desc").value=p?`${p.nom}\n\n${p.desc}`:"Pièce inconnue";
});

/* ===== Zoom ===== */
document.getElementById("zoom").oninput=e=>{
  canvas.zoomToPoint(
    new fabric.Point(canvas.width/2,canvas.height/2),
    e.target.value/100
  );
};

/* ===== Mode ===== */
function applyLecture(on){
  isReading=on;
  document.getElementById("modeLabel").textContent=on?"Lecture":"Éditeur";
  document.getElementById("desc").readOnly=on;
  document.getElementById("desc").classList.toggle("readonly",on);
}
document.getElementById("toggleMode").onclick=()=>{
  if(isReading){
    if(prompt("Mot de passe")!==EDIT_PW)return;
    applyLecture(false);
  }else applyLecture(true);
};

/* ===== Fullscreen ===== */
document.getElementById("btnFsToggle").onclick=()=>{
  document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
};
document.addEventListener("fullscreenchange",()=>{
  document.body.classList.toggle("fs-mode",!!document.fullscreenElement);
  setTimeout(resizeCanvas,80);
});

window.addEventListener("resize",resizeCanvas);
resizeCanvas();
loadAll();
applyLecture(true);
</script>

</body>
</html>
