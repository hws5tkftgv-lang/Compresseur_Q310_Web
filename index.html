<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Analyse pédagogique</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
html,body{
  margin:0;
  background:#0b1436;
  color:#eaf1ff;
  font-family:Arial,Segoe UI,sans-serif;
}

.topbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:#0f1a3f;
}

.btn{
  padding:6px 12px;
  background:#1b2553;
  color:#fff;
  border:1px solid rgba(255,255,255,.2);
  border-radius:8px;
  cursor:pointer;
}
.btn.active{background:#0078ff}

.select{
  background:#101a40;
  color:#fff;
  border-radius:6px;
  padding:6px;
}

.zoom{
  display:flex;
  align-items:center;
  gap:6px;
}

.wrap{
  display:grid;
  grid-template-columns:1fr 320px;
  gap:12px;
  padding:12px;
}

.stage{
  background:#0b1536;
  border-radius:12px;
  overflow:hidden;
}

.panel{
  background:#0f1a44;
  border-radius:12px;
  padding:12px;
}

canvas{display:block}

body.fs .wrap{
  position:fixed;
  inset:0;
  padding:8px;
}
</style>
</head>

<body>

<div class="topbar">
  <b id="modeLabel">Lecture</b>
  <button id="btnMode" class="btn">Éditeur</button>

  <select id="imgSelect" class="select"></select>

  <button id="btnSelect" class="btn active">🖱</button>
  <button id="btnDraw" class="btn">✏️</button>
  <button id="btnPan" class="btn">✋</button>
  <button id="btnErase" class="btn">🧽</button>

  <div class="zoom">
    Zoom
    <input id="zoomRange" type="range" min="50" max="250" value="100">
    <span id="zoomLabel">100%</span>
  </div>

  <button id="btnFs" class="btn">⤢</button>
</div>

<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
  </div>

  <aside class="panel">
    <h3>Zone</h3>
    <label>Pièce</label>
    <select id="pieceSelect" class="select"></select>
    <label>Description</label>
    <textarea id="desc" style="width:100%;height:160px"></textarea>
  </aside>
</div>

<script>
/* ================= CONFIG ================= */
const IMAGES=[
  {label:"Compresseur",url:"actif/compresseur_bg.png"},
];
const JSON_URL="quincy_310L_parts.json";

/* ================= GLOBAL ================= */
const canvas=new fabric.Canvas("c",{selection:false});
let bg=null,isEditor=false,tool="select",zoom=1,currentImage=IMAGES[0].url;
let parts=[];

/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
const LS=url=>"zones_"+url;

/* ================= IMAGE ================= */
function fit(){
  canvas.setWidth(document.querySelector(".stage").clientWidth);
  canvas.setHeight(document.querySelector(".stage").clientHeight);
  const s=Math.min(canvas.width/bg.width,canvas.height/bg.height);
  bg.scale(s);
  bg.left=(canvas.width-bg.width*s)/2;
  bg.top =(canvas.height-bg.height*s)/2;
  canvas.sendToBack(bg);
}

function loadImage(url){
  canvas.clear();
  fabric.Image.fromURL(url,img=>{
    bg=img;
    bg.selectable=false;
    canvas.add(bg);
    fit();
    loadZones();
  });
}

/* ================= ZONES ================= */
function saveZones(){
  const z=canvas.getObjects().filter(o=>o!==bg).map(r=>({
    l:r.left,t:r.top,w:r.width,h:r.height,p:r.partId
  }));
  localStorage.setItem(LS(currentImage),JSON.stringify(z));
}

function loadZones(){
  const raw=localStorage.getItem(LS(currentImage));
  if(!raw)return;
  JSON.parse(raw).forEach(z=>{
    const r=new fabric.Rect({
      left:z.l,top:z.t,width:z.w,height:z.h,
      fill:"rgba(0,150,255,.25)",
      stroke:"#09f",strokeWidth:2
    });
    r.partId=z.p;
    canvas.add(r);
  });
  applyMode();
}

/* ================= MODE ================= */
function applyMode(){
  canvas.getObjects().forEach(o=>{
    if(o===bg)return;
    o.selectable=isEditor;
    o.opacity=isEditor?1:0;
    o.evented=true;
  });
  canvas.requestRenderAll();
}

$("btnMode").onclick=()=>{
  isEditor=!isEditor;
  $("modeLabel").textContent=isEditor?"Éditeur":"Lecture";
  applyMode();
};

/* ================= TOOLS ================= */
$("btnSelect").onclick=()=>tool="select";
$("btnDraw").onclick=()=>tool="draw";
$("btnPan").onclick=()=>tool="pan";
$("btnErase").onclick=()=>{
  const o=canvas.getActiveObject();
  if(o&&o!==bg){canvas.remove(o);saveZones();}
};

/* ================= DRAW ================= */
let drawing=false,start={},rect=null;

canvas.on("mouse:down",e=>{
  if(!isEditor)return;
  const p=canvas.getPointer(e.e);
  if(tool==="draw"){
    drawing=true;
    start=p;
    rect=new fabric.Rect({
      left:p.x,top:p.y,width:1,height:1,
      fill:"rgba(0,150,255,.25)",
      stroke:"#09f",strokeWidth:2
    });
    canvas.add(rect);
  }
  if(tool==="pan"){
    canvas.isDragging=true;
    canvas.lastPosX=e.e.clientX;
    canvas.lastPosY=e.e.clientY;
  }
});

canvas.on("mouse:move",e=>{
  if(drawing){
    const p=canvas.getPointer(e.e);
    rect.set({
      left:Math.min(p.x,start.x),
      top:Math.min(p.y,start.y),
      width:Math.abs(p.x-start.x),
      height:Math.abs(p.y-start.y)
    });
    canvas.requestRenderAll();
  }
  if(canvas.isDragging){
    const vpt=canvas.viewportTransform;
    vpt[4]+=e.e.clientX-canvas.lastPosX;
    vpt[5]+=e.e.clientY-canvas.lastPosY;
    canvas.lastPosX=e.e.clientX;
    canvas.lastPosY=e.e.clientY;
    canvas.requestRenderAll();
  }
});

canvas.on("mouse:up",()=>{
  if(drawing){
    drawing=false;
    canvas.setActiveObject(rect);
    saveZones();
  }
  canvas.isDragging=false;
});

/* ================= ZOOM ================= */
$("zoomRange").oninput=e=>{
  zoom=e.target.value/100;
  canvas.setZoom(zoom);
  $("zoomLabel").textContent=Math.round(zoom*100)+"%";
};

canvas.on("mouse:wheel",opt=>{
  opt.e.preventDefault();
  zoom+=opt.e.deltaY*-0.001;
  zoom=Math.min(3,Math.max(0.5,zoom));
  canvas.setZoom(zoom);
  $("zoomRange").value=Math.round(zoom*100);
  $("zoomLabel").textContent=Math.round(zoom*100)+"%";
});

/* ================= FULLSCREEN ================= */
$("btnFs").onclick=()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else document.exitFullscreen();
};
document.addEventListener("fullscreenchange",()=>{
  document.body.classList.toggle("fs",!!document.fullscreenElement);
  setTimeout(fit,50);
});

/* ================= JSON ================= */
fetch(JSON_URL).then(r=>r.json()).then(d=>{
  parts=d;
  d.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id;
    o.textContent=p.id+" – "+p.name;
    $("pieceSelect").appendChild(o);
  });
});

/* ================= SELECT ================= */
canvas.on("mouse:down",opt=>{
  if(!opt.target||opt.target===bg)return;
  const p=parts.find(x=>x.id===opt.target.partId);
  $("pieceSelect").value=opt.target.partId||"";
  $("desc").value=p?p.description:"";
});

/* ================= INIT ================= */
IMAGES.forEach(i=>{
  const o=document.createElement("option");
  o.value=i.url;o.textContent=i.label;
  $("imgSelect").appendChild(o);
});
$("imgSelect").onchange=e=>{
  currentImage=e.target.value;
  loadImage(currentImage);
};
loadImage(currentImage);
window.addEventListener("resize",fit);
</script>

</body>
</html>
