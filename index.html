<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <!-- Important pour iPhone plus tard; sans impact PC -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Quincy 310L – DIAGNOSTIC (PC)</title>
  <!-- Fabric.js depuis jsDelivr -->
  <script>
    // Affiche toute erreur JS à l’écran
    (function(){
      const box = document.createElement('div');
      box.id = 'errbox';
      box.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#7a1e1e;color:#fff;padding:8px 10px;border-radius:8px;display:none;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial';
      document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(box));
      function show(msg){ box.innerHTML = '❌ ' + msg; box.style.display = 'block'; }
      window.__showErr = show;
      window.addEventListener('error',e=>{ show(e.message + ' — ' + (e.filename||'') + ':' + (e.lineno||0)); });
      window.addEventListener('unhandledrejection',e=>{ show('Promise rejetée: ' + (e.reason && (e.reason.message||e.reason)) ); });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
  <style>
    :root{ color-scheme: dark }
    *{ box-sizing:border-box }
    html,body{ margin:0; height:100% }
    body{ background:#0c132e; color:#eaf1ff; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif }
    .topbar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#0f1a3f;border-bottom:1px solid rgba(255,255,255,.08)}
    .btn, select{padding:7px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:#1b2553;color:#eaf1ff;cursor:pointer}
    .wrap{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px}
    @media(max-width:1000px){.wrap{grid-template-columns:1fr}}
    .stage{background:#0b1536;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;min-height:70vh}
    canvas{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .panel{padding:12px;background:#0f1a44;border:1px solid rgba(255,255,255,.10);border-radius:12px}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#0f8a2a;color:#fff;padding:9px 12px;border-radius:10px;display:none;box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:10000}
    .row{margin:8px 0}
  </style>
</head>
<body>
  <div class="topbar">
    <button id="btnTest" class="btn">🔧 Test boutons</button>
    <button id="btnFit" class="btn">🖼️ Ajuster</button>
    <label>Image :
      <select id="bgSelect">
        <!-- NOMS EXACTS dans ./actif/ -->
        <option value="compresseur_bg.png">compresseur_bg.png</option>
        <option value="TETE.jpeg">TETE.jpeg</option>
        <option value="TETE_2.jpeg">TETE_2.jpeg</option>
        <option value="VUE_GENERAL.jpeg">VUE_GENERAL.jpeg</option>
        <option value="VUE_GENARAL_2.jpeg">VUE_GENARAL_2.jpeg</option>
        <option value="VERS_RESERVOIR.jpeg">VERS_RESERVOIR.jpeg</option>
        <option value="VERS_RESERVOIR_2.jpeg">VERS_RESERVOIR_2.jpeg</option>
        <option value="VUE_POMPE.jpeg">VUE_POMPE.jpeg</option>
        <option value="LOAD_SIDE.jpeg">LOAD_SIDE.jpeg</option>
        <option value="SOUPAPE_UNLOADER.jpeg">SOUPAPE_UNLOADER.jpeg</option>
        <option value="POULIE.jpeg">POULIE.jpeg</option>
        <option value="FILTRE_AIR_COUVERCLE.jpeg">FILTRE_AIR_COUVERCLE.jpeg</option>
        <option value="TOP.jpeg">TOP.jpeg</option>
      </select>
    </label>
    <span style="flex:1"></span>
    <span id="status" style="opacity:.85">⏳ Initialisation…</span>
  </div>

  <div class="wrap">
    <div class="stage"><canvas id="c"></canvas></div>
    <aside class="panel">
      <h3>🩺 Diagnostic</h3>
      <div class="row">Fabric chargé : <b id="fok">non</b></div>
      <div class="row">Image courante : <b id="imgName">—</b></div>
      <div class="row">Taille canvas : <b id="sz">—</b></div>
      <div class="row">Dernière action : <b id="last">—</b></div>
      <div class="row" style="font-size:.9rem;opacity:.9">
        Si rien ne réagit :
        <ul>
          <li>Forcer le rechargement : <b>Ctrl+F5</b></li>
          <li>Vérifier que la page est servie via <b>http(s)</b> (pas <code>file://</code>)</li>
          <li>Vérifier l’existence de <code>/actif/&lt;image&gt;</code> (casse identique)</li>
        </ul>
      </div>
    </aside>
  </div>

  <div id="toast" class="toast">OK</div>

  <script>
  (function(){
    const status = (msg)=>{ document.getElementById('status').textContent = msg; };
    const set = (id,val)=>{ document.getElementById(id).textContent = val; };
    const toastEl = document.getElementById('toast');
    let toastTimer=null;
    function toast(msg){ toastEl.textContent=msg||'OK'; toastEl.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.style.display='none',1400); }
    function log(msg){ set('last', msg); }

    // 1) Vérif Fabric
    if(!window.fabric){
      __showErr('Fabric.js n’a pas été chargé. Le CDN est-il bloqué ?');
      set('fok','❌ non'); status('Erreur: Fabric non chargé');
      // On n’essaie pas plus loin si Fabric absent
      // Astuce: connecte-toi à Internet ou change de réseau / VPN; réessaie.
      return;
    } else {
      set('fok','✅ oui (v'+(fabric?.version||'?')+')');
    }

    // 2) Canvas de base
    const canvas = new fabric.Canvas('c', { selection:false, preserveObjectStacking:true, backgroundColor:'#0b1536' });
    function resize(){
      const stage = document.querySelector('.stage');
      const w = stage.clientWidth;
      const h = Math.max(560, window.innerHeight*0.70);
      canvas.setWidth(w); canvas.setHeight(h);
      set('sz', w+' × '+h);
      canvas.requestRenderAll();
    }
    window.addEventListener('resize', resize, {passive:true});
    resize();

    // 3) Charger l’image de fond (robuste)
    let bgImg = null, FIT_MODE = 'contain';
    function setBgScale(){
      if(!bgImg) return;
      const cw=canvas.getWidth(), ch=canvas.getHeight(), iw=bgImg.width, ih=bgImg.height;
      const s = (FIT_MODE==='contain') ? Math.min(cw/iw, ch/ih) : Math.max(cw/iw, ch/ih);
      const left=(cw-iw*s)/2, top=(ch-ih*s)/2;
      bgImg.scale(s); bgImg.set({left, top});
      canvas.setBackgroundImage(bgImg, canvas.requestRenderAll.bind(canvas));
    }
    function loadBackgroundFrom(path){
      return new Promise((resolve, reject)=>{
        const im = new Image();
        im.onload = ()=>resolve(im);
        im.onerror = ()=>reject(new Error('Introuvable: '+path));
        // cache-bust pour éviter vieilles versions
        im.src = path + (path.startsWith('blob:') ? '' : ('?t='+Date.now()));
      }).then(im=>{
        bgImg = new fabric.Image(im, { originX:'left', originY:'top' });
        bgImg.objectCaching = false;
        setBgScale();
        canvas.requestRenderAll();
        return true;
      });
    }

    // 4) UI
    const bgSelect = document.getElementById('bgSelect');
    document.getElementById('btnTest').addEventListener('click', ()=>{
      toast('Boutons OK');
      log('Bouton Test cliqué');
    });
    document.getElementById('btnFit').addEventListener('click', ()=>{
      FIT_MODE = (FIT_MODE==='contain' ? 'cover' : 'contain');
      setBgScale(); canvas.setViewportTransform([1,0,0,1,0,0]);
      toast('Ajuster: '+FIT_MODE);
      log('Ajuster: '+FIT_MODE);
    });

    bgSelect.addEventListener('change', async ()=>{
      const f = bgSelect.value;
      set('imgName', f);
      try{
        await loadBackgroundFrom('./actif/'+f);
        status('Image chargée: '+f);
        log('Image chargée');
      }catch(e){
        __showErr(e.message + ' (./actif/'+f+')');
        status('Erreur image');
      }
    });

    // 5) Chargement initial
    (async function init(){
      status('Initialisation…');
      const first = bgSelect.value || 'compresseur_bg.png';
      set('imgName', first);
      try{
        await loadBackgroundFrom('./actif/'+first);
        status('Prêt ✅');
        log('Init OK');
        // Ajoute une zone de test pour vérifier la sélection
        const r = new fabric.Rect({left:40, top:40, width:160, height:90, fill:'rgba(0,160,255,0.18)', stroke:'#00a0ff', strokeWidth:2, rx:6, ry:6});
        canvas.add(r); canvas.bringToFront(r);
        canvas.on('mouse:up',(e)=>{ if(e.target===r){ toast('Zone test sélectionnée'); log('Zone test cliquée'); } });
      }catch(e){
        __showErr(e.message + ' (./actif/'+first+')');
        status('Erreur: impossible de charger l’image initiale');
      }
    })();
  })();
  </script>
</body>
</html>
