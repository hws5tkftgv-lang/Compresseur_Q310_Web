<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Quincy 310L – Zones interactives</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- FABRIC.JS -->
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif}
header{
  display:flex;gap:10px;align-items:center;
  padding:10px;border-bottom:1px solid #ccc
}
main{
  display:grid;
  grid-template-columns:1fr 340px;
  height:calc(100vh - 52px)
}
#canvasWrap{background:#111;overflow:hidden}
canvas{display:block}
aside{
  padding:10px;border-left:1px solid #ccc;overflow:auto
}
h3{margin-top:0}
strong{display:block;margin-top:10px}
select,button{width:100%;margin-top:6px;padding:6px}
</style>
</head>

<body>

<header>
  <strong>Quincy 310L</strong>

  <label>
    <input type="checkbox" id="modeToggle">
    Mode éditeur
  </label>

  <select id="imageSelect"></select>

  <button id="zoomIn">+</button>
  <button id="zoomOut">−</button>
  <button id="resetView">Reset</button>
</header>

<main>
  <div id="canvasWrap">
    <canvas id="c"></canvas>
  </div>

  <aside>
    <h3 id="part-name">—</h3>

    <strong>Rôle</strong>
    <div id="part-role">—</div>

    <strong>Description</strong>
    <div id="part-description">—</div>

    <strong>Référence manuel</strong>
    <div id="part-manual">—</div>

    <hr>

    <select id="partSelect" disabled>
      <option value="">— Associer une pièce —</option>
    </select>

    <button id="drawRect" disabled>Dessiner une zone</button>
    <button id="deleteRect" disabled>Supprimer la zone</button>
    <button id="saveZones" disabled>Sauvegarder</button>
  </aside>
</main>

<script>
/* ===================== CONFIG ===================== */
const IMAGES = [
  { id:"compresseur_bg.png", src:"images/IMG_0001.jpg" }
];
const PARTS_URL = "quincy_310L_parts.json";
const LS_KEY = "quincy310L_";

/* ===================== DOM ===================== */
const canvasWrap = document.getElementById("canvasWrap");
const canvas = new fabric.Canvas("c");

const modeToggle = document.getElementById("modeToggle");
const imageSelect = document.getElementById("imageSelect");

const partName = document.getElementById("part-name");
const partRole = document.getElementById("part-role");
const partDesc = document.getElementById("part-description");
const partManual = document.getElementById("part-manual");

const partSelect = document.getElementById("partSelect");
const drawBtn = document.getElementById("drawRect");
const delBtn = document.getElementById("deleteRect");
const saveBtn = document.getElementById("saveZones");

const zoomIn = document.getElementById("zoomIn");
const zoomOut = document.getElementById("zoomOut");
const resetView = document.getElementById("resetView");

/* ===================== STATE ===================== */
let partsData = {};
let currentImage = IMAGES[0];
let editor = false;
let drawing = false;
let start = null;
let tempRect = null;
let zoom = 1;

/* ===================== INIT ===================== */
init();

async function init(){
  resize();
  window.addEventListener("resize", resize);

  await loadParts();
  initImages();
  loadImage(currentImage);

  bindUI();
  setEditor(false);
}

/* ===================== LOAD PARTS ===================== */
async function loadParts(){
  const res = await fetch(PARTS_URL);
  partsData = await res.json();

  for(const id in partsData){
    const o = document.createElement("option");
    o.value = id;
    o.textContent = partsData[id].name || id;
    partSelect.appendChild(o);
  }
}

/* ===================== IMAGES ===================== */
function initImages(){
  IMAGES.forEach(img=>{
    const o = document.createElement("option");
    o.value = img.id;
    o.textContent = img.id;
    imageSelect.appendChild(o);
  });
}

function loadImage(img){
  canvas.clear();
  fabric.Image.fromURL(img.src, i=>{
    canvas.setBackgroundImage(i, canvas.renderAll.bind(canvas),{
      scaleX: canvas.width / i.width,
      scaleY: canvas.height / i.height
    });
    loadZones();
  });
}

/* ===================== UI ===================== */
function bindUI(){
  modeToggle.onchange = e => setEditor(e.target.checked);

  drawBtn.onclick = ()=> drawing = !drawing;
  delBtn.onclick = ()=> {
    const o = canvas.getActiveObject();
    if(o) canvas.remove(o);
  };
  saveBtn.onclick = saveZones;

  partSelect.onchange = ()=>{
    const o = canvas.getActiveObject();
    if(!o) return;
    o.partId = partSelect.value;
    showInfo(o.partId);
  };

  imageSelect.onchange = ()=>{
    currentImage = IMAGES.find(i=>i.id===imageSelect.value);
    loadImage(currentImage);
  };

  zoomIn.onclick = ()=> setZoom(zoom*1.2);
  zoomOut.onclick = ()=> setZoom(zoom/1.2);
  resetView.onclick = ()=> setZoom(1);
}

/* ===================== CANVAS ===================== */
canvas.on("mouse:down", opt=>{
  if(editor && drawing){
    start = canvas.getPointer(opt.e);
    tempRect = new fabric.Rect({
      left:start.x, top:start.y, width:1, height:1,
      fill:"rgba(0,150,255,.2)", stroke:"blue", strokeWidth:2
    });
    tempRect.partId = "";
    canvas.add(tempRect);
  }
  if(!editor && opt.target?.partId){
    showInfo(opt.target.partId);
  }
});

canvas.on("mouse:move", opt=>{
  if(!tempRect) return;
  const p = canvas.getPointer(opt.e);
  tempRect.set({
    width: Math.abs(p.x-start.x),
    height: Math.abs(p.y-start.y)
  });
  canvas.renderAll();
});

canvas.on("mouse:up", ()=> tempRect=null);

canvas.on("selection:created", e=>selectRect(e.selected[0]));
canvas.on("selection:updated", e=>selectRect(e.selected[0]));

/* ===================== HELPERS ===================== */
function resize(){
  canvas.setWidth(canvasWrap.clientWidth);
  canvas.setHeight(canvasWrap.clientHeight);
  canvas.renderAll();
}

function setEditor(on){
  editor = on;
  partSelect.disabled = !on;
  drawBtn.disabled = !on;
  delBtn.disabled = !on;
  saveBtn.disabled = !on;

  canvas.getObjects().forEach(o=>{
    o.selectable = on;
    o.fill = on ? "rgba(0,150,255,.2)" : "transparent";
    o.stroke = on ? "blue" : "transparent";
  });
  canvas.renderAll();
}

function selectRect(o){
  if(!o?.partId) return;
  partSelect.value = o.partId;
  showInfo(o.partId);
}

function showInfo(id){
  const p = partsData[id];
  if(!p) return;
  partName.textContent = p.name || id;
  partRole.textContent = p.role || "—";
  partDesc.textContent = p.description || "—";
  partManual.textContent = p.manual_page || "—";
}

function saveZones(){
  const data = canvas.getObjects().map(o=>({
    left:o.left, top:o.top,
    width:o.width*o.scaleX,
    height:o.height*o.scaleY,
    partId:o.partId||""
  }));
  localStorage.setItem(LS_KEY+currentImage.id, JSON.stringify(data));
  alert("Zones sauvegardées");
}

function loadZones(){
  const raw = localStorage.getItem(LS_KEY+currentImage.id);
  if(!raw) return;
  JSON.parse(raw).forEach(z=>{
    const r = new fabric.Rect({
      left:z.left, top:z.top,
      width:z.width, height:z.height,
      fill:"rgba(0,150,255,.2)", stroke:"blue", strokeWidth:2
    });
    r.partId = z.partId;
    canvas.add(r);
  });
}

function setZoom(z){
  zoom = z;
  canvas.setZoom(zoom);
}
</script>

</body>
</html>
