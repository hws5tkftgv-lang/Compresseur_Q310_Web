<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Zones interactives</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root { color-scheme: dark; }
*{ box-sizing:border-box; }
html,body{ margin:0; background:#0b1436; color:#eaf1ff; font-family:Arial,Segoe UI,sans-serif; }

/* ===== TOPBAR ===== */
.topbar{
  display:flex; align-items:center; gap:8px;
  padding:10px; background:#0f1a3f;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky; top:0; z-index:10000;
}
.pill{
  padding:6px 10px; border-radius:999px;
  border:1px solid rgba(255,255,255,.18);
  background:#121c45; font-size:13px;
}
.btn{
  padding:7px 12px; background:#1b2553; color:#fff;
  border:1px solid rgba(255,255,255,.18); border-radius:8px;
  cursor:pointer; font-weight:700; font-size:13px;
}
.btn.active{ background:#0078ff; }
.btn.danger{ background:#7f1d2d; }
.select{
  background:#101a40; color:#fff;
  border-radius:8px; padding:7px 10px;
  border:1px solid rgba(255,255,255,.18);
}

/* ===== LAYOUT ===== */
.wrap{
  display:grid; grid-template-columns:1fr 360px;
  gap:12px; padding:12px;
}
.stage{
  background:#0b1536; border-radius:12px;
  overflow:hidden; position:relative;
  min-height:78vh;
}

/* ===== MEDIA + CANVAS ===== */
.media-layer, #c{
  position:absolute; inset:0;
  width:100%; height:100%;
}

#imgLayer, #videoLayer{
  position:absolute;
  display:none;
  left:0; top:0;
  width:0; height:0;
}

#videoLayer{
  pointer-events:auto;
}

/* 🔑 GESTION DES CLICS VIDÉO */
.video-reading #c{ pointer-events:none; }
.video-editing #c{ pointer-events:auto; }

/* ===== PANEL ===== */
.panel{
  background:#0f1a44; border-radius:12px;
  padding:12px; display:flex;
  flex-direction:column; gap:10px;
}
textarea,input{
  width:100%; background:#101a40; color:#fff;
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px; padding:10px;
}
textarea{ min-height:90px; }
</style>
</head>

<body>

<div class="topbar">
  <span class="pill"><b id="modeLabel">Mode : Lecture</b></span>
  <button id="btnMode" class="btn">Basculer Éditeur</button>

  <select id="imgSelect" class="select"></select>

  <button id="btnSelect" class="btn active">🖱</button>
  <button id="btnDraw" class="btn">✏️</button>
  <button id="btnPan" class="btn">✋</button>
  <button id="btnErase" class="btn danger">🧽</button>
</div>

<div class="wrap">
  <div class="stage video-reading" id="stage">
    <div class="media-layer" id="mediaLayer">
      <img id="imgLayer">
      <video id="videoLayer" controls playsinline></video>
    </div>
    <canvas id="c"></canvas>
  </div>

  <aside class="panel">
    <h3>Fiche de la zone</h3>
    <select id="pieceSelect" class="select"></select>
    <input id="nom" placeholder="Nom">
    <textarea id="role" placeholder="Rôle"></textarea>
    <textarea id="desc" placeholder="Description"></textarea>
    <input id="circuit" placeholder="Circuit">
    <button id="btnSavePart" class="btn">💾 Sauvegarder</button>
  </aside>
</div>

<script>
/* ================= CONFIG ================= */
const IMAGES = [
  { label:"Fond référence", url:"actif/compresseur_bg.png" },
  { label:"Animation – Compresseur 2 stages", url:"video:actif/compresseur 2 stages.mp4" }
];

const $ = id => document.getElementById(id);
const stageEl = $("stage");
const imgEl = $("imgLayer");
const videoEl = $("videoLayer");

/* ================= CANVAS ================= */
const canvas = new fabric.Canvas("c",{selection:false});
let isEditor=false;
let mediaType="image";

/* ================= MEDIA SWITCH ================= */
async function showMedia(url){
  imgEl.style.display="none";
  videoEl.style.display="none";
  videoEl.pause();

  mediaType = url.startsWith("video:") ? "video" : "image";

  if(mediaType==="image"){
    imgEl.src=url;
    imgEl.onload=()=>{
      imgEl.style.display="block";
      stageEl.classList.remove("video-reading","video-editing");
      canvas.setBackgroundImage(imgEl,canvas.renderAll.bind(canvas));
    };
  }else{
    videoEl.src=url.replace("video:","");
    videoEl.style.display="block";
    stageEl.classList.add("video-reading");
  }
}

/* ================= MODE ================= */
$("btnMode").onclick=()=>{
  isEditor=!isEditor;
  $("modeLabel").textContent=isEditor?"Mode : Éditeur":"Mode : Lecture";

  if(mediaType==="video"){
    stageEl.classList.toggle("video-editing",isEditor);
    stageEl.classList.toggle("video-reading",!isEditor);
  }

  canvas.getObjects().forEach(o=>{
    o.selectable=isEditor;
    o.opacity=isEditor?1:0;
  });
};

/* ================= TOOLS ================= */
$("btnDraw").onclick=()=>{
  let r=new fabric.Rect({
    left:100,top:100,width:100,height:80,
    fill:"rgba(0,150,255,0.2)",
    stroke:"cyan",strokeWidth:2
  });
  canvas.add(r);
};

/* ================= IMAGE SELECT ================= */
function fillSelect(){
  IMAGES.forEach(i=>{
    let o=document.createElement("option");
    o.value=i.url; o.textContent=i.label;
    $("imgSelect").appendChild(o);
  });
}
$("imgSelect").onchange=e=>showMedia(e.target.value);

/* ================= INIT ================= */
fillSelect();
showMedia(IMAGES[0].url);
</script>

</body>
</html>
