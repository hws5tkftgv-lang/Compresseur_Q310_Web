<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Zones interactives</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
/* ===== STYLE ORIGINAL (INCHANGÉ) ===== */
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#0b1436;color:#eaf1ff;font-family:Arial,Segoe UI,sans-serif}
.topbar{display:flex;align-items:center;gap:8px;padding:10px;background:#0f1a3f;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:9999}
.pill{padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:#121c45;font-size:13px}
.btn{padding:7px 12px;background:#1b2553;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
.btn:hover{filter:brightness(1.06)}
.btn.active{background:#0078ff;border-color:#0053ad}
.btn.danger{background:#7f1d2d;border-color:#5f1622}
.select{background:#101a40;color:#fff;border-radius:8px;padding:7px 10px;border:1px solid rgba(255,255,255,.18)}
.zoom{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#121c45}
.zoom input[type=range]{width:160px}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:12px;padding:12px}
.stage{background:#0b1536;border-radius:12px;overflow:hidden;min-height:78vh;position:relative}
.panel{background:#0f1a44;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:78vh}
.panel h3{margin:0;font-size:15px}
.small{font-size:12px;opacity:.85;line-height:1.3}
.hr{height:1px;background:rgba(255,255,255,.12);margin:6px 0}
label{font-size:12px;opacity:.9}
textarea{width:100%;min-height:180px;resize:vertical;background:#101a40;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px}
canvas{display:block}
body.fs .wrap{position:fixed;inset:56px 0 0 0;padding:8px;margin:0}
body.fs .stage,body.fs .panel{height:calc(100vh - 56px - 16px);min-height:unset}
</style>
</head>

<body>

<div class="topbar">
  <span class="pill"><b id="modeLabel">Mode : Lecture</b></span>
  <button id="btnMode" class="btn">Basculer Éditeur</button>

  <select id="imgSelect" class="select"></select>

  <button id="btnSelect" class="btn active">🖱</button>
  <button id="btnDraw" class="btn">✏️</button>
  <button id="btnPan" class="btn">✋</button>
  <button id="btnErase" class="btn danger">🧽</button>

  <div class="zoom">
    <b>Zoom</b>
    <input id="zoomRange" type="range" min="50" max="250" value="100">
    <span id="zoomLabel">100%</span>
  </div>

  <button id="btnFit" class="btn">⤡ Ajuster</button>
  <button id="btnFs" class="btn">⤢ Plein écran</button>
</div>

<div class="wrap">
  <div class="stage"><canvas id="c"></canvas></div>

  <aside class="panel">
    <h3>🟦 Fiche de la zone</h3>
    <div class="small">
      Lecture : zones invisibles mais cliquables.<br>
      Éditeur : dessin / sélection / pan / suppression.
    </div>

    <div class="hr"></div>

    <label>Pièce (JSON)</label>
    <select id="pieceSelect" class="select"></select>

    <label>Description</label>
    <textarea id="desc" readonly></textarea>

    <div class="small" style="margin-top:auto">
      Sauvegarde locale automatique par image
    </div>
  </aside>
</div>

<script>
/* ================= CONFIG ================= */
const JSON_URL = "quincy_310L_parts.json";
const IMAGES = [{ label:"compresseur_bg.png", url:"actif/compresseur_bg.png" }];

/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
const LS=img=>"q310_zones_v3::"+img;

/* ================= STATE ================= */
const canvas=new fabric.Canvas("c",{selection:false,preserveObjectStacking:true});
let bg=null,isEditor=false,tool="select",zoom=1,currentImage=IMAGES[0].url;
let partsIndex=[],drawing=false,startPt=null,curRect=null,isPanning=false,lastClient=null;

/* ================= PARTS JSON (FIX FINAL) ================= */
async function loadParts(){
  $("pieceSelect").innerHTML='<option value="">— choisir —</option>';
  partsIndex=[];
  try{
    const res=await fetch(JSON_URL,{cache:"no-store"});
    const data=await res.json();
    if(!Array.isArray(data)){
      for(const id in data){
        const p=data[id];
        partsIndex.push({
          id,
          name:p.name||id,
          desc:p.description||p.desc||"",
        });
      }
    }else{
      data.forEach(p=>{
        if(p.id) partsIndex.push({id:p.id,name:p.name||p.id,desc:p.description||""});
      });
    }
    partsIndex.forEach(it=>{
      const o=document.createElement("option");
      o.value=it.id;
      o.textContent=`${it.id} — ${it.name}`;
      $("pieceSelect").appendChild(o);
    });
  }catch(e){
    $("desc").value="⚠️ JSON non chargé";
  }
}

/* ================= ZONES ================= */
function makeZone(){
  return new fabric.Rect({
    fill:"rgba(0,150,255,.12)",
    stroke:"rgba(0,150,255,.95)",
    strokeWidth:2,lockRotation:true
  });
}
function getZones(){return canvas.getObjects().filter(o=>o!==bg)}
function saveZones(){
  const z=getZones().map(r=>({box:r._imgBox,partId:r.partId||""}));
  localStorage.setItem(LS(currentImage),JSON.stringify(z));
}
function loadZones(){
  getZones().forEach(z=>canvas.remove(z));
  const raw=localStorage.getItem(LS(currentImage));
  if(!raw) return;
  JSON.parse(raw).forEach(z=>{
    const r=makeZone();
    r._imgBox=z.box;
    r.partId=z.partId;
    canvas.add(r);
  });
  fit();
}

/* ================= IMAGE ================= */
function loadBackground(url){
  fabric.Image.fromURL(url,img=>{
    canvas.clear();
    bg=img;bg.selectable=false;bg.evented=false;
    canvas.add(bg);
    loadZones();
    fit();
  });
}
function fit(){
  const cw=canvas.width,ch=canvas.height;
  const s=Math.min(cw/bg.width,ch/bg.height);
  bg.scale(s).set({left:(cw-bg.width*s)/2,top:(ch-bg.height*s)/2});
  getZones().forEach(r=>{
    const b=r._imgBox;
    if(!b) return;
    r.set({
      left:bg.left+b.x*s,
      top:bg.top+b.y*s,
      width:b.w*s,
      height:b.h*s,
      scaleX:1,scaleY:1
    });
  });
  canvas.renderAll();
}

/* ================= INIT ================= */
(async()=>{
  IMAGES.forEach(i=>{
    const o=document.createElement("option");
    o.value=i.url;o.textContent=i.label;$("imgSelect").appendChild(o);
  });
  await loadParts();
  loadBackground(currentImage);
})();
</script>

</body>
</html>
