<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Zones interactives</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#0b1436;color:#eaf1ff;font-family:Arial,Segoe UI,sans-serif}

/* ===== TOP BAR ===== */
.topbar{
  display:flex;align-items:center;gap:8px;
  padding:10px;background:#0f1a3f;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;top:0;z-index:9999
}
.pill{
  padding:6px 10px;border-radius:999px;
  border:1px solid rgba(255,255,255,.18);
  background:#121c45;font-size:13px
}
.btn{
  padding:7px 12px;background:#1b2553;color:#fff;
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;cursor:pointer;
  font-weight:700;font-size:13px
}
.btn:hover{filter:brightness(1.06)}
.btn.active{background:#0078ff;border-color:#0053ad}
.btn.danger{background:#7f1d2d;border-color:#5f1622}
.select{
  background:#101a40;color:#fff;border-radius:8px;
  padding:7px 10px;border:1px solid rgba(255,255,255,.18)
}
.zoom{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:12px;
  border:1px solid rgba(255,255,255,.18);
  background:#121c45
}
.zoom input{width:160px}

/* ===== LAYOUT ===== */
.wrap{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}

.stage{background:#0b1536;border-radius:12px;overflow:hidden;min-height:78vh}
.panel{background:#0f1a44;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:78vh}
.panel h3{margin:0;font-size:15px}
.small{font-size:12px;opacity:.85;line-height:1.3}
.hr{height:1px;background:rgba(255,255,255,.12);margin:6px 0}

label{font-size:12px;opacity:.9}
textarea,input{
  width:100%;
  background:#101a40;color:#fff;
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;padding:8px
}
textarea{min-height:120px;resize:vertical}

canvas{display:block}

/* ===== FULLSCREEN ===== */
body.fs .wrap{position:fixed;inset:56px 0 0 0;padding:8px}
body.fs .stage,body.fs .panel{height:calc(100vh - 56px - 16px);min-height:unset}
</style>
</head>

<body>

<div class="topbar">
  <span class="pill"><b id="modeLabel">Mode : Lecture</b></span>
  <button id="btnMode" class="btn">Basculer Éditeur</button>

  <select id="imgSelect" class="select"></select>

  <button id="btnSelect" class="btn active">🖱</button>
  <button id="btnDraw" class="btn">✏️</button>
  <button id="btnPan" class="btn">✋</button>
  <button id="btnErase" class="btn danger">🧽</button>

  <div class="zoom">
    <b>Zoom</b>
    <input id="zoomRange" type="range" min="50" max="250" value="100">
    <span id="zoomLabel" style="width:50px;text-align:right">100%</span>
  </div>

  <button id="btnFit" class="btn">⤡ Ajuster</button>
  <button id="btnFs" class="btn">⤢ Plein écran</button>
</div>

<div class="wrap">
  <div class="stage"><canvas id="c"></canvas></div>

  <aside class="panel">
    <h3>🟦 Fiche de la zone</h3>
    <div class="small">
      Lecture : zones invisibles mais cliquables.<br>
      Éditeur : dessin / sélection / pan / suppression.
    </div>

    <div class="hr"></div>

    <label>Pièce</label>
    <select id="pieceSelect" class="select"></select>

    <label>Rôle</label>
    <textarea id="role" readonly></textarea>

    <label>Description</label>
    <textarea id="desc" readonly></textarea>

    <label>Circuit</label>
    <input id="circuit" readonly>

    <div class="small" style="margin-top:auto">
      Sauvegarde locale automatique par image
    </div>
  </aside>
</div>

<script>
/* ================= CONFIG ================= */
const JSON_URL="quincy_310L_parts.json";
const IMAGES=[
  {label:"Vue générale",url:"actif/VUE_GENERAL.jpeg"},
  {label:"Vue générale 2",url:"actif/VUE_GENERAL_2.jpeg"},
  {label:"Vue côté",url:"actif/VUE_1.jpeg"},
  {label:"Vue pompe",url:"actif/VUE_POMPE.jpeg"},
  {label:"Dessus",url:"actif/TOP.jpeg"},
  {label:"Tête",url:"actif/TETE.jpeg"},
  {label:"Tête 2",url:"actif/TETE_2.jpeg"},
  {label:"Côté charge",url:"actif/LOAD_SIDE.jpeg"},
  {label:"Vers réservoir",url:"actif/VERS_RESERVOIR.jpeg"},
  {label:"Poulie",url:"actif/POULIE.jpeg"},
  {label:"Filtre à air",url:"actif/FILTRE_AIR_COUVERCLE.jpeg"},
  {label:"Soupape unloader",url:"actif/SOUPAPE_UNLOADER.jpeg"},
  {label:"Fond référence",url:"actif/compresseur_bg.png"}
];

const $=id=>document.getElementById(id);
const LS=img=>"q310_zones::"+img;

const canvas=new fabric.Canvas("c",{selection:false,preserveObjectStacking:true});
let bg=null,currentImage=IMAGES[0].url,isEditor=false,tool="select",zoom=1;
let parts=[],drawing=false,startPt=null,curRect=null,isPanning=false,last=null;

/* ===== TOOLS ===== */
function setTool(t){
  tool=t;
  btnSelect.classList.toggle("active",t==="select");
  btnDraw.classList.toggle("active",t==="draw");
  btnPan.classList.toggle("active",t==="pan");
  canvas.defaultCursor=t==="pan"?"grab":t==="draw"?"crosshair":"pointer";
}

/* ===== RESIZE ===== */
function resize(){
  const s=document.querySelector(".stage");
  canvas.setWidth(s.clientWidth);
  canvas.setHeight(s.clientHeight);
  if(bg) fit();
}
window.addEventListener("resize",resize);

/* ===== LOAD IMAGE ===== */
function loadImage(url){
  fabric.Image.fromURL(url,img=>{
    canvas.clear();
    bg=img;bg.selectable=false;bg.evented=false;
    canvas.add(bg);
    resetView();
    loadZones();
    applyMode();
  });
}

/* ===== FIT ===== */
function resetView(){
  canvas.setViewportTransform([1,0,0,1,0,0]);
  zoom=1;
  zoomRange.value=100;
  zoomLabel.textContent="100%";
  fit();
}
function fit(){
  const cw=canvas.width,ch=canvas.height;
  const s=Math.min(cw/bg.width,ch/bg.height);
  bg.scale(s).set({left:(cw-bg.width*s)/2,top:(ch-bg.height*s)/2});
  zones().forEach(r=>{
    const b=r.box;if(!b)return;
    r.set({left:bg.left+b.x*s,top:bg.top+b.y*s,width:b.w*s,height:b.h*s,scaleX:1,scaleY:1});
    r.setCoords();
  });
  canvas.renderAll();
}

/* ===== ZONES ===== */
function zones(){return canvas.getObjects().filter(o=>o!==bg)}
function saveZones(){
  const z=zones().map(r=>{updateBox(r);return{box:r.box,partId:r.partId}});
  localStorage.setItem(LS(currentImage),JSON.stringify(z));
}
function loadZones(){
  zones().forEach(z=>canvas.remove(z));
  const raw=localStorage.getItem(LS(currentImage));
  if(!raw)return;
  JSON.parse(raw).forEach(z=>{
    const r=makeRect();
    r.partId=z.partId;
    r.box=z.box;
    canvas.add(r);
  });
  fit();
}
function updateBox(r){
  r.box={
    x:(r.left-bg.left)/bg.scaleX,
    y:(r.top-bg.top)/bg.scaleY,
    w:(r.width*r.scaleX)/bg.scaleX,
    h:(r.height*r.scaleY)/bg.scaleY
  };
}
function makeRect(){
  const r=new fabric.Rect({
    fill:"rgba(0,150,255,.15)",
    stroke:"rgba(0,150,255,.95)",
    strokeWidth:2,lockRotation:true
  });
  r.partId="";r.box=null;
  return r;
}

/* ===== PANEL ===== */
function showPart(r){
  if(!r||r===bg){pieceSelect.value="";role.value="";desc.value="";circuit.value="";return;}
  const p=parts.find(x=>x.id===r.partId);
  if(!p)return;
  pieceSelect.value=p.id;
  role.value=p.role;
  desc.value=p.desc;
  circuit.value=p.circuit;
}

/* ===== MODE ===== */
function applyMode(){
  zones().forEach(r=>{
    r.opacity=isEditor?1:0;
    r.selectable=isEditor;
    r.evented=true;
  });
  modeLabel.textContent=isEditor?"Mode : Éditeur":"Mode : Lecture";
  canvas.discardActiveObject();
  canvas.renderAll();
}

/* ===== EVENTS ===== */
btnMode.onclick=()=>{isEditor=!isEditor;applyMode()};
btnSelect.onclick=()=>setTool("select");
btnDraw.onclick=()=>setTool("draw");
btnPan.onclick=()=>setTool("pan");
btnErase.onclick=()=>{
  if(!isEditor)return;
  const r=canvas.getActiveObject();
  if(r&&r!==bg){canvas.remove(r);saveZones();showPart(null)}
};
btnFit.onclick=()=>{resetView();showPart(null)};
btnFs.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();

pieceSelect.onchange=()=>{
  const r=canvas.getActiveObject();
  if(r&&r!==bg){r.partId=pieceSelect.value;saveZones();showPart(r)}
};

canvas.on("mouse:down",o=>{
  const t=o.target;
  if(tool==="pan"){isPanning=true;last={x:o.e.clientX,y:o.e.clientY};canvas.defaultCursor="grabbing";return;}
  if(!isEditor){if(t&&t!==bg)showPart(t);return;}
  if(tool==="select"&&t&&t!==bg){canvas.setActiveObject(t);showPart(t)}
  if(tool==="draw"&&!t){
    drawing=true;
    startPt=canvas.getPointer(o.e,true);
    curRect=makeRect();
    curRect.set({left:startPt.x,top:startPt.y,width:1,height:1});
    canvas.add(curRect);canvas.setActiveObject(curRect);
  }
});
canvas.on("mouse:move",o=>{
  if(drawing&&curRect){
    const p=canvas.getPointer(o.e,true);
    curRect.set({
      left:Math.min(p.x,startPt.x),
      top:Math.min(p.y,startPt.y),
      width:Math.abs(p.x-startPt.x),
      height:Math.abs(p.y-startPt.y),
      scaleX:1,scaleY:1
    });
    curRect.setCoords();canvas.renderAll();
  }
  if(isPanning){
    const v=canvas.viewportTransform;
    v[4]+=o.e.clientX-last.x;
    v[5]+=o.e.clientY-last.y;
    last={x:o.e.clientX,y:o.e.clientY};
    canvas.setViewportTransform(v);canvas.renderAll();
  }
});
canvas.on("mouse:up",()=>{
  if(drawing&&curRect){
    drawing=false;
    if(curRect.width<10||curRect.height<10){canvas.remove(curRect);curRect=null;return}
    updateBox(curRect);saveZones();showPart(curRect);
    curRect=null;
  }
  if(isPanning){isPanning=false;canvas.defaultCursor=tool==="pan"?"grab":tool==="draw"?"crosshair":"pointer"}
});

/* ===== ZOOM ===== */
function setZoom(z){
  zoom=Math.max(.5,Math.min(3,z));
  canvas.zoomToPoint(new fabric.Point(canvas.width/2,canvas.height/2),zoom);
  zoomRange.value=Math.round(zoom*100);
  zoomLabel.textContent=Math.round(zoom*100)+"%";
}
zoomRange.oninput=()=>setZoom(parseInt(zoomRange.value)/100);

/* ===== INIT ===== */
(async()=>{
  IMAGES.forEach(i=>{
    const o=document.createElement("option");
    o.value=i.url;o.textContent=i.label;imgSelect.appendChild(o);
  });
  imgSelect.value=currentImage;
  imgSelect.onchange=()=>{currentImage=imgSelect.value;loadImage(currentImage);showPart(null)};

  const res=await fetch(JSON_URL,{cache:"no-store"});
  parts=await res.json();
  pieceSelect.innerHTML='<option value="">— choisir —</option>';
  parts.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id;
    o.textContent=`${p.nom} (${p.circuit})`;
    pieceSelect.appendChild(o);
  });

  resize();
  loadImage(currentImage);
  applyMode();
})();
</script>

</body>
</html>
