<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quincy 310L — Lecture / Éditeur</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }

html,body{
  margin:0;
  background:#0c132e;
  color:#eaf1ff;
  font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
}

/* ================= TOP BAR ================= */
.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  background:#0f1a3f;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.btn{
  padding:7px 11px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.14);
  background:#1b2553;
  color:#eaf1ff;
  cursor:pointer;
}
.btn.primary{
  background:#0078ff;
  border-color:#0053ad;
}

/* ================= LAYOUT ================= */
.wrap{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:12px;
  padding:12px;
}
.stage{
  position:relative;
  background:#0b1536;
  border-radius:12px;
  overflow:hidden;
  min-height:60vh;
}
.panel{
  background:#0f1a44;
  border-radius:12px;
  padding:12px;
}

/* ================= CANVAS ================= */
canvas{
  touch-action:none;
  user-select:none;
}

/* ================= FULLSCREEN ================= */
.fs-btn{
  position:absolute;
  right:10px;
  bottom:10px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(10,15,40,.85);
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  cursor:pointer;
  z-index:10;
}

/* Plein écran type YouTube */
body.fs-mode{
  background:#020618;
  overflow:hidden;
}
body.fs-mode .topbar{display:none;}
body.fs-mode .wrap{
  position:fixed;
  inset:0;
  margin:0;
  padding:0;
  grid-template-columns:80% 20%;
}
body.fs-mode .stage,
body.fs-mode .panel{
  border-radius:0;
  height:100vh;
}

/* Lecture seule */
.readonly{
  background:#0a1433;
  pointer-events:none;
  opacity:.85;
}
  .fs-btn{
  position:absolute;
  right:12px;
  bottom:12px;
  z-index:20;
  background:rgba(15,20,50,.85);
  backdrop-filter:blur(6px);
}
body.fs-mode{
  background:#020617;
  overflow:hidden;
}

body.fs-mode .topbar,
body.fs-mode .toolbar{
  display:none !important;
}

body.fs-mode .wrap{
  position:fixed;
  inset:0;
  padding:0;
  margin:0;
  grid-template-columns:70% 30%;
}

body.fs-mode .stage{
  border-radius:0;
  min-height:100vh;
}

body.fs-mode .panel{
  border-radius:0;
  height:100vh;
  overflow:auto;
}

</style>
</head>

<body>

<div class="topbar">
  <b id="modeLabel">Lecture</b>
  <button id="toggleMode" class="btn">Passer en Éditeur</button>
</div>

<div class="wrap">
 <div class="stage">
  <canvas id="c"></canvas>

  <!-- Bouton plein écran -->
  <button id="btnFsToggle" class="btn fs-btn">⤢ Plein écran</button>
</div>


  <aside class="panel">
    <h3>Description</h3>
    <textarea id="desc" rows="10"></textarea>
  </aside>
</div>

<script>
/* ================= CANVAS ================= */
const canvas = new fabric.Canvas("c",{selection:false});
let bgImg = null;
let isReading = true;

/* ================= RESIZE ================= */
function resizeCanvas(){
  const stage = document.querySelector(".stage");
  canvas.setWidth(stage.clientWidth);
  canvas.setHeight(stage.clientHeight);
  fitBackground();
}

/* ================= IMAGE ================= */
function fitBackground(){
  if(!bgImg) return;

  canvas.setViewportTransform([1,0,0,1,0,0]);
  canvas.setZoom(1);

  const cw = canvas.getWidth();
  const ch = canvas.getHeight();
  const iw = bgImg.width;
  const ih = bgImg.height;

  const scale = Math.min(cw/iw, ch/ih);
  bgImg.scale(scale);
  bgImg.set({
    left:(cw - iw*scale)/2,
    top:(ch - ih*scale)/2,
    selectable:false,
    evented:false
  });
  canvas.sendToBack(bgImg);
  canvas.requestRenderAll();
}

function loadBackground(){
console.log("loadBackground appelé");

  fabric.Image.fromURL(
    "actif/compresseur_bg.png",
    img=>{
      bgImg = img;
      bgImg.objectCaching=false;
      canvas.add(bgImg);
      fitBackground();
    },
    {crossOrigin:"anonymous"}
  );
}

/* ================= MODE ================= */
function applyLecture(on){
  isReading = on;
  document.getElementById("modeLabel").textContent = on?"Lecture":"Éditeur";
  document.getElementById("toggleMode").textContent = on?"Passer en Éditeur":"Passer en Lecture";

  const d = document.getElementById("desc");
  d.readOnly = on;
  d.classList.toggle("readonly", on);
}

document.getElementById("toggleMode").onclick = ()=>{
  if(isReading){
    const pw = prompt("Mot de passe Éditeur:");
    if(pw!=="PROF") return;
    applyLecture(false);
  }else{
    applyLecture(true);
  }
};

/* ================= FULLSCREEN ================= */
const fsBtn = document.getElementById("btnFsToggle");

if (fsBtn) {
  fsBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  });
}

// Quand le fullscreen est réellement actif ou quitté
document.addEventListener("fullscreenchange", () => {
  const isFs = !!document.fullscreenElement;

  document.body.classList.toggle("fs-mode", isFs);

  // IMPORTANT : resize + recentrage APRÈS activation
  setTimeout(() => {
    resizeCanvas();
    if (bgImg) fitBackgroundImage(bgImg);
  }, 50);
});
/* ================= FULLSCREEN (UNIQUE) ================= */
const fsBtn = document.getElementById("btnFsToggle");

fsBtn.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});

document.addEventListener("fullscreenchange", () => {
  const isFs = !!document.fullscreenElement;
  document.body.classList.toggle("fs-mode", isFs);

  setTimeout(() => {
    resizeCanvas();
    fitBackground();
  }, 50);
});

/* ================= INIT ================= */
window.addEventListener("resize",resizeCanvas);

resizeCanvas();
loadBackground();
applyLecture(true);


</script>

</body>
</html>
