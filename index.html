<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quincy 310L – Schéma interactif (Éditeur / Lecture)</title>

  <!-- FabricJS -->
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; background:#0c132e; color:#eaf1ff; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif; }

    /* Barre du haut */
    .topbar {
      display:flex; gap:8px; align-items:center; padding:10px 12px;
      background:#0f1a3f; border-bottom:1px solid rgba(255,255,255,.08);
    }
    .mode-pill {
      display:inline-flex; align-items:center; gap:8px; padding:6px 10px;
      background:#1b2553; border:1px solid rgba(255,255,255,.14); border-radius:999px;
    }
    .mode-pill b { color:#91c9ff; }
    .btn { padding:7px 11px; border-radius:8px; border:1px solid rgba(255,255,255,.14);
           background:#1b2553; color:#eaf1ff; cursor:pointer; }
    .btn:hover { filter:brightness(1.08); }
    .btn.active { background:#0078ff; font-weight:bold; border-color:#0053ad; box-shadow:0 0 8px rgba(0,120,255,.45); }
    .chip { padding:6px 8px; background:#192247; border:1px solid rgba(255,255,255,.12); border-radius:8px; }

    /* Barre d'outils d'édition (masquée en Lecture) */
    .toolbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:10px 12px; background:#0f1a3f; }
    .toolbar.hidden { display:none; }

    /* Layout */
    .wrap { display:grid; grid-template-columns:1fr 360px; gap:12px; padding:12px; }
    @media (max-width:1000px) { .wrap { grid-template-columns:1fr; } }

    .stage { background:#0b1536; border:1px solid rgba(255,255,255,.08); border-radius:12px; overflow:hidden; min-height:55vh; }
    canvas { touch-action:none; user-select:none; }

    .panel {
      padding:12px; background:#0f1a44; border:1px solid rgba(255,255,255,.10); border-radius:12px;
    }
    .panel h3 { margin:6px 0 10px; font-size:1.05rem; }
    .row { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
    label { font-size:.9rem; opacity:.95; }
    select, input, textarea {
      width:100%; padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.18);
      background:#0b1638; color:#eaf1ff;
    }
    textarea { min-height:120px; resize:vertical; }
    .hint { font-size:.85rem; opacity:.8; }

    /* Lecture : look désactivé */
    .readonly { opacity:.9; background:#0b1638; }
    .hidden { display:none !important; }
  </style>
</head>
<body>

  <!-- Barre supérieure : bascule Éditeur <-> Lecture -->
  <div class="topbar">
    <span class="mode-pill">Mode : <b id="modeLabel">Éditeur</b></span>
    <button id="toggleMode" class="btn">Passer en Lecture</button>

    <span style="flex:1;"></span>

    <!-- Contrôles communs (toujours visibles) -->
    <span class="chip">Zoom
      <input type="range" id="zoom" min="25" max="300" step="1" value="100"
             style="vertical-align:middle; margin-left:6px;">
    </span>
    <span id="toggle-fit" class="btn chip">Affichage : <strong>Tout voir</strong></span>
    <button id="btn-fit" class="btn">🖼️ Ajuster</button>
  </div>

  <!-- Barre d’outils d’édition (masquée en Lecture) -->
  <div id="editorToolbar" class="toolbar">
    <button id="btn-move" class="btn">🧿 Déplacer / Redim.</button>
    <button id="btn-draw" class="btn">✏️ Dessiner</button>
    <button id="btn-pan" class="btn">✋ Pan</button>
    <button id="btn-select" class="btn">🖱️ Sélection</button>
    <button id="btn-delete" class="btn">❌ Supprimer</button>
    <button id="btn-clear" class="btn">🗑️ Effacer tout</button>

    <span style="flex:1;"></span>

    <button id="btn-export" class="btn">💾 Export JSON</button>
    <label class="btn">📥 Import JSON
      <input id="fileImport" type="file" accept=".json,application/json" style="display:none;">
    </label>
  </div>

  <!-- Scène + Panneau -->
  <div class="wrap">
    <div class="stage"><canvas id="c"></canvas></div>

    <aside class="panel">
      <h3>📘 Fiche de la zone</h3>
      <p class="hint" id="panelHint">
        En <b>Sélection</b>, cliquez une zone pour afficher <b>Pièce / Nom / Rôle / Description</b>.
      </p>

      <div class="row">
        <label for="inventorySelect">Pièce</label>
        <select id="inventorySelect"></select>
      </div>
      <div class="row">
        <label for="partName">Nom</label>
        <input id="partName" class="readonly" readonly />
      </div>
      <div class="row">
        <label for="partRole">Rôle</label>
        <input id="partRole" class="readonly" readonly />
      </div>
      <div class="row">
        <label for="partDesc">Description</label>
        <textarea id="partDesc" class="readonly" readonly></textarea>
      </div>

      <div class="row" id="editorActions" style="display:flex; gap:8px;">
        <button id="btn-apply" class="btn" style="flex:1;">✅ Appliquer à la zone</button>
        <button id="btn-show-all" class="btn" style="flex:1;">👁️ Afficher tout</button>
      </div>

      <p class="hint">💾 Sauvegarde locale automatique (navigateur). Utilisez Export/Import pour partager.</p>
    </aside>
  </div>

  <script>
    /***********************
     * INVENTAIRE (Nom / Rôle / Desc) + Circuit pour couleurs
     ***********************/
    const INVENTAIRE = {
      // Admission / LP (🟦)
      "filtre_air":   {nom:"Filtre à air", role:"Filtrer l’air entrant", desc:"Retient les impuretés de l’air avant admission.", circuit:"LP"},
      "cylindre_lp":  {nom:"Cylindre basse pression", role:"Compression initiale", desc:"Première étape de compression.", circuit:"LP"},
      "soupape_admission_lp": {nom:"Soupape d’admission LP", role:"Entrée d’air", desc:"S’ouvre sous dépression.", circuit:"LP"},

      // HP / Refoulement (🔴)
      "cylindre_hp":  {nom:"Cylindre haute pression", role:"Compression finale", desc:"Monte l’air à haute pression.", circuit:"HP"},
      "intercooler":  {nom:"Intercooler", role:"Refroidir l’air", desc:"Réduit la température entre les étages.", circuit:"HP"},
      "soupape_decharge_hp": {nom:"Soupape de décharge HP", role:"Sortie HP", desc:"Libère l’air vers le réservoir.", circuit:"HP"},

      // Lubrification (🟧)
      "carter":       {nom:"Carter", role:"Réservoir d’huile", desc:"Contient et distribue l’huile.", circuit:"LUB"},
      "pompe_huile":  {nom:"Pompe à huile", role:"Distribution huile", desc:"Alimente les paliers.", circuit:"LUB"},
      "filtre_huile": {nom:"Filtre à huile", role:"Filtrer l’huile", desc:"Retient les particules.", circuit:"LUB"},

      // Contrôle / Régulation (🟪)
      "pressostat":   {nom:"Pressostat", role:"Commande moteur", desc:"Arrête/démarre selon pression.", circuit:"CTRL"},
      "valve_pilote": {nom:"Valve pilote", role:"Contrôle charge", desc:"Régule les déchargeurs.", circuit:"CTRL"},
      "soupape_securite": {nom:"Soupape de sûreté", role:"Protection", desc:"Tarée contre surpression.", circuit:"CTRL"},

      // Transmission (🟩)
      "volant":       {nom:"Volant", role:"Inertie et ventilation", desc:"Stabilise la rotation.", circuit:"TR"},
      "courroies":    {nom:"Courroies", role:"Transmission", desc:"Relient moteur et compresseur.", circuit:"TR"},
      "poulie_moteur":{nom:"Poulie moteur", role:"Adaptation vitesse", desc:"Détermine le ratio.", circuit:"TR"}
    };

    /******** COULEURS PAR CIRCUIT ********/
    const COULEURS = {
      "LP":  { fill:"rgba(0,160,255,0.18)", stroke:"#00a0ff" },
      "HP":  { fill:"rgba(255,60,60,0.18)", stroke:"#ff3c3c" },
      "LUB": { fill:"rgba(255,150,0,0.18)", stroke:"#ff9500" },
      "CTRL":{ fill:"rgba(160,100,255,0.18)", stroke:"#a060ff" },
      "TR":  { fill:"rgba(60,220,100,0.18)", stroke:"#3cdc64" },
      "DEF": { fill:"rgba(200,200,200,0.12)", stroke:"#aaaaaa" }
    };

    /***********************
     * CANVAS + BACKGROUND
     ***********************/
    const canvas = new fabric.Canvas("c", { selection:false, preserveObjectStacking:true, backgroundColor:"#0b1536" });
    let bgImg = null;
    let FIT_MODE = "contain"; // contain | cover

    function resizeCanvas() {
      const stage = document.querySelector(".stage");
      canvas.setWidth(stage.clientWidth);
      canvas.setHeight(Math.max(520, window.innerHeight*0.65));
      canvas.requestRenderAll();
    }
    window.addEventListener("resize", () => { resizeCanvas(); fitBackgroundImage(bgImg); });

    function fitBackgroundImage(img){
      if(!img) return;
      const cw=canvas.getWidth(), ch=canvas.getHeight(), iw=img.width, ih=img.height;
      const s = (FIT_MODE==="contain") ? Math.min(cw/iw, ch/ih) : Math.max(cw/iw, ch/ih);
      img.scale(s);
      img.set({ left:(cw - iw*s)/2, top:(ch - ih*s)/2, selectable:false, evented:false, id:"__BG__" });
      canvas.sendToBack(img);
      canvas.requestRenderAll();
    }

    function loadBackground(){
      fabric.Image.fromURL("actif/compresseur_bg.png", (img)=>{
        bgImg = img;
        canvas.add(img);
        fitBackgroundImage(img);
        requestAnimationFrame(()=>{ loadSaved(); canvas.requestRenderAll(); });
      }, { crossOrigin:"anonymous" });
    }

    /***********************
     * SAUVEGARDE
     ***********************/
    const LS_KEY = "q310_editor_reader_v1";
    function toNormalized(o){
      const r=o.getBoundingRect(true, true);
      return { id:o.pieceId||"", x:r.left, y:r.top, w:r.width, h:r.height };
    }
    function fromNormalized(z){
      const info = INVENTAIRE[z.id];
      const col  = info ? COULEURS[info.circuit] : COULEURS.DEF;
      const rect = new fabric.Rect({
        left:z.x, top:z.y, width:z.w, height:z.h,
        fill:col.fill, stroke:col.stroke, strokeWidth:2, rx:6, ry:6,
        selectable:true, hasControls:true, lockScalingFlip:true
      });
      rect.pieceId = z.id || "";
      canvas.add(rect); canvas.bringToFront(rect);
      return rect;
    }
    function save(){
      const zones = canvas.getObjects().filter(o=>o!==bgImg).map(toNormalized);
      localStorage.setItem(LS_KEY, JSON.stringify({fit:FIT_MODE, zones}));
    }
    function loadSaved(){
      const raw = localStorage.getItem(LS_KEY);
      if(!raw) return;
      try{
        const data = JSON.parse(raw);
        FIT_MODE = data.fit || "contain";
        (data.zones||[]).forEach(fromNormalized);
        refreshFitLabel();
      }catch(e){ console.warn("Aucune sauvegarde valide", e); }
    }

    function exportJSON(){
      const zones = canvas.getObjects().filter(o=>o!==bgImg).map(toNormalized);
      const blob = new Blob([JSON.stringify({fit:FIT_MODE, zones}, null, 2)], {type:"application/json"});
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download="quincy310L_zones.json"; a.click();
    }
    function importJSON(file){
      if(!file) return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const data=JSON.parse(reader.result);
          canvas.getObjects().slice().forEach(o=>{ if(o!==bgImg) canvas.remove(o); });
          FIT_MODE = data.fit || "contain";
          (data.zones||[]).forEach(fromNormalized);
          refreshFitLabel(); canvas.requestRenderAll(); save();
        }catch(e){ alert("JSON invalide."); }
      };
      reader.readAsText(file);
    }

    /***********************
     * MODES (dessin/déplacement/pan/sélection) + LECTURE/ÉDITEUR
     ***********************/
    let mode = "move";           // "move" | "draw" | "pan" | "select"
    let isReading = false;       // Lecture = true, Éditeur = false
    let drawingRect = null, startPoint = null;

    function setMode(m){
      mode = m;
      document.querySelectorAll("#editorToolbar .btn").forEach(b=>b.classList.remove("active"));
      const map = { move:"btn-move", draw:"btn-draw", pan:"btn-pan", select:"btn-select" };
      if(map[m]) document.getElementById(map[m]).classList.add("active");

      // En Éditeur : zones déplaçables uniquement en mode "move"
      // En Lecture  : zones sélectionnables mais ni déplaçables ni redimensionnables
      canvas.getObjects().forEach(o=>{
        if(o===bgImg) return;
        if(isReading){
          o.selectable = true;
          o.hasControls = false;
          o.lockMovementX = true;
          o.lockMovementY = true;
          o.lockScalingX = true;
          o.lockScalingY = true;
          o.hoverCursor = "pointer";
        }else{
          o.selectable = (m==="move");
          o.hasControls = (m==="move");
          o.lockMovementX = false;
          o.lockMovementY = false;
          o.lockScalingX = false;
          o.lockScalingY = false;
          o.hoverCursor = (m==="select") ? "pointer" : "move";
        }
      });
    }

    function applyLectureUI(on){
      isReading = !!on;

      // Libellé et bouton
      document.getElementById("modeLabel").textContent = on ? "Lecture" : "Éditeur";
      document.getElementById("toggleMode").textContent = on ? "Passer en Éditeur" : "Passer en Lecture";

      // Barre d’outils Éditeur visible seulement en Éditeur
      document.getElementById("editorToolbar").classList.toggle("hidden", on);

      // Panneau : sélecteur de pièce désactivé + bouton Appliquer masqué en Lecture
      document.getElementById("inventorySelect").disabled = on;
      document.getElementById("btn-apply").classList.toggle("hidden", on);

      // En Lecture : forcer le mode Sélection, et interdire toute action autre que sélectionner
      if(on){
        setMode("select");
      }else{
        setMode("move");
      }
    }

    // Dessin / Pan / Sélection
    canvas.on("mouse:down", (opt)=>{
      if(mode==="pan"){
        canvas.isDragging=true; canvas.lastX=opt.e.clientX; canvas.lastY=opt.e.clientY; return;
      }
      if(mode!=="draw" || isReading) return;
      const p=canvas.getPointer(opt.e);
      startPoint=p;
      drawingRect = new fabric.Rect({
        left:p.x, top:p.y, width:1, height:1,
        fill:"rgba(255,255,255,0.10)", stroke:"#0ff", strokeWidth:2, rx:6, ry:6, selectable:false
      });
      canvas.add(drawingRect);
    });
    canvas.on("mouse:move", (opt)=>{
      if(canvas.isDragging && mode==="pan"){ const dx=opt.e.clientX-canvas.lastX, dy=opt.e.clientY-canvas.lastY;
        canvas.relativePan(new fabric.Point(dx,dy)); canvas.lastX=opt.e.clientX; canvas.lastY=opt.e.clientY; return; }
      if(mode!=="draw" || !drawingRect || !startPoint || isReading) return;
      const p=canvas.getPointer(opt.e);
      drawingRect.set({ left:Math.min(p.x,startPoint.x), top:Math.min(p.y,startPoint.y),
                        width:Math.abs(p.x-startPoint.x), height:Math.abs(p.y-startPoint.y) });
      canvas.requestRenderAll();
    });
    canvas.on("mouse:up", (e)=>{
      if(canvas.isDragging){ canvas.isDragging=false; return; }

      // Lecture ou Sélection : afficher la fiche sans modifier
      if(mode==="select"){
        const target=e.target;
        if(target && target!==bgImg){
          highlight(target);
          fillPanelFromZone(target);
        }
        return;
      }

      // Fin du dessin
      if(mode!=="draw" || !drawingRect || isReading) return;
      drawingRect.selectable=true;
      drawingRect = null; startPoint = null;
      save();
    });

  canvas.on("mouse:wheel", (opt)=>{
  const delta = -opt.e.deltaY;
  const current = canvas.getZoom();
  const next = Math.max(0.25, Math.min(3, current * (1 + delta/1000)));

  const center = new fabric.Point(canvas.getWidth()/2, canvas.getHeight()/2);
  canvas.zoomToPoint(center, next);

  document.getElementById("zoom").value = Math.round(next*100);
  opt.e.preventDefault();
  opt.e.stopPropagation();
});


    // Sélection : met la zone en valeur
    function highlight(o){
      canvas.getObjects().forEach(x=>{ if(x!==bgImg) x.opacity=(x===o)?1:0.2; });
      canvas.requestRenderAll();
    }

    /***********************
     * PANNEAU & COULEURS
     ***********************/
    function refreshInventorySelect(){
      const sel=document.getElementById("inventorySelect");
      sel.innerHTML = '<option value="">— Choisir —</option>' +
        Object.keys(INVENTAIRE).map(id=>`<option value="${id}">${id} — ${INVENTAIRE[id].nom}</option>`).join("");
    }
    function showPart(id){
      const p=INVENTAIRE[id];
      document.getElementById("partName").value = p ? p.nom  : "";
      document.getElementById("partRole").value = p ? p.role : "";
      document.getElementById("partDesc").value = p ? p.desc : "";
    }
    function fillPanelFromZone(zone){
      const id = zone.pieceId || "";
      document.getElementById("inventorySelect").value = id;
      showPart(id);
    }

    // Changement de pièce (n’affecte pas la zone tant que l’on n’appuie pas sur Appliquer)
    document.getElementById("inventorySelect").addEventListener("change", (e)=>{
      if(isReading) { e.target.value = e.target.value; } // pas d'effet sur la zone en Lecture
      showPart(e.target.value);
    });

    // Appliquer pièce à la zone (Éditeur uniquement)
    document.getElementById("btn-apply").addEventListener("click", ()=>{
      if(isReading){ return; }
      const o = canvas.getActiveObject();
      if(!o || o===bgImg){ alert("Sélectionne une zone."); return; }
      const id = document.getElementById("inventorySelect").value;
      if(!id){ alert("Choisis une pièce."); return; }
      o.pieceId = id;
      const info = INVENTAIRE[id], col = COULEURS[info?.circuit] || COULEURS.DEF;
      o.set({ fill:col.fill, stroke:col.stroke });
      showPart(id);
      save(); canvas.requestRenderAll();
    });

    // Afficher toutes les zones
    document.getElementById("btn-show-all").addEventListener("click", ()=>{
      canvas.getObjects().forEach(o=>{ if(o!==bgImg) o.opacity=1; });
      canvas.requestRenderAll();
    });

    /***********************
     * BOUTONS ÉDITEUR
     ***********************/
    document.getElementById("btn-move").onclick   = ()=>setMode("move");
    document.getElementById("btn-draw").onclick   = ()=>setMode("draw");
    document.getElementById("btn-pan").onclick    = ()=>setMode("pan");
    document.getElementById("btn-select").onclick = ()=>setMode("select");

    document.getElementById("btn-delete").onclick = ()=>{
      if(isReading) return;
      const o=canvas.getActiveObject();
      if(o && o!==bgImg){ canvas.remove(o); save(); }
    };
    document.getElementById("btn-clear").onclick = ()=>{
      if(isReading) return;
      if(confirm("Effacer toutes les zones ?")){
        canvas.getObjects().slice().forEach(o=>{ if(o!==bgImg) canvas.remove(o); });
        save(); canvas.requestRenderAll();
      }
    };

  document.getElementById("zoom").addEventListener("input", (e)=>{
  const target = Math.max(.25, Math.min(3, Number(e.target.value)/100));
  const center = new fabric.Point(canvas.getWidth()/2, canvas.getHeight()/2);
  canvas.zoomToPoint(center, target);
  canvas.requestRenderAll();
});

    // Fit
    function refreshFitLabel(){
      document.getElementById("toggle-fit").innerHTML = `Affichage : <strong>${FIT_MODE==='contain'?'Tout voir':'Remplir'}</strong>`;
    }
    document.getElementById("toggle-fit").addEventListener("click", ()=>{
      FIT_MODE = (FIT_MODE==="contain") ? "cover" : "contain";
      refreshFitLabel(); fitBackgroundImage(bgImg); save();
    });
    document.getElementById("btn-fit").addEventListener("click", ()=>fitBackgroundImage(bgImg));

    // Import / Export
    document.getElementById("btn-export").addEventListener("click", exportJSON);
    document.getElementById("fileImport").addEventListener("change", (e)=>{ importJSON(e.target.files[0]); e.target.value=""; });

    // Bascule Éditeur / Lecture
    document.getElementById("toggleMode").addEventListener("click", ()=>{
      applyLectureUI(!isReading);
    });

    /***********************
     * DÉMARRAGE
     ***********************/
    resizeCanvas();
    loadBackground();
    refreshInventorySelect();
    applyLectureUI(TRUE); // démarre en Éditeur
  </script>
</body>
</html>
