<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Zones interactives</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
  :root { color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:#0b1436; color:#eaf1ff; font-family:Arial,Segoe UI,sans-serif; }

  .topbar{
    display:flex; align-items:center; gap:8px;
    padding:10px; background:#0f1a3f; border-bottom:1px solid rgba(255,255,255,.08);
    position:sticky; top:0; z-index:9999;
  }
  .btn{
    padding:7px 12px; background:#1b2553; color:#fff;
    border:1px solid rgba(255,255,255,.18); border-radius:8px;
    cursor:pointer; font-weight:700; font-size:13px;
  }
  .btn:hover{ filter:brightness(1.06); }
  .btn.active{ background:#0078ff; border-color:#0053ad; }
  .btn.danger{ background:#7f1d2d; border-color:#5f1622; }

  .select{
    background:#101a40; color:#fff; border-radius:8px;
    padding:7px 10px; border:1px solid rgba(255,255,255,.18);
  }

  .zoom{
    display:flex; align-items:center; gap:6px;
    padding:6px 10px; border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    background:#121c45;
  }
  .zoom input[type="range"]{ width:160px; }

  .wrap{
    display:grid; grid-template-columns:1fr 360px;
    gap:12px; padding:12px;
  }
  @media(max-width:1000px){
    .wrap{ grid-template-columns:1fr; }
  }

  .stage{
    background:#0b1536; border-radius:12px; overflow:hidden;
    min-height:78vh; position:relative;
  }

  /* Media layer + Canvas overlay */
  .media-layer, #c{
    position:absolute; inset:0;
    width:100%; height:100%;
  }

  #imgLayer, #videoLayer{
    position:absolute;
    left:0; top:0;
    width:0; height:0;
    display:none;
    border:none;
  }

  .panel{
    background:#0f1a44; border-radius:12px; padding:12px;
    display:flex; flex-direction:column; gap:10px;
    min-height:78vh;
  }
  .panel h3{ margin:0; font-size:15px; }
  .small{ font-size:12px; opacity:.85; line-height:1.3; }
  .hr{ height:1px; background:rgba(255,255,255,.12); margin:6px 0; }

  label{ font-size:12px; opacity:.9; }
  textarea, input{
    width:100%;
    background:#101a40; color:#fff;
    border:1px solid rgba(255,255,255,.18); border-radius:10px;
    padding:10px;
  }
  textarea{ min-height:90px; resize:vertical; }

  body.fs .wrap{
    position:fixed; inset:56px 0 0 0;
    padding:8px; margin:0;
  }
  body.fs .stage, body.fs .panel{
    height:calc(100vh - 56px - 16px);
    min-height:unset;
  }

  /* ======================================================
     FIX CRITIQUE FABRIC.JS – NE PAS MODIFIER
     ====================================================== */

  .stage{
    position: relative;
  }

  .canvas-container{
    position: absolute !important;
    inset: 0;
    z-index: 2;
    pointer-events: auto;
  }

  .media-layer{
    z-index: 1;
    pointer-events: none;
    transform-origin: 0 0;
  }

  .video-media .media-layer{
    z-index: 3;
    pointer-events: auto;
  }

  .video-media .canvas-container{
    pointer-events: none;
  }
</style>
</head>

<body>

<div class="topbar">
  <select id="imgSelect" class="select"></select>

  <button id="btnVideo" class="btn" title="Mode Vidéo (Play/Pause cliquable)">🎬 Vidéo (Play)</button>

  <button id="btnSelect" class="btn active" title="Sélection">🖱</button>
  <button id="btnDraw" class="btn" title="Dessiner une zone">✏️</button>
  <button id="btnPan" class="btn" title="Main (Pan)">✋</button>
  <button id="btnErase" class="btn danger" title="Supprimer la zone sélectionnée">🧽</button>

  <div class="zoom">
    <b>Zoom</b>
    <input id="zoomRange" type="range" min="50" max="250" value="100">
    <span id="zoomLabel" style="width:52px; text-align:right;">100%</span>
  </div>

  <button id="btnFit" class="btn" title="Ajuster">⤡ Ajuster</button>
  <button id="btnFs" class="btn" title="Plein écran">⤢ Plein écran</button>
</div>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="media-layer" id="mediaLayer">
      <img id="imgLayer" alt="">
      <video id="videoLayer" controls playsinline></video>
    </div>
    <canvas id="c"></canvas>
  </div>

  <aside class="panel">
    <h3>🟦 Fiche de la zone</h3>
    <div class="small">
      ✔ Tout est en mode enseignant (édition permanente).<br>
      🎬 Pour cliquer Play/Pause sur une vidéo, clique “Vidéo (Play)”.<br>
      🖱✏️✋ Pour les zones, clique un outil (ça désactive le mode Play).
    </div>

    <div class="hr"></div>

    <div>
      <label>Pièce</label>
      <select id="pieceSelect" class="select" style="width:100%"></select>
      <div class="small" style="opacity:.75;margin-top:6px">
        ID : <span id="partIdLabel">—</span>
      </div>
    </div>

    <div>
      <label>Nom</label>
      <input id="nom" placeholder="ex: Filtre à air">
    </div>

    <div>
      <label>Rôle</label>
      <textarea id="role" placeholder="ex: Filtrer l’air entrant"></textarea>
    </div>

    <div>
      <label>Description</label>
      <textarea id="desc" placeholder="ex: Retient les poussières..."></textarea>
    </div>

    <div>
      <label>Circuit</label>
      <input id="circuit" placeholder="LP / HP / LUB / CTRL / TR">
    </div>

    <button id="btnSavePart" class="btn">💾 Ajouter / Mettre à jour la pièce</button>

    <div class="small" style="margin-top:auto; opacity:.75;">
      Pièces ajoutées : sauvegarde locale (n’écrit pas dans le JSON GitHub).
    </div>
  </aside>
</div>

<script>
/* ================= CONFIG ================= */
const JSON_URL = "quincy_310L_parts.json";
const PARTS_CUSTOM_KEY = "q310_parts_custom_v1";

const MEDIAS = [
  { label: "Fond référence", url: "actif/compresseur_bg.png" },
  { label: "Animation – Compresseur 2 stages", url: "video:actif/compresseur_2_stages.mp4" },
  { label:"Vue générale", url:"actif/VUE_GENERAL.jpeg" },
  { label:"Vue générale 2", url:"actif/VUE_GENERAL_2.jpeg" },
  { label:"Vue côté", url:"actif/VUE_1.jpeg" },
  { label:"Vue pompe", url:"actif/VUE_POMPE.jpeg" },
  { label:"Dessus (TOP)", url:"actif/TOP.jpeg" },
  { label:"Tête", url:"actif/TETE.jpeg" },
  { label:"Tête 2", url:"actif/TETE_2.jpeg" },
  { label:"Côté charge (LOAD)", url:"actif/LOAD_SIDE.jpeg" },
  { label:"Vers réservoir", url:"actif/VERS_RESERVOIR.jpeg" },
  { label:"Poulie", url:"actif/POULIE.jpeg" },
  { label:"Filtre air", url:"actif/FILTRE_AIR_COUVERCLE.jpeg" },
  { label:"Soupape unloader", url:"actif/SOUPAPE_UNLOADER.jpeg" }
];

/* ================= HELPERS ================= */
const $ = (id)=>document.getElementById(id);
const stageEl = $("stage");
const mediaLayer = $("mediaLayer");
const imgEl = $("imgLayer");
const videoEl = $("videoLayer");
const LS_ZONES = (mediaKey)=>"q310_zones_v4::"+mediaKey;

function slugify(s){
  return (s||"")
    .toString().trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"_")
    .replace(/^_+|_+$/g,"");
}

/* ================= STATE ================= */
const canvas = new fabric.Canvas("c", { selection:true, preserveObjectStacking:true });

let zonesVisible = false; // ✅ invisible par défaut (zones déjà sauvegardées)
let tool = "select";      // select | draw | pan
let zoom = 1;

let currentMedia = MEDIAS[0].url;
let currentMediaKey = currentMedia;
let mediaType = "image"; // image | video

let mediaNaturalW = 0, mediaNaturalH = 0;
let mediaLeft = 0, mediaTop = 0, mediaScale = 1;

let drawing=false, startPt=null, curRect=null;
let isPanning=false, lastClient=null;

/* Parts */
let partsBase = [];
let partsCustom = {};
let partsMerged = [];

/* ================= ZONES VISIBILITY (FIX) ================= */
function updateZonesVisibility(){
  canvas.forEachObject(o=>{
    if(o && o.type === "rect"){
      o.set({
        fill: zonesVisible ? "rgba(0,150,255,0.12)" : "rgba(0,0,0,0)",
        stroke: zonesVisible ? "rgba(0,150,255,0.95)" : "rgba(0,0,0,0)"
      });
    }
  });
  canvas.requestRenderAll();
}

/* ================= TOOL UI ================= */
function setActiveTool(t){
  tool = t;

  $("btnSelect").classList.toggle("active", t==="select");
  $("btnDraw").classList.toggle("active", t==="draw");
  $("btnPan").classList.toggle("active", t==="pan");

  canvas.discardActiveObject();

  canvas.selection = (t === "select");

  canvas.defaultCursor =
    t === "draw" ? "crosshair" :
    t === "pan"  ? "grab" :
    "pointer";

  canvas.forEachObject(o=>{
    o.evented = true;
    o.selectable = (t === "select");
  });

  // ✅ Pendant qu’on travaille, on rend visibles
  zonesVisible = true;
  updateZonesVisibility();

  // si vidéo → on désactive le mode Play cliquable
  if(mediaType==="video"){
    stageEl.classList.remove("video-media");
    $("btnVideo").classList.remove("active");
  }
}

/* ================= MEDIA FIT ================= */
function applyMediaBaseFit(){
  if(!mediaNaturalW || !mediaNaturalH) return;

  const cw = stageEl.clientWidth;
  const ch = stageEl.clientHeight;

  const base = Math.min(cw / mediaNaturalW, ch / mediaNaturalH);
  mediaScale = base;
  mediaLeft = (cw - mediaNaturalW * base) / 2;
  mediaTop  = (ch - mediaNaturalH * base) / 2;

  const w = mediaNaturalW * base;
  const h = mediaNaturalH * base;

  if(mediaType==="image"){
    imgEl.style.left = mediaLeft+"px";
    imgEl.style.top = mediaTop+"px";
    imgEl.style.width = w+"px";
    imgEl.style.height = h+"px";
  }else{
    videoEl.style.left = mediaLeft+"px";
    videoEl.style.top = mediaTop+"px";
    videoEl.style.width = w+"px";
    videoEl.style.height = h+"px";
  }

  fitZonesToMedia();
  syncMediaTransformToCanvas();
}

function resizeAll(){
  canvas.setWidth(stageEl.clientWidth);
  canvas.setHeight(stageEl.clientHeight);
  applyMediaBaseFit();
  canvas.requestRenderAll();
}
window.addEventListener("resize", resizeAll);

/* viewport -> media layer */
function syncMediaTransformToCanvas(){
  const v = canvas.viewportTransform || [1,0,0,1,0,0];
  mediaLayer.style.transform = `matrix(${v[0]},${v[1]},${v[2]},${v[3]},${v[4]},${v[5]})`;
}

function resetViewToFit(){
  canvas.setViewportTransform([1,0,0,1,0,0]);
  zoom = 1;
  $("zoomRange").value = "100";
  $("zoomLabel").textContent = "100%";
  syncMediaTransformToCanvas();
  applyMediaBaseFit();
}

/* ================= ZOOM (FIX: centré sur image) ================= */
function setZoom(z){
  zoom = Math.max(0.5, Math.min(3, z));

  // ✅ centre de l'image (fallback si image pas prête)
  const center = (mediaNaturalW && mediaNaturalH)
    ? new fabric.Point(
        mediaLeft + (mediaNaturalW * mediaScale) / 2,
        mediaTop  + (mediaNaturalH * mediaScale) / 2
      )
    : new fabric.Point(canvas.getWidth()/2, canvas.getHeight()/2);

  canvas.zoomToPoint(center, zoom);
  $("zoomRange").value = String(Math.round(zoom*100));
  $("zoomLabel").textContent = Math.round(zoom*100) + "%";
  syncMediaTransformToCanvas();
  canvas.requestRenderAll();
}

$("zoomRange").addEventListener("input", ()=>{
  setZoom(parseInt($("zoomRange").value,10)/100);
});

canvas.on("mouse:wheel", (opt)=>{
  const e = opt.e;
  if(!e.ctrlKey && !e.metaKey) return;
  e.preventDefault(); e.stopPropagation();
  const delta = e.deltaY;
  setZoom( zoom * (0.999 ** delta) );
});

/* ================= ZONES ================= */
function getZones(){ return canvas.getObjects().filter(o=>o && o.type==="rect"); }

function makeZoneRect(){
  const r = new fabric.Rect({
    left:0, top:0, width:50, height:50,
    fill:"rgba(0,150,255,0.12)",
    stroke:"rgba(0,150,255,0.95)",
    strokeWidth:2,
    lockRotation:true,
    objectCaching:false
  });
  r.partId = "";
  r._imgBox = null;
  return r;
}

function updateImgBoxFromRect(r){
  const x = (r.left - mediaLeft) / mediaScale;
  const y = (r.top  - mediaTop ) / mediaScale;
  const w = (r.width  * r.scaleX) / mediaScale;
  const h = (r.height * r.scaleY) / mediaScale;
  r._imgBox = {x,y,w,h};
}

function fitZonesToMedia(){
  getZones().forEach(r=>{
    if(!r._imgBox) return;
    const z = r._imgBox;
    r.set({
      left: mediaLeft + z.x * mediaScale,
      top:  mediaTop  + z.y * mediaScale,
      width: z.w * mediaScale,
      height:z.h * mediaScale,
      scaleX:1, scaleY:1
    });
    r.setCoords();
  });
}

function saveZones(){
  const zones = getZones().map(r=>{
    updateImgBoxFromRect(r);
    return { imgBox:r._imgBox, partId:(r.partId||"") };
  });
  localStorage.setItem(LS_ZONES(currentMediaKey), JSON.stringify(zones));

  // ✅ après sauvegarde → invisible (mais cliquable)
  zonesVisible = false;
  updateZonesVisibility();
}

function loadZones(){
  getZones().forEach(r=>canvas.remove(r));

  const raw = localStorage.getItem(LS_ZONES(currentMediaKey));
  if(!raw){ canvas.requestRenderAll(); return; }

  let zones;
  try{ zones = JSON.parse(raw); }catch{ return; }

  zones.forEach(z=>{
    const r = makeZoneRect();
    r.partId = z.partId || "";
    r._imgBox = z.imgBox || null;
    canvas.add(r);
  });

  fitZonesToMedia();

  // ✅ au chargement: zones issues du storage → invisibles
  zonesVisible = false;
  updateZonesVisibility();
}

canvas.on("object:modified", (e)=>{ if(e.target) saveZones(); });

/* ================= CANVAS EVENTS (select/draw/pan) ================= */
canvas.on("mouse:down", (opt)=>{
  const t = opt.target;

  if(tool==="pan"){
    isPanning = true;
    lastClient = { x:opt.e.clientX, y:opt.e.clientY };
    canvas.defaultCursor = "grabbing";
    return;
  }

  if(t && t.type==="rect"){
    setPanelForZone(t);
    if(tool==="select") canvas.setActiveObject(t);
    return;
  }

  if(tool==="draw"){
    drawing = true;
    startPt = canvas.getPointer(opt.e, true);
    curRect = makeZoneRect();
    curRect.set({ left:startPt.x, top:startPt.y, width:1, height:1 });
    canvas.add(curRect);
    canvas.setActiveObject(curRect);
  }
});

canvas.on("mouse:move", (opt)=>{
  if(drawing && curRect){
    const p = canvas.getPointer(opt.e, true);
    const left = Math.min(p.x, startPt.x);
    const top  = Math.min(p.y, startPt.y);
    const w = Math.abs(p.x - startPt.x);
    const h = Math.abs(p.y - startPt.y);
    curRect.set({ left, top, width:w, height:h, scaleX:1, scaleY:1 });
    curRect.setCoords();
    canvas.requestRenderAll();
  }

  if(isPanning){
    const e = opt.e;
    const vpt = canvas.viewportTransform.slice();
    vpt[4] += (e.clientX - lastClient.x);
    vpt[5] += (e.clientY - lastClient.y);
    lastClient = {x:e.clientX, y:e.clientY};
    canvas.setViewportTransform(vpt);
    syncMediaTransformToCanvas();
    canvas.requestRenderAll();
  }
});

canvas.on("mouse:up", ()=>{
  if(drawing && curRect){
    drawing = false;

    if(curRect.width < 10 || curRect.height < 10){
      canvas.remove(curRect);
      curRect = null;
      canvas.requestRenderAll();
      return;
    }

    updateImgBoxFromRect(curRect);
    curRect.partId = "";
    saveZones();
    setPanelForZone(curRect);
    curRect = null;
  }

  if(isPanning){
    isPanning = false;
    canvas.defaultCursor = (tool==="pan") ? "grab" : (tool==="draw" ? "crosshair" : "pointer");
  }
});

/* ================= MEDIA SWITCH ================= */
async function showMedia(url){
  currentMedia = url;
  currentMediaKey = url;
  mediaType = url.startsWith("video:") ? "video" : "image";

  imgEl.style.display="none";
  videoEl.style.display="none";
  videoEl.pause();
  videoEl.removeAttribute("src");
  videoEl.load();

  resetViewToFit();

  stageEl.classList.remove("video-media");
  $("btnVideo").classList.remove("active");

  if(mediaType==="image"){
    imgEl.src = url;
    imgEl.onload = ()=>{
      mediaNaturalW = imgEl.naturalWidth || 0;
      mediaNaturalH = imgEl.naturalHeight || 0;
      imgEl.style.display="block";
      applyMediaBaseFit();
      loadZones();
    };
    imgEl.onerror = ()=>alert("Image introuvable: "+url);
  }else{
    const src = url.replace("video:","");
    videoEl.src = src;
    videoEl.loop = true;
    videoEl.playsInline = true;
    videoEl.style.display="block";

    await new Promise((resolve)=>{
      const onMeta = ()=>{
        videoEl.removeEventListener("loadedmetadata", onMeta);
        resolve();
      };
      videoEl.addEventListener("loadedmetadata", onMeta);
    });

    mediaNaturalW = videoEl.videoWidth || 0;
    mediaNaturalH = videoEl.videoHeight || 0;

    applyMediaBaseFit();
    loadZones();

    stageEl.classList.add("video-media");
    $("btnVideo").classList.add("active");
  }

  // ✅ robustesse GitHub Pages: s'assurer que canvas/media ont la bonne taille
  setTimeout(()=>{ resizeAll(); }, 0);
}

/* ================= BUTTONS ================= */
$("btnVideo").onclick = ()=>{
  if(mediaType !== "video") return;

  stageEl.classList.add("video-media");
  $("btnVideo").classList.add("active");

  if (videoEl.paused) videoEl.play();
  else videoEl.pause();
};

$("btnSelect").onclick = ()=>setActiveTool("select");
$("btnDraw").onclick   = ()=>setActiveTool("draw");
$("btnPan").onclick    = ()=>setActiveTool("pan");

$("btnErase").onclick  = ()=>{
  const r = canvas.getActiveObject();
  if(!r || r.type!=="rect") return;
  canvas.remove(r);
  canvas.discardActiveObject();
  saveZones();
  clearPanel();
  canvas.requestRenderAll();
};

$("btnFit").onclick = ()=>{
  resetViewToFit();
  fitZonesToMedia();
  clearPanel();
  canvas.requestRenderAll();
};

$("btnFs").onclick = ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

document.addEventListener("fullscreenchange", ()=>{
  document.body.classList.toggle("fs", !!document.fullscreenElement);
  setTimeout(()=>{ resizeAll(); }, 80);
});

/* ================= IMAGE SELECT ================= */
function fillMediaSelect(){
  $("imgSelect").innerHTML = "";
  MEDIAS.forEach(i=>{
    const o = document.createElement("option");
    o.value = i.url;
    o.textContent = i.label;
    $("imgSelect").appendChild(o);
  });
  $("imgSelect").value = currentMedia;
}

$("imgSelect").addEventListener("change", ()=>{
  showMedia($("imgSelect").value);
  clearPanel();
});

/* ================= PARTS (base + custom) ================= */
function readCustomParts(){
  try{ return JSON.parse(localStorage.getItem(PARTS_CUSTOM_KEY) || "{}"); }
  catch{ return {}; }
}
function writeCustomParts(map){
  localStorage.setItem(PARTS_CUSTOM_KEY, JSON.stringify(map || {}));
}
function mergeParts(){
  const map = {};
  partsBase.forEach(p=>{ if(p && p.id) map[p.id]=p; });
  Object.keys(partsCustom).forEach(id=>{ map[id]=partsCustom[id]; });
  partsMerged = Object.values(map).sort((a,b)=>{
    const A=(a.nom||a.id||"").toLowerCase();
    const B=(b.nom||b.id||"").toLowerCase();
    return A.localeCompare(B,"fr");
  });
}
function fillPartsSelect(){
  const sel = $("pieceSelect");
  sel.innerHTML = '<option value="">— choisir —</option>';
  partsMerged.forEach(p=>{
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = `${p.nom || p.id} (${p.circuit || "-"})`;
    sel.appendChild(o);
  });
}
function clearPanel(){
  $("pieceSelect").value = "";
  $("partIdLabel").textContent = "—";
  $("nom").value = "";
  $("role").value = "";
  $("desc").value = "";
  $("circuit").value = "";
}
function setPanelFromPart(part){
  if(!part){ clearPanel(); return; }
  $("pieceSelect").value = part.id || "";
  $("partIdLabel").textContent = part.id || "—";
  $("nom").value = part.nom || "";
  $("role").value = part.role || "";
  $("desc").value = part.desc || "";
  $("circuit").value = part.circuit || "";
}
function getPartById(id){
  if(!id) return null;
  return partsMerged.find(p=>p.id===id) || null;
}
function setPanelForZone(r){
  if(!r){ clearPanel(); return; }
  const pid = (r.partId||"").toString();
  const p = getPartById(pid);
  if(p) setPanelFromPart(p);
  else{
    clearPanel();
    $("partIdLabel").textContent = pid || "—";
    $("pieceSelect").value = pid;
    $("desc").value = pid ? "(Pièce introuvable dans les listes)" : "";
  }
}

async function loadParts(){
  try{
    const res = await fetch(JSON_URL, { cache:"no-store" });
    if(!res.ok) throw new Error("JSON introuvable");
    const data = await res.json();
    if(Array.isArray(data)){
      partsBase = data.map(p=>({
        id: (p.id||"").toString(),
        nom: (p.nom||"").toString(),
        role:(p.role||"").toString(),
        desc:(p.desc||"").toString(),
        circuit:(p.circuit||"").toString()
      })).filter(p=>p.id);
    }else partsBase = [];
  }catch(e){
    partsBase = [];
    console.error(e);
  }
  partsCustom = readCustomParts();
  mergeParts();
  fillPartsSelect();
}

$("pieceSelect").addEventListener("change", ()=>{
  const id = $("pieceSelect").value;
  const p = getPartById(id);
  if(p) setPanelFromPart(p);
  else{
    $("partIdLabel").textContent = id || "—";
    if(!id) clearPanel();
  }
  const r = canvas.getActiveObject();
  if(r && r.type==="rect"){
    r.partId = id;
    saveZones();
    setPanelForZone(r);
  }
});

$("btnSavePart").addEventListener("click", ()=>{
  const nom = $("nom").value.trim();
  const role = $("role").value.trim();
  const desc = $("desc").value.trim();
  const circuit = $("circuit").value.trim();

  let id = ($("pieceSelect").value || "").trim();
  if(!id) id = slugify(nom);
  if(!id){
    alert("Il faut au minimum un NOM (pour générer un ID).");
    return;
  }

  partsCustom[id] = { id, nom: nom || id, role, desc, circuit };
  writeCustomParts(partsCustom);

  mergeParts();
  fillPartsSelect();

  $("pieceSelect").value = id;
  $("partIdLabel").textContent = id;

  const r = canvas.getActiveObject();
  if(r && r.type==="rect"){
    r.partId = id;
    saveZones();
  }

  setPanelFromPart(partsCustom[id]);
});

/* ================= INIT ================= */
(async function init(){
  fillMediaSelect();
  await loadParts();

  resizeAll();
  await showMedia(currentMedia);

  // ✅ au démarrage : zones invisibles (issues du storage)
  zonesVisible = false;
  updateZonesVisibility();

  // outil par défaut (mais zones restent invisibles tant que tu n'édites pas)
  tool = "select";
  $("btnSelect").classList.add("active");

  setTimeout(()=>{ resizeAll(); }, 120);
})();
</script>
