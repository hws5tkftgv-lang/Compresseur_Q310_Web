<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L — Lecture / Éditeur</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: #0c132e;
  color: #eaf1ff;
  font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
}

/* ===== TOP BAR ===== */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: #0f1a3f;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

/* ===== BUTTONS ===== */
.btn {
  padding: 7px 11px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.14);
  background: #1b2553;
  color: #eaf1ff;
  cursor: pointer;
}

/* ===== LAYOUT ===== */
.wrap {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 12px;
  padding: 12px;
}

.stage {
  position: relative;
  background: #0b1536;
  border-radius: 12px;
  overflow: hidden;
  min-height: 65vh;
}

.panel {
  background: #0f1a44;
  border-radius: 12px;
  padding: 12px;
}

/* ===== CANVAS ===== */
canvas {
  display: block;
}

/* ===== FULLSCREEN BUTTON ===== */
.fs-btn {
  position: absolute;
  right: 12px;
  bottom: 12px;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(15,20,50,.85);
  border: 1px solid rgba(255,255,255,.35);
  color: #fff;
  cursor: pointer;
  z-index: 10;
}

/* ===== READ ONLY ===== */
.readonly {
  pointer-events: none;
  opacity: .85;
  background: #0a1433;
}

/* ===== FULLSCREEN MODE ===== */
body.fs-mode {
  overflow: hidden;
  background: #020617;
}

body.fs-mode .topbar {
  display: none;
}

body.fs-mode .wrap {
  position: fixed;
  inset: 0;
  padding: 0;
  margin: 0;
  grid-template-columns: 70% 30%;
}

body.fs-mode .stage,
body.fs-mode .panel {
  border-radius: 0;
  height: 100vh;
}
</style>
</head>

<body>

<div class="topbar">
  <b id="modeLabel">Lecture</b>
  <button id="toggleMode" class="btn">Passer en Éditeur</button>
</div>

<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
    <button id="btnFsToggle" class="btn fs-btn">⤢ Plein écran</button>
  </div>

  <aside class="panel">
    <h3>Description</h3>
    <textarea id="desc" rows="10"></textarea>
  </aside>
</div>


<script>
  /* ===================== DATA ===================== */
let partsData = [];

// Charger le fichier JSON des pièces
async function loadPartsData(){
  try{
    const res = await fetch("quincy_310L_parts.json");
    if(!res.ok) throw new Error("JSON introuvable");
    partsData = await res.json();
    console.log("✅ Données chargées :", partsData);
  }catch(err){
    console.error("❌ Erreur chargement JSON :", err);
  }
}
/* ================= CANVAS ================= */
const canvas = new fabric.Canvas("c", { selection:false });
let bgImg = null;
let isReading = true;
/* ================= HOTSPOTS ================= */
let drawing = false;
let startX, startY;
let currentRect = null;

canvas.on("mouse:down", opt => {
  if (isReading) return;

  const p = canvas.getPointer(opt.e);
  drawing = true;
  startX = p.x;
  startY = p.y;

  currentRect = new fabric.Rect({
    left: startX,
    top: startY,
    width: 1,
    height: 1,
    fill: "rgba(255,0,0,0.25)",
    stroke: "red",
    strokeWidth: 2,
    selectable: true,
    hasControls: true
  });

  canvas.add(currentRect);
});

canvas.on("mouse:move", opt => {
  if (!drawing || !currentRect) return;

  const p = canvas.getPointer(opt.e);
  currentRect.set({
    width: Math.abs(p.x - startX),
    height: Math.abs(p.y - startY),
    left: Math.min(p.x, startX),
    top: Math.min(p.y, startY)
  });

  canvas.requestRenderAll();
});

canvas.on("mouse:up", () => {
  drawing = false;
  saveHotspots();
});
  function saveHotspots() {
  const zones = canvas.getObjects().filter(o => o !== bgImg).map(o => ({
    left: o.left,
    top: o.top,
    width: o.width * o.scaleX,
    height: o.height * o.scaleY
  }));
  localStorage.setItem("q310_hotspots", JSON.stringify(zones));
}

function loadHotspots() {
  const raw = localStorage.getItem("q310_hotspots");
  if (!raw) return;

  JSON.parse(raw).forEach(z => {
    const r = new fabric.Rect({
      ...z,
      fill: "rgba(255,0,0,0.25)",
      stroke: "red",
      strokeWidth: 2
    });
    canvas.add(r);
  });

  canvas.requestRenderAll();
}

function applyLecture(on) {
  isReading = on;

  canvas.getObjects().forEach(o => {
    if (o === bgImg) return;
    o.selectable = !on;
    o.evented = !on;
  });

  document.getElementById("desc").readOnly = on;
}

/* ================= RESIZE ================= */
function resizeCanvas() {
  const stage = document.querySelector(".stage");
  canvas.setWidth(stage.clientWidth);
  canvas.setHeight(stage.clientHeight);
  fitBackground();
}

/* ================= IMAGE ================= */
function fitBackground() {
  if (!bgImg) return;

  const cw = canvas.getWidth();
  const ch = canvas.getHeight();
  const iw = bgImg.width;
  const ih = bgImg.height;

  const scale = Math.min(cw / iw, ch / ih);

  bgImg.scale(scale);
  bgImg.set({
    left: (cw - iw * scale) / 2,
    top:  (ch - ih * scale) / 2,
    selectable: false,
    evented: false
  });

  canvas.requestRenderAll();
}

function loadBackground() {
  fabric.Image.fromURL(
    "actif/compresseur_bg.png",
    img => {
      bgImg = img;
      bgImg.objectCaching = false;
      canvas.add(bgImg);
      fitBackground();
    },
    { crossOrigin: "anonymous" }
  );
}

/* ================= MODE ================= */
function applyLecture(on) {
  isReading = on;
  document.getElementById("modeLabel").textContent = on ? "Lecture" : "Éditeur";
  document.getElementById("toggleMode").textContent = on ? "Passer en Éditeur" : "Passer en Lecture";

  const d = document.getElementById("desc");
  d.readOnly = on;
  d.classList.toggle("readonly", on);
}

document.getElementById("toggleMode").onclick = () => {
  if (isReading) {
    if (prompt("Mot de passe Éditeur :") !== "PROF") return;
    applyLecture(false);
  } else {
    applyLecture(true);
  }
};

/* ================= FULLSCREEN ================= */
document.getElementById("btnFsToggle").onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};

document.addEventListener("fullscreenchange", () => {
  document.body.classList.toggle("fs-mode", !!document.fullscreenElement);
  setTimeout(() => {
    resizeCanvas();
  }, 50);
});

/* ================= INIT ================= */
resizeCanvas();
loadBackground();
loadPartsData();   // JSON
loadHotspots();    // sauvegarde
applyLecture(true);


window.addEventListener("resize", resizeCanvas);
</script>

</body>
</html>
