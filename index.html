<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Zones interactives</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#0b1436;
  color:#eaf1ff;
  font-family:Arial,Segoe UI,sans-serif;
}

.topbar{
  display:flex;gap:8px;align-items:center;
  padding:10px;background:#0f1a3f;
  border-bottom:1px solid rgba(255,255,255,.1);
  position:sticky;top:0;z-index:10;
}

.btn{
  padding:7px 12px;
  background:#1b2553;color:#fff;
  border:1px solid rgba(255,255,255,.2);
  border-radius:8px;
  cursor:pointer;font-weight:700;
}
.btn.active{background:#0078ff}
.btn.danger{background:#7f1d2d}

.select{
  background:#101a40;color:#fff;
  border-radius:8px;padding:7px 10px;
  border:1px solid rgba(255,255,255,.2);
}

.wrap{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:12px;padding:12px;
}
@media(max-width:1000px){
  .wrap{grid-template-columns:1fr}
}

.stage{
  position:relative;
  background:#0b1536;
  border-radius:12px;
  min-height:78vh;
  overflow:hidden;
}

/* MEDIA TOUJOURS SOUS LE CANVAS */
.media-layer{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
}
#imgLayer,#videoLayer{
  position:absolute;
  display:none;
}

/* CANVAS FABRIC AU-DESSUS (OBLIGATOIRE) */
#c{
  position:absolute;
  inset:0;
  z-index:5;
}

.panel{
  background:#0f1a44;
  border-radius:12px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

label{font-size:12px}
textarea,input{
  width:100%;
  background:#101a40;
  color:#fff;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.2);
  padding:10px;
}
textarea{min-height:90px}
.small{font-size:12px;opacity:.8}
.hr{height:1px;background:rgba(255,255,255,.15)}
</style>
</head>

<body>

<div class="topbar">
  <select id="imgSelect" class="select"></select>
  <button id="btnVideo" class="btn">🎬 Vidéo</button>
  <button id="btnSelect" class="btn active">🖱</button>
  <button id="btnDraw" class="btn">✏️</button>
  <button id="btnPan" class="btn">✋</button>
  <button id="btnErase" class="btn danger">🧽</button>
</div>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="media-layer">
      <img id="imgLayer">
      <video id="videoLayer" muted loop playsinline></video>
    </div>
    <canvas id="c"></canvas>
  </div>

  <aside class="panel">
    <h3>🟦 Fiche de la zone</h3>
    <div class="small">Mode enseignant – édition active</div>
    <div class="hr"></div>

    <label>Pièce</label>
    <select id="pieceSelect" class="select"></select>
    <div class="small">ID : <span id="partIdLabel">—</span></div>

    <label>Nom</label>
    <input id="nom">

    <label>Rôle</label>
    <textarea id="role"></textarea>

    <label>Description</label>
    <textarea id="desc"></textarea>

    <label>Circuit</label>
    <input id="circuit">

    <button id="btnSavePart" class="btn">💾 Sauvegarder</button>
  </aside>
</div>

<script>
/* ================= CONFIG ================= */
const MEDIAS=[
 {label:"Fond référence",url:"actif/compresseur_bg.png"},
 {label:"Animation – Compresseur 2 stages",url:"video:actif/compresseur_2_stages.mp4"}
];

/* ================= BASE ================= */
const $=id=>document.getElementById(id);
const imgEl=$("imgLayer");
const videoEl=$("videoLayer");

const canvas=new fabric.Canvas("c",{selection:true});
let tool="select";
let drawing=false,startPt=null,curRect=null;
let isPanning=false,lastPos=null;
let currentMedia=MEDIAS[0].url;

/* ================= TOOLS ================= */
function setTool(t){
  tool=t;
  ["Select","Draw","Pan"].forEach(x=>{
    $("btn"+x).classList.toggle("active",t===x.toLowerCase());
  });
  canvas.defaultCursor=
    t==="draw"?"crosshair":
    t==="pan"?"grab":"default";
}
$("btnSelect").onclick=()=>setTool("select");
$("btnDraw").onclick=()=>setTool("draw");
$("btnPan").onclick=()=>setTool("pan");

/* ================= DRAW / PAN (FIX DÉFINITIF) ================= */
canvas.on("mouse:down",e=>{
  if(tool==="pan"){
    isPanning=true;
    lastPos={x:e.e.clientX,y:e.e.clientY};
    return;
  }
  if(tool==="draw"){
    drawing=true;
    startPt=canvas.getPointer(e.e);
    curRect=new fabric.Rect({
      left:startPt.x,top:startPt.y,
      width:1,height:1,
      fill:"rgba(0,150,255,.15)",
      stroke:"#00aaff",strokeWidth:2,
      lockRotation:true
    });
    canvas.add(curRect);
  }
});

canvas.on("mouse:move",e=>{
  if(drawing&&curRect){
    const p=canvas.getPointer(e.e);
    curRect.set({
      left:Math.min(p.x,startPt.x),
      top:Math.min(p.y,startPt.y),
      width:Math.abs(p.x-startPt.x),
      height:Math.abs(p.y-startPt.y)
    });
    curRect.setCoords();
    canvas.requestRenderAll();
  }
  if(isPanning){
    const dx=e.e.clientX-lastPos.x;
    const dy=e.e.clientY-lastPos.y;
    const vpt=canvas.viewportTransform;
    vpt[4]+=dx;vpt[5]+=dy;
    canvas.setViewportTransform(vpt);
    lastPos={x:e.e.clientX,y:e.e.clientY};
  }
});

canvas.on("mouse:up",()=>{
  drawing=false;
  isPanning=false;
});

/* ================= MEDIA ================= */
async function showMedia(url){
  currentMedia=url;
  imgEl.style.display="none";
  videoEl.style.display="none";
  videoEl.pause();

  if(url.startsWith("video:")){
    videoEl.src=url.replace("video:","");
    videoEl.style.display="block";
  }else{
    imgEl.src=url;
    imgEl.style.display="block";
  }
}

$("btnVideo").onclick=async()=>{
  if(videoEl.src){
    if(videoEl.paused) await videoEl.play();
    else videoEl.pause();
  }
};

/* ================= INIT ================= */
(function init(){
  MEDIAS.forEach(m=>{
    const o=document.createElement("option");
    o.value=m.url;o.textContent=m.label;
    $("imgSelect").appendChild(o);
  });
  $("imgSelect").onchange=()=>showMedia($("imgSelect").value);
  showMedia(currentMedia);
})();
</script>

</body>
</html>
