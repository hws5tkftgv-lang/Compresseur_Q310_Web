<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Zones interactives</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
html,body{
  margin:0;
  background:#0b1436;
  color:#fff;
  font-family:Arial, sans-serif;
}
.topbar{
  display:flex;
  gap:8px;
  padding:10px;
  background:#0f1a3f;
}
button,select{
  padding:6px 10px;
  background:#1b2553;
  color:#fff;
  border:1px solid #444;
  border-radius:6px;
  cursor:pointer;
}
button.active{ background:#0078ff; }

.stage{
  position:relative;
  width:100%;
  height:90vh;
  background:#000;
  overflow:hidden;
}
.media{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1;
}
.media img,
.media video{
  max-width:100%;
  max-height:100%;
}
canvas{
  position:absolute;
  inset:0;
  z-index:2;
}
</style>
</head>

<body>

<div class="topbar">
  <select id="mediaSelect">
    <option value="image">Image – Compresseur</option>
    <option value="video">Vidéo – 2 stages</option>
  </select>

  <button id="btnVideo">▶ Play / Pause</button>
  <button id="btnSelect" class="active">🖱 Sélection</button>
  <button id="btnDraw">✏️ Crayon</button>
  <button id="btnPan">✋ Pan</button>
</div>

<div class="stage" id="stage">
  <div class="media">
    <img id="img" src="actif/compresseur_bg.png">
    <video id="video" src="actif/compresseur_2_stages.mp4" loop></video>
  </div>
  <canvas id="c"></canvas>
</div>

<script>
const canvas = new fabric.Canvas("c",{ selection:true });
const img = document.getElementById("img");
const video = document.getElementById("video");

let tool = "select";
let drawing = false;
let start = null;
let rect = null;
let panning = false;
let last = null;

/* ----------- MEDIA ----------- */
video.style.display = "none";

document.getElementById("mediaSelect").onchange = e=>{
  if(e.target.value === "video"){
    img.style.display="none";
    video.style.display="block";
  }else{
    video.pause();
    video.style.display="none";
    img.style.display="block";
  }
};

document.getElementById("btnVideo").onclick = ()=>{
  if(video.paused) video.play();
  else video.pause();
};

/* ----------- TOOLS ----------- */
function setTool(t){
  tool=t;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  if(t==="select") btnSelect.classList.add("active");
  if(t==="draw") btnDraw.classList.add("active");
  if(t==="pan") btnPan.classList.add("active");

  canvas.selection = (t==="select");
  canvas.forEachObject(o=>{
    o.selectable = (t==="select");
  });
}

btnSelect.onclick = ()=>setTool("select");
btnDraw.onclick   = ()=>setTool("draw");
btnPan.onclick    = ()=>setTool("pan");

/* ----------- CANVAS ----------- */
canvas.on("mouse:down", opt=>{
  const e = opt.e;

  if(tool==="pan"){
    panning=true;
    last={x:e.clientX,y:e.clientY};
    return;
  }

  if(tool==="draw"){
    drawing=true;
    start=canvas.getPointer(e);
    rect=new fabric.Rect({
      left:start.x,
      top:start.y,
      width:1,
      height:1,
      fill:"rgba(0,150,255,0.2)",
      stroke:"#0096ff",
      strokeWidth:2
    });
    canvas.add(rect);
  }
});

canvas.on("mouse:move", opt=>{
  const e = opt.e;

  if(drawing && rect){
    const p=canvas.getPointer(e);
    rect.set({
      width:Math.abs(p.x-start.x),
      height:Math.abs(p.y-start.y),
      left:Math.min(p.x,start.x),
      top:Math.min(p.y,start.y)
    });
    canvas.renderAll();
  }

  if(panning){
    const vpt = canvas.viewportTransform;
    vpt[4]+=e.clientX-last.x;
    vpt[5]+=e.clientY-last.y;
    last={x:e.clientX,y:e.clientY};
    canvas.requestRenderAll();
  }
});

canvas.on("mouse:up", ()=>{
  drawing=false;
  panning=false;
});
</script>

</body>
</html>
