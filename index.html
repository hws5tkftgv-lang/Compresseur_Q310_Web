<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Zones interactives</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#0c132e;
  color:#eaf1ff;
  font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
}

/* ===== BARRE OUTILS ===== */
.topbar{
  position:relative;
  z-index:1000;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:#0f1a3f;
}

.btn{
  padding:6px 12px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.15);
  background:#1b2553;
  color:#eaf1ff;
  cursor:pointer;
  font-size:13px;
}
.btn.active{background:#0078ff}
.btn.icon{font-size:16px;padding:6px 10px}

.zoomwrap{
  display:flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:10px;
  background:#121c45;
  border:1px solid rgba(255,255,255,.15);
}
.zoomwrap input{width:140px}

/* ===== LAYOUT ===== */
.wrap{
  display:grid;
  grid-template-columns:1fr 320px;
  gap:12px;
  padding:12px;
}
.stage{
  position:relative;
  background:#0b1536;
  border-radius:12px;
  overflow:hidden;
  min-height:80vh;
}
.panel{
  background:#0f1a44;
  border-radius:12px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

/* ===== FORM ===== */
select,input,textarea{
  width:100%;
  background:#101a40;
  color:#eaf1ff;
  border:1px solid rgba(255,255,255,.15);
  border-radius:6px;
  padding:6px 8px;
}
textarea{min-height:90px}

/* ===== FULLSCREEN ===== */
body.fs .wrap{
  position:fixed;
  inset:0;
  padding:8px;
}
canvas{display:block}
</style>
</head>

<body>

<!-- ===== TOOLBAR ===== -->
<div class="topbar">
  <b id="modeLabel">Mode : Lecture</b>
  <button id="btnMode" class="btn">Éditeur</button>

  <div class="zoomwrap">
    <b>Zoom</b>
    <input id="zoomRange" type="range" min="50" max="250" value="100">
    <span id="zoomTxt">100%</span>
  </div>

  <button id="btnSelect" class="btn icon active">🖱</button>
  <button id="btnDraw"   class="btn icon">✏️</button>
  <button id="btnErase"  class="btn icon">🧽</button>
  <button id="btnHand"   class="btn icon">✋</button>
  <button id="btnFit"    class="btn icon">⤡</button>
  <button id="btnFs"     class="btn icon">⛶</button>
</div>

<!-- ===== MAIN ===== -->
<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
  </div>

  <aside class="panel">
    <h3>Zone</h3>

    <label>Pièce</label>
    <select id="pieceSelect">
      <option value="">— choisir —</option>
    </select>

    <label>Nom</label>
    <input id="fName">

    <label>Description</label>
    <textarea id="fDesc"></textarea>

    <button id="btnApply" class="btn active">Appliquer</button>
  </aside>
</div>

<script>
/* ===== CONFIG ===== */
const IMG_URL = "actif/compresseur_bg.png";
const JSON_URL = "quincy_310L_parts.json";

/* ===== CANVAS ===== */
const canvas = new fabric.Canvas("c",{selection:false});
let bg=null, tool="select", isEditor=false;
let drawing=false,start={},currentRect=null;

/* ===== UI ===== */
const $=id=>document.getElementById(id);
const btns={select:$("btnSelect"),draw:$("btnDraw"),erase:$("btnErase"),hand:$("btnHand")};

/* ===== TOOLS ===== */
function setTool(t){
  tool=t;
  Object.keys(btns).forEach(k=>btns[k].classList.remove("active"));
  if(btns[t]) btns[t].classList.add("active");
  canvas.defaultCursor = t==="hand"?"grab":t==="draw"?"crosshair":"default";
}

/* ===== IMAGE ===== */
fabric.Image.fromURL(IMG_URL,img=>{
  bg=img;
  bg.selectable=false;
  canvas.add(bg);
  resize();
});

/* ===== ZOOM ===== */
function applyZoom(p){
  const z=p/100;
  const c=new fabric.Point(canvas.width/2,canvas.height/2);
  canvas.zoomToPoint(c,z);
  $("zoomTxt").textContent=p+"%";
}
$("zoomRange").oninput=e=>applyZoom(e.target.value);

/* ===== RESIZE ===== */
function resize(){
  const s=document.querySelector(".stage");
  canvas.setWidth(s.clientWidth);
  canvas.setHeight(s.clientHeight);
  if(bg){
    const sc=Math.min(canvas.width/bg.width,canvas.height/bg.height);
    bg.scale(sc);
    bg.left=(canvas.width-bg.width*sc)/2;
    bg.top =(canvas.height-bg.height*sc)/2;
    canvas.sendToBack(bg);
  }
  canvas.requestRenderAll();
}
window.addEventListener("resize",resize);

/* ===== DRAW RECT ===== */
canvas.on("mouse:down",e=>{
  if(!isEditor||tool!=="draw") return;
  const p=canvas.getPointer(e.e,true);
  drawing=true;start=p;
  currentRect=new fabric.Rect({
    left:p.x,top:p.y,width:1,height:1,
    fill:"rgba(0,140,255,.2)",
    stroke:"#0af",strokeWidth:2
  });
  canvas.add(currentRect);
});
canvas.on("mouse:move",e=>{
  if(!drawing) return;
  const p=canvas.getPointer(e.e,true);
  currentRect.set({
    left:Math.min(p.x,start.x),
    top:Math.min(p.y,start.y),
    width:Math.abs(p.x-start.x),
    height:Math.abs(p.y-start.y)
  });
  canvas.requestRenderAll();
});
canvas.on("mouse:up",()=>{
  if(!drawing) return;
  drawing=false;
  canvas.setActiveObject(currentRect);
  $("pieceSelect").focus(); // 🔑 ouvre la fiche automatiquement
  currentRect=null;
});

/* ===== PAN ===== */
let pan=false,last={};
canvas.on("mouse:down",e=>{
  if(tool!=="hand") return;
  pan=true; last={x:e.e.clientX,y:e.e.clientY};
});
canvas.on("mouse:move",e=>{
  if(!pan) return;
  const v=canvas.viewportTransform;
  v[4]+=e.e.clientX-last.x;
  v[5]+=e.e.clientY-last.y;
  last={x:e.e.clientX,y:e.e.clientY};
  canvas.setViewportTransform(v);
});
canvas.on("mouse:up",()=>pan=false);

/* ===== ERASE ===== */
$("btnErase").onclick=()=>{
  if(!isEditor) return;
  const o=canvas.getActiveObject();
  if(o && o!==bg) canvas.remove(o);
};

/* ===== MODE ===== */
$("btnMode").onclick=()=>{
  isEditor=!isEditor;
  $("modeLabel").textContent=isEditor?"Mode : Éditeur":"Mode : Lecture";
  setTool("select");
};

/* ===== BUTTONS ===== */
$("btnSelect").onclick=()=>setTool("select");
$("btnDraw").onclick  =()=>setTool("draw");
$("btnHand").onclick  =()=>setTool("hand");
$("btnFit").onclick   =()=>{canvas.setViewportTransform([1,0,0,1,0,0]);applyZoom(100);resize()};
$("btnFs").onclick    =()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();

/* ===== JSON ===== */
fetch(JSON_URL).then(r=>r.json()).then(d=>{
  d.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id;o.textContent=p.id+" — "+p.name;
    $("pieceSelect").appendChild(o);
  });
});
</script>

</body>
</html>
