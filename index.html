<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quincy 310L — Vision interactive</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root{color-scheme:dark}
html,body{margin:0;background:#0c132e;color:#eaf1ff;font-family:system-ui}
*{box-sizing:border-box}

.topbar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#0f1a3f;border-bottom:1px solid rgba(255,255,255,.1)}
.btn{padding:7px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#1b2553;color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.hidden{display:none!important}

.wrap{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px}
.stage{position:relative;background:#0b1536;border-radius:12px;overflow:hidden;min-height:60vh}
canvas{touch-action:none}

.panel{background:#0f1a44;border-radius:12px;padding:12px}
.panel textarea,.panel input,.panel select{width:100%;background:#0b1638;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:8px}
.panel textarea[readonly],.panel input[readonly]{opacity:.7}

/* Bouton plein écran */
.fs-btn{
  position:absolute;right:12px;bottom:12px;
  padding:6px 12px;border-radius:999px;
  background:rgba(10,15,40,.9);
  border:1px solid rgba(255,255,255,.3);
  color:#fff;cursor:pointer;z-index:10
}

/* -------- FULLSCREEN YOUTUBE -------- */
body.fs-mode{overflow:hidden}
body.fs-mode .topbar{display:none}
body.fs-mode .wrap{
  position:fixed;inset:0;margin:0;padding:0;
  grid-template-columns:70% 30%;
}
body.fs-mode .stage{border-radius:0;min-height:100vh}
body.fs-mode .panel{border-radius:0;height:100vh;overflow:auto}
</style>
</head>

<body>

<div class="topbar">
  <b>Mode :</b> <span id="modeLabel">Lecture</span>
  <button id="toggleMode" class="btn">Passer en Éditeur</button>
  <span style="flex:1"></span>
</div>

<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
    <button id="btnFsToggle" class="fs-btn">⤢ Plein écran</button>
  </div>

  <aside class="panel">
    <label>Nom</label>
    <input id="partName" readonly>
    <label>Rôle</label>
    <input id="partRole" readonly>
    <label>Description</label>
    <textarea id="partDesc" readonly></textarea>
  </aside>
</div>

<script>
/* ======================================================
   VARIABLES
====================================================== */
const canvas = new fabric.Canvas("c",{selection:false,backgroundColor:"#0b1536"});
let bgImg=null;
let isReading=true;
let isFullscreen=false;

/* ======================================================
   IMAGE
====================================================== */
function loadBackground(){
  fabric.Image.fromURL("actif/VUE_GENERAL.jpeg",(img)=>{
    bgImg=img;
    img.selectable=false;
    canvas.add(img);
    fitImage();
  });
}

function fitImage(){
  if(!bgImg)return;
  canvas.setViewportTransform([1,0,0,1,0,0]);
  const cw=canvas.getWidth(), ch=canvas.getHeight();
  const s=Math.min(cw/bgImg.width,ch/bgImg.height);
  bgImg.scale(s);
  bgImg.set({
    left:(cw-bgImg.width*s)/2,
    top:(ch-bgImg.height*s)/2
  });
  canvas.requestRenderAll();
}

/* ======================================================
   RESIZE
====================================================== */
function resizeCanvas(){
  const stage=document.querySelector(".stage");
  canvas.setWidth(stage.clientWidth);
  canvas.setHeight(isFullscreen?window.innerHeight:Math.max(520,window.innerHeight*0.7));
  fitImage();
}
window.addEventListener("resize",resizeCanvas);

/* ======================================================
   MODE LECTURE / ÉDITEUR
====================================================== */
function applyMode(reading){
  isReading=reading;
  document.getElementById("modeLabel").textContent=reading?"Lecture":"Éditeur";
  document.getElementById("partName").readOnly=reading;
  document.getElementById("partRole").readOnly=reading;
  document.getElementById("partDesc").readOnly=reading;
}

document.getElementById("toggleMode").onclick=()=>{
  if(isReading){
    if(prompt("Mot de passe éditeur")!=="PROF")return;
    applyMode(false);
  }else{
    applyMode(true);
  }
};

/* ======================================================
   FULLSCREEN RÉEL (YOUTUBE)
====================================================== */
const fsBtn=document.getElementById("btnFsToggle");

fsBtn.onclick=()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
};

document.addEventListener("fullscreenchange",()=>{
  isFullscreen=!!document.fullscreenElement;
  document.body.classList.toggle("fs-mode",isFullscreen);
  setTimeout(resizeCanvas,80);
});

/* ======================================================
   INIT
====================================================== */
resizeCanvas();
applyMode(true);
loadBackground();
</script>

</body>
</html>
