<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L — Zones interactives</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root{color-scheme:dark;}
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#0c132e;
  color:#eaf1ff;
  font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
}

/* ===== TOOLBAR ===== */
.topbar{
  position:relative;
  z-index:1000; /* 🔑 boutons cliquables */
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  background:#0f1a3f;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.btn{
  padding:6px 12px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.15);
  background:#1b2553;
  color:#eaf1ff;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}
.btn.primary{background:#0078ff}
.btn.tiny{padding:5px 10px}

/* ===== ZOOM ===== */
.zoomwrap{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.15);
  background:#121c45;
}
.zoomwrap input{width:140px}

/* ===== LAYOUT ===== */
.wrap{
  display:grid;
  grid-template-columns:1fr 340px;
  gap:12px;
  padding:12px;
}
.stage{
  position:relative;
  z-index:1;
  background:#0b1536;
  border-radius:12px;
  overflow:hidden;
  min-height:80vh;
}
.panel{
  background:#0f1a44;
  border-radius:12px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* ===== CANVAS ===== */
canvas{display:block}

/* ===== FULLSCREEN ===== */
body.fs-mode{
  background:#020617;
  overflow:hidden;
}
body.fs-mode .wrap{
  position:fixed;
  inset:0;
  padding:8px;
  grid-template-columns:70% 30%;
}

/* ===== FORM ===== */
select,input,textarea{
  width:100%;
  background:#101a40;
  color:#eaf1ff;
  border:1px solid rgba(255,255,255,.15);
  border-radius:6px;
  padding:6px 8px;
  font-size:13px;
}
textarea{resize:vertical;min-height:90px}
</style>
</head>

<body>

<!-- ===== TOOLBAR ===== -->
<div class="topbar">
  <b id="modeLabel">Lecture</b>
  <button id="btnMode" class="btn">Éditeur</button>

  <div class="zoomwrap">
    <b>Zoom</b>
    <input id="zoomRange" type="range" min="50" max="250" value="100">
    <span id="zoomTxt">100%</span>
  </div>

  <button id="btnSelect" class="btn tiny primary">Sélection</button>
  <button id="btnRect"   class="btn tiny">Zone</button>
  <button id="btnHand"   class="btn tiny">Main</button>
  <button id="btnFit"    class="btn tiny">Ajuster</button>
  <button id="btnFs"     class="btn tiny">Plein écran</button>
</div>

<!-- ===== MAIN ===== -->
<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
  </div>

  <aside class="panel">
    <h3>Zone sélectionnée</h3>

    <label>Pièce (JSON)</label>
    <select id="pieceSelect">
      <option value="">— choisir —</option>
    </select>

    <label>Nom</label>
    <input id="fName">

    <label>Description</label>
    <textarea id="fDesc"></textarea>

    <button id="btnApply" class="btn primary">Appliquer</button>
    <button id="btnDelete" class="btn">Supprimer</button>
  </aside>
</div>

<script>
/* ================= CONFIG ================= */
const IMG_URL = "actif/compresseur_bg.png";
const PARTS_JSON = "quincy_310L_parts.json";
const LS_KEY = "q310_zones_v1";
const EDIT_PW = "PROF";

/* ================= CANVAS ================= */
const canvas = new fabric.Canvas("c",{selection:false});
let bgImg=null;
let tool="select";
let isReading=true;
let drawing=false,start={x:0,y:0},rect=null;

/* ================= UI ================= */
const $ = id=>document.getElementById(id);
const btnSelect=$("btnSelect"),btnRect=$("btnRect"),btnHand=$("btnHand");

/* ================= TOOL ================= */
function setTool(t){
  tool=t;
  btnSelect.classList.toggle("primary",t==="select");
  btnRect.classList.toggle("primary",t==="rect");
  btnHand.classList.toggle("primary",t==="hand");
  canvas.defaultCursor=
    t==="hand"?"grab":t==="rect"?"crosshair":"default";
}

/* ================= IMAGE ================= */
function fitImage(){
  const cw=canvas.width,ch=canvas.height;
  const s=Math.min(cw/bgImg.width,ch/bgImg.height);
  bgImg.scale(s);
  bgImg.left=(cw-bgImg.width*s)/2;
  bgImg.top =(ch-bgImg.height*s)/2;
  canvas.sendToBack(bgImg);
}

/* ================= ZOOM ================= */
function applyZoom(pct){
  const z=pct/100;
  const center=new fabric.Point(canvas.width/2,canvas.height/2);
  canvas.zoomToPoint(center,z);
  $("zoomTxt").textContent=pct+"%";
}

/* ================= LOAD ================= */
async function loadJSON(){
  const r=await fetch(PARTS_JSON);
  const d=await r.json();
  d.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id;
    o.textContent=p.id+" — "+p.name;
    $("pieceSelect").appendChild(o);
  });
}

fabric.Image.fromURL(IMG_URL,img=>{
  bgImg=img;
  bgImg.selectable=false;
  canvas.add(bgImg);
  resize();
});

/* ================= RESIZE ================= */
function resize(){
  const s=document.querySelector(".stage");
  canvas.setWidth(s.clientWidth);
  canvas.setHeight(s.clientHeight);
  if(bgImg) fitImage();
  canvas.requestRenderAll();
}

/* ================= DRAW RECT ================= */
canvas.on("mouse:down",e=>{
  if(isReading||tool!=="rect") return;
  const p=canvas.getPointer(e.e,true);
  drawing=true; start=p;
  rect=new fabric.Rect({
    left:p.x,top:p.y,width:1,height:1,
    fill:"rgba(0,140,255,.15)",
    stroke:"#0af",strokeWidth:2
  });
  canvas.add(rect);
});
canvas.on("mouse:move",e=>{
  if(!drawing||!rect) return;
  const p=canvas.getPointer(e.e,true);
  rect.set({
    left:Math.min(p.x,start.x),
    top:Math.min(p.y,start.y),
    width:Math.abs(p.x-start.x),
    height:Math.abs(p.y-start.y)
  });
  canvas.requestRenderAll();
});
canvas.on("mouse:up",()=>{
  if(!drawing) return;
  drawing=false;
  canvas.setActiveObject(rect);
  rect=null;
});

/* ================= PAN ================= */
let pan=false,last={x:0,y:0};
canvas.on("mouse:down",e=>{
  if(tool!=="hand") return;
  pan=true; last={x:e.e.clientX,y:e.e.clientY};
});
canvas.on("mouse:move",e=>{
  if(!pan) return;
  const v=canvas.viewportTransform;
  v[4]+=e.e.clientX-last.x;
  v[5]+=e.e.clientY-last.y;
  last={x:e.e.clientX,y:e.e.clientY};
  canvas.setViewportTransform(v);
});
canvas.on("mouse:up",()=>pan=false);

/* ================= BUTTONS ================= */
btnSelect.onclick=()=>setTool("select");
btnRect.onclick  =()=>setTool("rect");
btnHand.onclick  =()=>setTool("hand");

$("btnFit").onclick=()=>{
  canvas.setViewportTransform([1,0,0,1,0,0]);
  applyZoom(100);
  fitImage();
};

$("zoomRange").oninput=e=>applyZoom(e.target.value);

$("btnFs").onclick=()=>{
  if(!document.fullscreenElement)document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

document.addEventListener("fullscreenchange",()=>{
  document.body.classList.toggle("fs-mode",!!document.fullscreenElement);
  setTimeout(resize,100);
});

/* ================= MODE ================= */
$("btnMode").onclick=()=>{
  if(isReading){
    if(prompt("Mot de passe")!==EDIT_PW) return;
    isReading=false;
    $("modeLabel").textContent="Éditeur";
  }else{
    isReading=true;
    $("modeLabel").textContent="Lecture";
  }
};

/* ================= INIT ================= */
window.addEventListener("resize",resize);
loadJSON();
setTool("select");
</script>

</body>
</html>
