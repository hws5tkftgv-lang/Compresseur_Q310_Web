<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Exploration interactive</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0c132e;
  color:#eaf1ff;
  font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
}

/* ===== TOP BAR ===== */
.topbar{
  display:flex;
  gap:8px;
  align-items:center;
  padding:10px;
  background:#0f1a3f;
}
.btn{
  padding:7px 11px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.15);
  background:#1b2553;
  color:#fff;
  cursor:pointer;
}
.btn.active{background:#0078ff}
select,input[type=range]{
  background:#101a40;
  color:#fff;
  border:1px solid rgba(255,255,255,.15);
  border-radius:6px;
  padding:6px;
}

/* ===== LAYOUT ===== */
.wrap{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:10px;
  padding:10px;
}
.stage{
  background:#0b1536;
  border-radius:10px;
  overflow:hidden;
}
canvas{display:block}
.panel{
  background:#0f1a44;
  border-radius:10px;
  padding:10px;
}
.panel h3{margin:4px 0}
.panel textarea{
  width:100%;
  height:160px;
  background:#101a40;
  color:#fff;
  border-radius:6px;
  border:1px solid rgba(255,255,255,.15);
}

/* ===== FULLSCREEN ===== */
body.fs .topbar{position:fixed;top:0;left:0;right:0;z-index:20}
body.fs .wrap{
  position:fixed;
  inset:50px 0 0 0;
  padding:6px;
}
</style>
</head>

<body>

<div class="topbar">
  <button id="btnRead" class="btn active">Lecture</button>
  <button id="btnEdit" class="btn">Éditeur</button>

  <button id="toolHand" class="btn">🖐</button>
  <button id="toolDraw" class="btn active">✏️</button>
  <button id="toolDelete" class="btn">🗑</button>

  <label>Zoom</label>
  <input id="zoomRange" type="range" min="50" max="250" value="100">

  <select id="imageSelect"></select>

  <button id="btnFS" class="btn">⛶</button>
</div>

<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
  </div>

  <div class="panel">
    <h3>Fiche de la pièce</h3>
    <select id="partSelect"></select>
    <textarea id="desc" readonly></textarea>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const IMAGES = [
  {label:"Vue générale", url:"actif/compresseur_bg.png"}
];
const PARTS_URL = "quincy_310L_parts.json";

/* ================= CANVAS ================= */
const canvas = new fabric.Canvas("c",{selection:false});
let bgImg=null;
let mode="read";
let tool="draw";
let zoom=1;
let drawing=false,start={},rect=null;
let parts=[];

/* ================= UI ================= */
const qs=id=>document.getElementById(id);
function setActive(btn){btn.classList.add("active")}
function clearActive(...btns){btns.forEach(b=>b.classList.remove("active"))}

/* ================= LOAD PARTS ================= */
fetch(PARTS_URL).then(r=>r.json()).then(data=>{
  parts=data;
  qs("partSelect").innerHTML='<option value="">— choisir —</option>'+
    parts.map(p=>`<option value="${p.id}">${p.nom}</option>`).join("");
});

/* ================= BACKGROUND ================= */
function loadImage(url){
  fabric.Image.fromURL(url,img=>{
    canvas.clear();
    bgImg=img;
    bgImg.selectable=false;
    canvas.add(bgImg);
    fit();
  });
}

/* ================= FIT + ZOOM ================= */
function fit(){
  const w=canvas.getWidth(),h=canvas.getHeight();
  const s=Math.min(w/bgImg.width,h/bgImg.height);
  bgImg.scale(s);
  bgImg.left=(w-bgImg.width*s)/2;
  bgImg.top=(h-bgImg.height*s)/2;
  canvas.setViewportTransform([1,0,0,1,0,0]);
  zoom=1;
  canvas.requestRenderAll();
}
function applyZoom(z){
  zoom=z;
  canvas.zoomToPoint(
    new fabric.Point(canvas.getWidth()/2,canvas.getHeight()/2),
    zoom
  );
}

/* ================= DRAW ================= */
canvas.on("mouse:down",o=>{
  if(mode!=="edit"||tool!=="draw")return;
  drawing=true;
  start=canvas.getPointer(o.e);
  rect=new fabric.Rect({
    left:start.x,top:start.y,width:1,height:1,
    fill:"rgba(0,140,255,.15)",
    stroke:"#0af",strokeWidth:2
  });
  canvas.add(rect);
});
canvas.on("mouse:move",o=>{
  if(!drawing||!rect)return;
  const p=canvas.getPointer(o.e);
  rect.set({
    left:Math.min(p.x,start.x),
    top:Math.min(p.y,start.y),
    width:Math.abs(p.x-start.x),
    height:Math.abs(p.y-start.y)
  });
  canvas.requestRenderAll();
});
canvas.on("mouse:up",()=>{
  if(!drawing)return;
  drawing=false;
  canvas.setActiveObject(rect);
  qs("partSelect").focus();
});

/* ================= SELECT ================= */
canvas.on("mouse:down",o=>{
  if(!o.target||o.target===bgImg)return;
  canvas.setActiveObject(o.target);
  const pid=o.target.partId;
  const p=parts.find(x=>x.id===pid);
  qs("partSelect").value=pid||"";
  qs("desc").value=p?`${p.nom}\n${p.role}\n\n${p.description}`:"";
});

/* ================= ASSOC PART ================= */
qs("partSelect").onchange=e=>{
  const r=canvas.getActiveObject();
  if(!r)return;
  r.partId=e.target.value;
  const p=parts.find(x=>x.id===r.partId);
  qs("desc").value=`${p.nom}\n${p.role}\n\n${p.description}`;
};

/* ================= TOOLS ================= */
qs("toolHand").onclick=()=>{
  tool="hand";
  clearActive(qs("toolDraw"));
  setActive(qs("toolHand"));
};
qs("toolDraw").onclick=()=>{
  tool="draw";
  clearActive(qs("toolHand"));
  setActive(qs("toolDraw"));
};
qs("toolDelete").onclick=()=>{
  const r=canvas.getActiveObject();
  if(r&&r!==bgImg)canvas.remove(r);
};

/* ================= MODE ================= */
qs("btnRead").onclick=()=>{
  mode="read";
  clearActive(qs("btnEdit"));
  setActive(qs("btnRead"));
  canvas.getObjects().forEach(o=>{
    if(o!==bgImg)o.visible=false;
  });
  canvas.requestRenderAll();
};
qs("btnEdit").onclick=()=>{
  mode="edit";
  clearActive(qs("btnRead"));
  setActive(qs("btnEdit"));
  canvas.getObjects().forEach(o=>{
    if(o!==bgImg)o.visible=true;
  });
  canvas.requestRenderAll();
};

/* ================= ZOOM ================= */
qs("zoomRange").oninput=e=>{
  applyZoom(e.target.value/100);
};

/* ================= FULLSCREEN ================= */
qs("btnFS").onclick=()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
    document.body.classList.add("fs");
  }else{
    document.exitFullscreen();
    document.body.classList.remove("fs");
  }
};

/* ================= INIT ================= */
function resize(){
  canvas.setWidth(qs("c").parentElement.clientWidth);
  canvas.setHeight(qs("c").parentElement.clientHeight);
  if(bgImg)fit();
}
window.onresize=resize;

IMAGES.forEach(i=>{
  const o=document.createElement("option");
  o.value=i.url;o.textContent=i.label;
  qs("imageSelect").appendChild(o);
});
qs("imageSelect").onchange=e=>loadImage(e.target.value);

resize();
loadImage(IMAGES[0].url);
</script>

</body>
</html>
