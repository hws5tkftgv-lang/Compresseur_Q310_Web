<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quincy 310L — Lecture / Éditeur</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html,body { margin:0; background:#0c132e; color:#eaf1ff; font-family:system-ui,Arial; }

.topbar{
  display:flex; align-items:center; gap:8px;
  padding:10px 12px; background:#0f1a3f;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.btn{padding:7px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#1b2553;color:#fff;cursor:pointer}
.btn.primary{background:#0078ff}
.toolbar{display:flex;gap:6px;padding:10px 12px;background:#0f1a3f}
.toolbar.hidden{display:none}

.wrap{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px}
.stage{
  background:#0b1536;border:1px solid rgba(255,255,255,.1);
  border-radius:12px; position:relative; overflow:hidden;
}
canvas{touch-action:none}

.panel{
  background:#0f1a44;border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:12px
}
.panel h3{margin:0 0 10px}

.row{margin-bottom:10px}
input,textarea{
  width:100%; padding:8px; border-radius:6px;
  border:1px solid rgba(255,255,255,.2);
  background:#0b1638; color:#fff
}
textarea{min-height:140px}

/* ===== PLEIN ÉCRAN TYPE YOUTUBE ===== */
body.fs-mode{overflow:hidden;background:#020618}
body.fs-mode .topbar,
body.fs-mode .toolbar{display:none}

body.fs-mode .wrap{
  position:fixed; inset:0; padding:0; margin:0;
  grid-template-columns:75% 25%;
}

body.fs-mode .stage,
body.fs-mode .panel{
  border-radius:0; height:100vh;
}

/* bouton plein écran */
.fs-btn{
  position:absolute; right:12px; bottom:12px;
  padding:6px 10px; border-radius:999px;
  background:rgba(10,15,40,.85);
  border:1px solid rgba(255,255,255,.4);
  color:#fff; cursor:pointer; z-index:10;
}
</style>
</head>

<body>

<div class="topbar">
  <span>Mode : <b id="modeLabel">Lecture</b></span>
  <button id="toggleMode" class="btn">Passer en Éditeur</button>
</div>

<div id="editorToolbar" class="toolbar hidden">
  <button id="btn-draw" class="btn primary">Dessiner</button>
  <button id="btn-delete" class="btn">Supprimer</button>
</div>

<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
    <button id="btnFsToggle" class="fs-btn">⤢ Plein écran</button>
  </div>

  <aside class="panel">
    <h3>📘 Fiche</h3>
    <div class="row">
      <label>Nom</label>
      <input id="partName">
    </div>
    <div class="row">
      <label>Description</label>
      <textarea id="partDesc"></textarea>
    </div>
  </aside>
</div>

<script>
/* ================= CONFIG ================= */
const IMAGE_URL = "actif/compresseur_bg.png";
let isReading = true;

/* ================= CANVAS ================= */
const canvas = new fabric.Canvas("c",{selection:false});
let bgImg=null;

function resizeCanvas(){
  const stage=document.querySelector(".stage");
  canvas.setWidth(stage.clientWidth);
  canvas.setHeight(stage.clientHeight);
  if(bgImg) fitImage();
}
window.addEventListener("resize",resizeCanvas);

function fitImage(){
  const cw=canvas.getWidth(), ch=canvas.getHeight();
  const s=Math.min(cw/bgImg.width, ch/bgImg.height);
  bgImg.scale(s);
  bgImg.set({
    left:(cw-bgImg.width*s)/2,
    top:(ch-bgImg.height*s)/2,
    selectable:false, evented:false
  });
  canvas.sendToBack(bgImg);
  canvas.requestRenderAll();
}

fabric.Image.fromURL(IMAGE_URL,img=>{
  bgImg=img;
  bgImg.objectCaching=false;
  canvas.add(bgImg);
  resizeCanvas();
},{crossOrigin:"anonymous"});

/* ================= MODES ================= */
function applyLecture(on){
  isReading=on;
  document.getElementById("modeLabel").textContent=on?"Lecture":"Éditeur";
  document.getElementById("editorToolbar").classList.toggle("hidden",on);

  document.getElementById("partName").readOnly=on;
  document.getElementById("partDesc").readOnly=on;
}

document.getElementById("toggleMode").onclick=()=>{
  if(isReading){
    const pw=prompt("Mot de passe :");
    if(pw!=="PROF") return;
    applyLecture(false);
  }else{
    applyLecture(true);
  }
};

/* ================= DESSIN ================= */
let drawing=false,start=null,rect=null;

document.getElementById("btn-draw").onclick=()=>{};

canvas.on("mouse:down",opt=>{
  if(isReading) return;
  start=canvas.getPointer(opt.e);
  rect=new fabric.Rect({
    left:start.x, top:start.y, width:1, height:1,
    fill:"rgba(0,150,255,.2)", stroke:"#00a0ff", strokeWidth:2
  });
  canvas.add(rect);
  drawing=true;
});
canvas.on("mouse:move",opt=>{
  if(!drawing) return;
  const p=canvas.getPointer(opt.e);
  rect.set({
    left:Math.min(p.x,start.x),
    top:Math.min(p.y,start.y),
    width:Math.abs(p.x-start.x),
    height:Math.abs(p.y-start.y)
  });
  canvas.requestRenderAll();
});
canvas.on("mouse:up",()=>{drawing=false});

/* ================= PLEIN ÉCRAN ================= */
document.getElementById("btnFsToggle").onclick=e=>{
  e.preventDefault();
  document.body.classList.toggle("fs-mode");
  setTimeout(resizeCanvas,60);
};

/* ================= INIT ================= */
applyLecture(true);
</script>

</body>
</html>
