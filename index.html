<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Quincy 310L — Éditeur/Lecture (FULL-DEBUG)</title>

  <!-- Affiche toute erreur JS à l’écran -->
  <script>
  (function(){
    const box=document.createElement('div');
    box.id='errbox';
    box.style.cssText='position:fixed;left:12px;right:12px;top:12px;z-index:99999;background:#7a1e1e;color:#fff;padding:8px 10px;border-radius:8px;display:none;font:14px/1.4 system-ui,Segoe UI,Roboto,Arial';
    document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(box));
    function show(msg){ box.innerHTML='❌ '+msg; box.style.display='block'; }
    window.__ERR = { show };
    window.addEventListener('error',e=>show((e && e.message)||'Erreur'));
    window.addEventListener('unhandledrejection',e=>show('Promise rejetée: '+(e.reason && (e.reason.message||e.reason))));
  })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

  <style>
    :root{ color-scheme:dark }
    *{ box-sizing:border-box }
    html,body{ margin:0; height:100%; overscroll-behavior:none }
    body{ background:#0c132e; color:#eaf1ff; font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif }
    .topbar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#0f1a3f;border-bottom:1px solid rgba(255,255,255,.08)}
    .mode-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;background:#1b2553;border:1px solid rgba(255,255,255,.14);border-radius:999px}
    .mode-pill b{color:#91c9ff}
    .btn{padding:7px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:#1b2553;color:#eaf1ff;cursor:pointer}
    .btn.active{background:#0078ff;font-weight:700;border-color:#0053ad;box-shadow:0 0 8px rgba(0,120,255,.45)}
    .chip{padding:6px 8px;background:#192247;border:1px solid rgba(255,255,255,.12);border-radius:8px}
    .toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;background:#0f1a3f}
    .toolbar.hidden{display:none}
    .wrap{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px}
    @media(max-width:1000px){.wrap{grid-template-columns:1fr}}
    .stage{background:#0b1536;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;min-height:65vh}
    canvas{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .panel{padding:12px;background:#0f1a44;border:1px solid rgba(255,255,255,.10);border-radius:12px}
    .panel h3{margin:6px 0 10px}
    .row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
    select,input,textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:#0b1638;color:#eaf1ff}
    textarea{min-height:120px;resize:vertical}
    .hint{font-size:.85rem;opacity:.8}
    .hidden{display:none!important}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999}
    .modal{width:min(520px,92vw);background:#111a43;color:#eaf1ff;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:16px}
    .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#0f8a2a;color:#fff;padding:9px 12px;border-radius:10px;display:none;box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:10000}
    .editable{border-color:#4aa3ff!important;box-shadow:0 0 0 2px rgba(74,163,255,.25) inset}
    .badge{font-size:.85rem;opacity:.85;margin-left:8px}
  </style>
</head>
<body>
  <div class="topbar">
    <span class="mode-pill">Mode : <b id="modeLabel">Lecture</b></span>
    <button id="toggleMode" class="btn">Passer en Éditeur</button>

    <label class="chip" style="margin-left:8px">Image
      <select id="bgSelect" style="margin-left:6px">
        <option value="compresseur_bg.png">compresseur_bg.png</option>
        <option value="TETE.jpeg">TETE.jpeg</option>
        <option value="TETE_2.jpeg">TETE_2.jpeg</option>
        <option value="VUE_GENERAL.jpeg">VUE_GENERAL.jpeg</option>
        <option value="VUE_GENARAL_2.jpeg">VUE_GENARAL_2.jpeg</option>
        <option value="VERS_RESERVOIR.jpeg">VERS_RESERVOIR.jpeg</option>
        <option value="VERS_RESERVOIR_2.jpeg">VERS_RESERVOIR_2.jpeg</option>
        <option value="VUE_POMPE.jpeg">VUE_POMPE.jpeg</option>
        <option value="LOAD_SIDE.jpeg">LOAD_SIDE.jpeg</option>
        <option value="SOUPAPE_UNLOADER.jpeg">SOUPAPE_UNLOADER.jpeg</option>
        <option value="POULIE.jpeg">POULIE.jpeg</option>
        <option value="FILTRE_AIR_COUVERCLE.jpeg">FILTRE_AIR_COUVERCLE.jpeg</option>
        <option value="TOP.jpeg">TOP.jpeg</option>
      </select>
    </label>

    <span class="badge" id="status">Chargement UI…</span>

    <span style="flex:1;"></span>
    <span class="chip">Zoom <input type="range" id="zoom" min="25" max="300" step="1" value="100" style="vertical-align:middle;margin-left:6px"></span>
    <span id="toggle-fit" class="btn chip">Affichage : <strong>—</strong></span>
    <button id="btn-fit" class="btn">🖼️ Ajuster</button>
  </div>

  <div id="editorToolbar" class="toolbar hidden">
    <button id="btn-move" class="btn">🧿 Déplacer / Redim.</button>
    <button id="btn-draw" class="btn">✏️ Dessiner</button>
    <button id="btn-pan"  class="btn">✋ Pan</button>
    <button id="btn-select" class="btn">🖱️ Sélection</button>
    <button id="btn-delete" class="btn">❌ Supprimer</button>
    <button id="btn-clear"  class="btn">🗑️ Effacer tout</button>
  </div>

  <div class="wrap">
    <div class="stage"><canvas id="c"></canvas></div>
    <aside class="panel">
      <h3>📘 Fiche de la zone</h3>
      <p class="hint">Lecture : zones <b>invisibles</b> mais cliquables (flash). Éditeur : dessin / redim / déplacement + édition.</p>
      <div class="row"><label>Pièce</label><select id="inventorySelect" disabled></select></div>
      <div class="row"><label>Nom</label><input id="partName" readonly></div>
      <div class="row"><label>Rôle</label><input id="partRole" readonly></div>
      <div class="row"><label>Description</label><textarea id="partDesc" readonly></textarea></div>
      <div class="row" id="editorActions" style="display:flex;gap:8px">
        <button id="btn-apply" class="btn" style="flex:1">✅ Appliquer à la zone</button>
        <button id="btn-show-all" class="btn" style="flex:1">👁️ Afficher tout</button>
      </div>
      <p class="hint">💾 Sauvegarde locale automatique par image.</p>
    </aside>
  </div>

  <!-- Modals minimaux pour éviter erreurs -->
  <div id="assignModal" class="modal-backdrop"><div class="modal">
    <h4>Associer cette zone à une pièce</h4>
    <div class="row"><label>Pièce</label><select id="assignSelect"></select></div>
    <div class="actions"><button id="assignCancel" class="btn">Annuler</button><button id="assignOk" class="btn">Associer</button></div>
  </div></div>

  <div id="toast" class="toast">OK</div>

  <script>
  // ----------- Étape 0 : garde-fou Fabric -----------
  (function(){
    if(!window.fabric){ __ERR.show('Fabric.js n’a pas été chargé (CDN bloqué?)'); }
  })();

  // ----------- Étape 1 : variables sûres -----------
  const IS_MOBILE=/iPhone|iPad|Android/i.test(navigator.userAgent);
  const statusEl=document.getElementById('status');
  const setStatus=(t)=>statusEl.textContent=t;

  const BG_DIR='./actif/';
  let currentFile=localStorage.getItem('q310_bg_file')||'compresseur_bg.png';

  const COULEURS={
    LP:{fill:'rgba(0,160,255,.18)',stroke:'#00a0ff'},
    HP:{fill:'rgba(255,60,60,.18)',stroke:'#ff3c3c'},
    LUB:{fill:'rgba(255,150,0,.18)',stroke:'#ff9500'},
    CTRL:{fill:'rgba(160,100,255,.18)',stroke:'#a060ff'},
    TR:{fill:'rgba(60,220,100,.18)',stroke:'#3cdc64'},
    DEF:{fill:'rgba(200,200,200,.12)',stroke:'#aaa'}
  };

  // ----------- Étape 2 : références DOM (toujours OK même si suite échoue) -----------
  const modeLabel=document.getElementById('modeLabel');
  const toggleMode=document.getElementById('toggleMode');
  const bgSelect=document.getElementById('bgSelect');
  const zoomSlider=document.getElementById('zoom');
  const toggleFit=document.getElementById('toggle-fit');
  const btnFit=document.getElementById('btn-fit');
  const editorToolbar=document.getElementById('editorToolbar');
  const invSelect=document.getElementById('inventorySelect');
  const partName=document.getElementById('partName');
  const partRole=document.getElementById('partRole');
  const partDesc=document.getElementById('partDesc');
  const toastEl=document.getElementById('toast');

  // Attache IMMÉDIATE de tous les écouteurs UI (même si l’image foire)
  toggleMode.onclick = ()=>{
    if(isReading){
      const pwd=prompt('Mot de passe :'); if(pwd!=='PROF'){ alert('Mot de passe invalide'); return; }
    }
    applyLectureUI(!isReading);
  };
  bgSelect.onchange = ()=>{ setBackground(bgSelect.value); };
  btnFit.onclick = ()=>{ adjustToFit(); };
  toggleFit.onclick = ()=>{ FIT_MODE=(FIT_MODE==='contain')?'cover':'contain'; fitLabel(); adjustToFit(); };
  zoomSlider.oninput = (e)=>{ const z=Math.max(.25,Math.min(3,Number(e.target.value)/100)); zoomTo(z); };

  // Boutons éditeur
  document.getElementById('btn-move').onclick=()=>setMode('move');
  document.getElementById('btn-draw').onclick=()=>setMode('draw');
  document.getElementById('btn-pan').onclick =()=>setMode('pan');
  document.getElementById('btn-select').onclick=()=>setMode('select');
  document.getElementById('btn-delete').onclick=()=>{ if(isReading) return; const o=canvas.getActiveObject(); if(o) { canvas.remove(o); saveZones(); } };
  document.getElementById('btn-clear').onclick =()=>{ if(isReading) return; if(confirm('Effacer toutes les zones ?')){ canvas.getObjects().forEach(o=>canvas.remove(o)); saveZones(); } };

  // ----------- Étape 3 : Canvas + fond -----------
  const canvas=new fabric.Canvas('c',{selection:false,preserveObjectStacking:true,backgroundColor:'#0b1536'});
  let bgImg=null, FIT_MODE=IS_MOBILE?'cover':'contain';
  function fitLabel(){ toggleFit.innerHTML=`Affichage : <strong>${FIT_MODE==='contain'?'Tout voir':'Remplir'}</strong>`; }
  function resize(){ const stage=document.querySelector('.stage'); const w=stage.clientWidth; const h=Math.max(600, IS_MOBILE?window.innerHeight*0.85:window.innerHeight*0.70); canvas.setWidth(w); canvas.setHeight(h); setBgScale(); canvas.requestRenderAll(); }
  window.addEventListener('resize',resize,{passive:true});

  function setBgScale(){ if(!bgImg) return; const cw=canvas.getWidth(), ch=canvas.getHeight(), iw=bgImg.width, ih=bgImg.height; const s=(FIT_MODE==='contain')?Math.min(cw/iw,ch/ih):Math.max(cw/iw,ch/ih); const left=(cw-iw*s)/2, top=(ch-ih*s)/2; bgImg.scale(s); bgImg.set({left,top}); canvas.backgroundImage=bgImg; }
  function loadFabricImage(src){
    return new Promise((resolve,reject)=>{
      const im=new Image(); im.onload=()=>resolve(im); im.onerror=()=>reject(new Error('Introuvable: '+src)); im.src=src+(src.startsWith('blob:')?'':('?t='+Date.now()));
    }).then(img=>new fabric.Image(img,{originX:'left',originY:'top'}));
  }
  async function setBackground(file){
    try{
      setStatus('Chargement image…');
      const fimg = await loadFabricImage(BG_DIR+file);
      bgImg=fimg; canvas.setBackgroundImage(fimg,()=>{ setBgScale(); canvas.requestRenderAll(); });
      currentFile=file; localStorage.setItem('q310_bg_file', currentFile);
      setStatus('Prêt ✅');
      loadZones(); ensureSample(); adjustToFit();
    }catch(e){
      __ERR.show(e.message+' (/actif/'+file+')');
      setStatus('Erreur image');
      // on garde l’UI fonctionnelle : pas de throw
    }
  }

  function adjustToFit(){ setBgScale(); canvas.setViewportTransform([1,0,0,1,0,0]); zoomSlider.value=100; canvas.requestRenderAll(); saveZones(); }
  function zoomTo(z){ const c=new fabric.Point(canvas.getWidth()/2, canvas.getHeight()/2); const prev=fabric.util.transformPoint(c, fabric.util.invertTransform(canvas.viewportTransform)); canvas.zoomToPoint(c,z); const now=fabric.util.transformPoint(c, fabric.util.invertTransform(canvas.viewportTransform)); const d=new fabric.Point(now.x-prev.x,now.y-prev.y); canvas.relativePan(d.multiplyScalar(-1)); canvas.requestRenderAll(); }

  // ----------- Étape 4 : Zones & modes -----------
  function k(){ return 'q310_z_'+currentFile; }
  function norm(o){ const r=o.getBoundingRect(true,true); return {id:o.pieceId||'',x:r.left,y:r.top,w:r.width,h:r.height}; }
  function fromNorm(z){ const col=COULEURS.DEF; const r=new fabric.Rect({left:z.x,top:z.y,width:z.w,height:z.h,fill:col.fill,stroke:col.stroke,strokeWidth:2,rx:6,ry:6}); r.pieceId=z.id||''; canvas.add(r); if(isReading) hide(r); return r; }
  function saveZones(){ try{ const zones=canvas.getObjects().map(norm); localStorage.setItem(k(), JSON.stringify({fit:FIT_MODE,zones})); }catch(e){ /* no-op */ } }
  function loadZones(){ canvas.getObjects().forEach(o=>canvas.remove(o)); try{ const raw=localStorage.getItem(k()); if(!raw) return; const d=JSON.parse(raw); FIT_MODE=d.fit||FIT_MODE; (d.zones||[]).forEach(fromNorm); fitLabel(); }catch(e){} }
  function ensureSample(){ if(canvas.getObjects().length===0){ const r=fromNorm({id:'sample',x:40,y:40,w:140,h:90}); if(isReading) hide(r); } }
  function toRGBA(fill,a){ const m=String(fill||'').match(/rgba?\\((\\d+),\\s*(\\d+),\\s*(\\d+)/i); if(m) return `rgba(${m[1]},${m[2]},${m[3]},${a})`; return `rgba(0,0,0,${a})`; }
  function hide(o){ if(!o.__s) o.__s={fill:o.fill,stroke:o.stroke,op:o.opacity,sw:o.strokeWidth}; o.opacity=1; o.fill=toRGBA(o.__s.fill,.01); o.stroke=toRGBA(o.__s.stroke,.01); o.strokeWidth=.5; o.hasBorders=false; o.hasControls=false; o.hoverCursor='pointer'; }
  function show(o){ const s=o.__s; if(s){ o.fill=s.fill;o.stroke=s.stroke;o.opacity=(typeof s.op==='number')?s.op:1;o.strokeWidth=(typeof s.sw==='number')?s.sw:2; } o.hasBorders=true;o.hasControls=true;o.hoverCursor='move'; }
  function flash(o){ const prev={fill:o.fill,stroke:o.stroke,sw:o.strokeWidth}; o.fill=toRGBA(prev.fill,.20); o.stroke=toRGBA(prev.stroke,.90); o.strokeWidth=2; canvas.requestRenderAll(); setTimeout(()=>{ hide(o); canvas.requestRenderAll(); },450); }

  let isReading=true, mode='move', drawing=null, start=null, pending=null;
  function setMode(m){ mode=m; document.querySelectorAll('#editorToolbar .btn').forEach(b=>b.classList.remove('active')); ({move:'btn-move',draw:'btn-draw',pan:'btn-pan',select:'btn-select'}[m] && document.getElementById({move:'btn-move',draw:'btn-draw',pan:'btn-pan',select:'btn-select'}[m]).classList.add('active')); canvas.selection=(!isReading && m==='move'); canvas.requestRenderAll(); }
  function setEditable(on){ partRole.readOnly=!on; partDesc.readOnly=!on; partRole.classList.toggle('editable',on); partDesc.classList.toggle('editable',on); }
  function applyLectureUI(on){ isReading=!!on; modeLabel.textContent=on?'Lecture':'Éditeur'; toggleMode.textContent=on?'Passer en Éditeur':'Passer en Lecture'; editorToolbar.classList.toggle('hidden',on); invSelect.disabled=on; document.getElementById('editorActions').classList.toggle('hidden',on); setEditable(!on); setMode(on?'select':'move'); setVis(on); }
  function setVis(invis){ canvas.getObjects().forEach(o=>{ invis?hide(o):show(o); }); canvas.requestRenderAll(); }

  // pan/zoom souris
  canvas.on('mouse:wheel',(opt)=>{ const delta=-opt.e.deltaY, cur=canvas.getZoom(), next=Math.max(.25,Math.min(3,cur*(1+delta/1000))); zoomSlider.value=Math.round(next*100); zoomTo(next); opt.e.preventDefault(); opt.e.stopPropagation(); });
  canvas.on('mouse:down',(opt)=>{ if(isReading){ const t=opt.target; if(!t){ canvas.isDragging=true; canvas.lastX=opt.e.clientX; canvas.lastY=opt.e.clientY; canvas.setCursor('grabbing'); return; } }
    if(mode==='pan'){ canvas.isDragging=true; canvas.lastX=opt.e.clientX; canvas.lastY=opt.e.clientY; canvas.setCursor('grabbing'); return; }
    if(mode!=='draw'||isReading) return;
    const p=canvas.getPointer(opt.e); start=p; drawing=new fabric.Rect({left:p.x,top:p.y,width:1,height:1,fill:'rgba(255,255,255,.10)',stroke:'#0ff',strokeWidth:2,rx:6,ry:6,selectable:false,evented:true}); canvas.add(drawing);
  });
  canvas.on('mouse:move',(opt)=>{ if(canvas.isDragging){ const dx=opt.e.clientX-canvas.lastX, dy=opt.e.clientY-canvas.lastY; canvas.relativePan(new fabric.Point(dx,dy)); canvas.lastX=opt.e.clientX; canvas.lastY=opt.e.clientY; return; }
    if(mode!=='draw'||!drawing||!start||isReading) return; const p=canvas.getPointer(opt.e); drawing.set({left:Math.min(p.x,start.x),top:Math.min(p.y,start.y),width:Math.abs(p.x-start.x),height:Math.abs(p.y-start.y)}); canvas.requestRenderAll(); });
  canvas.on('mouse:up',(e)=>{ if(canvas.isDragging){ canvas.isDragging=false; canvas.setCursor('default'); return; }
    if(mode==='select' || (!isReading && mode==='move')){ const t=e.target; if(t){ if(isReading) flash(t); } return; }
    if(mode!=='draw'||!drawing||isReading) return; drawing.selectable=true; pending=drawing; canvas.setActiveObject(pending); drawing=null; start=null; openAssign(); });

  // touch iOS : pinch/pan
  const upper=canvas.upperCanvasEl;
  upper.addEventListener('gesturestart',e=>e.preventDefault()); upper.addEventListener('gesturechange',e=>e.preventDefault()); upper.addEventListener('gestureend',e=>e.preventDefault());
  let pinch=0;
  upper.addEventListener('touchstart',e=>{ if(e.touches.length===2){ pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); canvas.isDragging=false; e.preventDefault(); } else if(e.touches.length===1){ const tgt=canvas.findTarget({clientX:e.touches[0].clientX,clientY:e.touches[0].clientY,target:upper},false); if(!tgt && (isReading||mode==='pan')){ canvas.isDragging=true; canvas.lastX=e.touches[0].clientX; canvas.lastY=e.touches[0].clientY; e.preventDefault(); } }, {passive:false});
  upper.addEventListener('touchmove',e=>{ if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); if(pinch===0){ pinch=d; return; } const factor=d/pinch; pinch=d; let z=canvas.getZoom()*factor; z=Math.max(.25,Math.min(3,z)); const rect=upper.getBoundingClientRect(); const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-rect.left; const my=(e.touches[0].clientY+e.touches[1].clientY)/2-rect.top; canvas.zoomToPoint(new fabric.Point(mx,my),z); zoomSlider.value=Math.round(z*100); setBgScale(); canvas.requestRenderAll(); e.preventDefault(); } else if(e.touches.length===1 && canvas.isDragging){ const dx=e.touches[0].clientX-canvas.lastX, dy=e.touches[0].clientY-canvas.lastY; canvas.relativePan(new fabric.Point(dx,dy)); canvas.lastX=e.touches[0].clientX; canvas.lastY=e.touches[0].clientY; setBgScale(); canvas.requestRenderAll(); e.preventDefault(); } }, {passive:false});
  upper.addEventListener('touchend',()=>{ if(event.touches && event.touches.length===0) canvas.isDragging=false; if(!event.touches || event.touches.length<2) pinch=0; }, {passive:false});

  // ----------- Étape 5 : Assignation minimale -----------
  const assignModal=document.getElementById('assignModal');
  const assignSelect=document.getElementById('assignSelect');
  document.getElementById('assignCancel').onclick=()=>{ assignModal.style.display='none'; pending=null; };
  document.getElementById('assignOk').onclick=()=>{ if(!pending) return; pending.pieceId=assignSelect.value||''; if(isReading) hide(pending); canvas.requestRenderAll(); saveZones(); assignModal.style.display='none'; pending=null; };
  function openAssign(){ assignSelect.innerHTML='<option value="">—(aucune)—</option><option value="filtre_air">filtre_air</option><option value="cylindre_lp">cylindre_lp</option>'; assignModal.style.display='flex'; }

  // ----------- Étape 6 : Init sûre -----------
  (async function init(){
    try{
      setStatus('Initialisation…'); fitLabel(); resize();
      // charge l’option sélectionnée si elle existe, sinon force compresseur_bg.png
      const opt = Array.from(bgSelect.options).some(o=>o.value===currentFile) ? currentFile : 'compresseur_bg.png';
      bgSelect.value = opt;
      await setBackground(opt);           // si ça échoue, UI reste active grâce au catch interne
      applyLectureUI(true);               // démarre en lecture
      setStatus('Prêt ✅');
    }catch(e){
      __ERR.show(e.message||e); setStatus('Erreur init');
    }
  })();

  // ----------- Utilitaires -----------
  let toastTimer=null;
  function toast(msg){ toastEl.textContent=msg||'OK'; toastEl.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.style.display='none',1400); }
  </script>
</body>
</html>
