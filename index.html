<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L – Zones pédagogiques</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#0c132e;
  color:#eaf1ff;
  font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
}

/* ===== BARRE HAUTE ===== */
.topbar{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:#0f1a3f;
}

.btn{
  padding:6px 12px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.15);
  background:#1b2553;
  color:#eaf1ff;
  cursor:pointer;
}
.btn.active{background:#0078ff}

.select{
  background:#101a40;
  color:#eaf1ff;
  border:1px solid rgba(255,255,255,.15);
  border-radius:6px;
  padding:6px;
}

/* ===== LAYOUT ===== */
.wrap{
  display:grid;
  grid-template-columns:1fr 320px;
  gap:12px;
  padding:12px;
}
.stage{
  background:#0b1536;
  border-radius:12px;
  overflow:hidden;
  min-height:80vh;
}
.panel{
  background:#0f1a44;
  border-radius:12px;
  padding:12px;
}

/* ===== FULLSCREEN ===== */
body.fs .wrap{
  position:fixed;
  inset:0;
  padding:8px;
}
canvas{display:block}
</style>
</head>

<body>

<div class="topbar">
  <b id="modeLabel">Mode : Lecture</b>
  <button id="btnMode" class="btn">Éditeur</button>

  <select id="imgSelect" class="select"></select>

  <button id="btnSelect" class="btn active">🖱 Sélection</button>
  <button id="btnDraw" class="btn">✏️ Crayon</button>
  <button id="btnErase" class="btn">🧽 Effacer</button>
</div>

<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
  </div>

  <aside class="panel">
    <h3>Zone</h3>
    <label>Pièce</label>
    <select id="pieceSelect" class="select"></select>
    <label>Description</label>
    <textarea id="desc" style="width:100%;height:120px"></textarea>
  </aside>
</div>

<script>
/* ================= CONFIG ================= */
const IMAGES=[
  {label:"Compresseur",url:"actif/compresseur_bg.png"},
  {label:"Vue moteur",url:"actif/vue_moteur.png"},
  {label:"Vue pompe",url:"actif/vue_pompe.png"}
];
const JSON_URL="quincy_310L_parts.json";

/* ================= CANVAS ================= */
const canvas=new fabric.Canvas("c");
let bg=null,isEditor=false,tool="select",currentImage=IMAGES[0].url;

/* ================= UTILS ================= */
const $=id=>document.getElementById(id);
const LS_KEY=url=>"zones_"+url;

/* ================= IMAGE ================= */
function loadImage(url){
  canvas.clear();
  fabric.Image.fromURL(url,img=>{
    bg=img;
    bg.selectable=false;
    canvas.add(bg);
    fit();
    loadZones();
  });
}
function fit(){
  canvas.setWidth(document.querySelector(".stage").clientWidth);
  canvas.setHeight(document.querySelector(".stage").clientHeight);
  const s=Math.min(canvas.width/bg.width,canvas.height/bg.height);
  bg.scale(s);
  bg.left=(canvas.width-bg.width*s)/2;
  bg.top =(canvas.height-bg.height*s)/2;
  canvas.sendToBack(bg);
}

/* ================= ZONES ================= */
function saveZones(){
  const z=canvas.getObjects().filter(o=>o!==bg).map(r=>({
    l:r.left,t:r.top,w:r.width,h:r.height,p:r.partId||""
  }));
  localStorage.setItem(LS_KEY(currentImage),JSON.stringify(z));
}
function loadZones(){
  const raw=localStorage.getItem(LS_KEY(currentImage));
  if(!raw)return;
  JSON.parse(raw).forEach(z=>{
    const r=new fabric.Rect({
      left:z.l,top:z.t,width:z.w,height:z.h,
      fill:"rgba(0,150,255,.2)",stroke:"#09f",strokeWidth:2
    });
    r.partId=z.p;
    canvas.add(r);
  });
  applyMode();
}

/* ================= MODES ================= */
function applyMode(){
  canvas.getObjects().forEach(o=>{
    if(o===bg)return;
    o.selectable=isEditor;
    o.evented=true;
    o.opacity=isEditor?1:0;
  });
  canvas.requestRenderAll();
}

$("btnMode").onclick=()=>{
  isEditor=!isEditor;
  $("modeLabel").textContent=isEditor?"Mode : Éditeur":"Mode : Lecture";
  applyMode();
};

/* ================= DRAW ================= */
let drawing=false,start={},rect=null;

canvas.on("mouse:down",e=>{
  if(!isEditor||tool!=="draw")return;
  const p=canvas.getPointer(e.e);
  drawing=true;start=p;
  rect=new fabric.Rect({
    left:p.x,top:p.y,width:1,height:1,
    fill:"rgba(0,150,255,.2)",stroke:"#09f",strokeWidth:2
  });
  canvas.add(rect);
});
canvas.on("mouse:move",e=>{
  if(!drawing)return;
  const p=canvas.getPointer(e.e);
  rect.set({
    left:Math.min(p.x,start.x),
    top:Math.min(p.y,start.y),
    width:Math.abs(p.x-start.x),
    height:Math.abs(p.y-start.y)
  });
  canvas.requestRenderAll();
});
canvas.on("mouse:up",()=>{
  if(!drawing)return;
  drawing=false;
  canvas.setActiveObject(rect);
  rect=null;
  saveZones();
});

/* ================= BUTTONS ================= */
$("btnSelect").onclick=()=>tool="select";
$("btnDraw").onclick=()=>tool="draw";
$("btnErase").onclick=()=>{
  const o=canvas.getActiveObject();
  if(o&&o!==bg){canvas.remove(o);saveZones();}
};

/* ================= IMAGES ================= */
IMAGES.forEach(i=>{
  const o=document.createElement("option");
  o.value=i.url;o.textContent=i.label;
  $("imgSelect").appendChild(o);
});
$("imgSelect").onchange=e=>{
  currentImage=e.target.value;
  loadImage(currentImage);
};

/* ================= INIT ================= */
fetch(JSON_URL).then(r=>r.json()).then(d=>{
  d.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id;o.textContent=p.id+" - "+p.name;
    $("pieceSelect").appendChild(o);
  });
});
loadImage(currentImage);
window.addEventListener("resize",fit);
</script>

</body>
</html>
