<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quincy 310L — Lecture / Éditeur</title>

<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:#0c132e;color:#eaf1ff;font-family:system-ui}

.topbar{
 display:flex;gap:10px;align-items:center;
 padding:10px;background:#0f1a3f;border-bottom:1px solid rgba(255,255,255,.1)
}
.btn{padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#1b2553;color:#fff;cursor:pointer}
.btn.primary{background:#0078ff}
.select,input,textarea{
 background:#101a40;color:#fff;border:1px solid rgba(255,255,255,.2);
 border-radius:8px;padding:6px 8px
}
.zoomwrap{display:flex;gap:6px;align-items:center}

.wrap{
 display:grid;grid-template-columns:1fr 360px;gap:10px;padding:10px
}
.stage{position:relative;background:#0b1536;border-radius:12px;overflow:hidden}
.panel{background:#0f1a44;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
canvas{display:block}

body.fs-mode{overflow:hidden}
body.fs-mode .wrap{
 position:fixed;inset:0;padding:8px;
 grid-template-columns:70% 30%
}
</style>
</head>

<body>

<div class="topbar">
 <b id="modeLabel">Lecture</b>
 <button id="toggleMode" class="btn">Éditeur</button>

 <div class="zoomwrap">
  Zoom
  <input id="zoomRange" type="range" min="25" max="250" value="100">
  <span id="zoomLabel">100%</span>
 </div>

 <button id="btnHand" class="btn">✋</button>
 <button id="btnRect" class="btn primary">▭ Zone</button>
 <button id="btnFit" class="btn">⤡</button>
 <button id="btnFs" class="btn">⤢</button>
</div>

<div class="wrap">
 <div class="stage">
  <canvas id="c"></canvas>
 </div>

 <aside class="panel">
  <b>Zone</b>
  <select id="pieceSelect" class="select"></select>
  <input id="fName" placeholder="Nom">
  <textarea id="fDesc" placeholder="Description"></textarea>
  <button id="btnApply" class="btn primary">Appliquer</button>
  <button id="btnDelete" class="btn">Supprimer</button>
 </aside>
</div>

<script>
/* CONFIG */
const EDIT_PW="PROF";
const IMAGE_URL="actif/compresseur_bg.png";
const PARTS_JSON="quincy_310L_parts.json";

/* CANVAS */
const canvas=new fabric.Canvas("c",{selection:false});
let bgImg=null,currentZoom=1,isReading=true;
const TOOL={HAND:0,RECT:1}; let tool=TOOL.RECT;

/* UI */
const zoomRange=zoomLabel.previousElementSibling;
const pieceSelect=document.getElementById("pieceSelect");

/* ZOOM */
function applyZoom(z,pt){
 currentZoom=Math.max(.25,Math.min(3,z));
 const p=pt||new fabric.Point(canvas.getWidth()/2,canvas.getHeight()/2);
 canvas.zoomToPoint(p,currentZoom);
 zoomRange.value=Math.round(currentZoom*100);
 zoomLabel.textContent=zoomRange.value+"%";
}
zoomRange.oninput=e=>applyZoom(e.target.value/100);

/* RESIZE */
function resize(){
 const s=document.querySelector(".stage");
 canvas.setWidth(s.clientWidth);
 canvas.setHeight(s.clientHeight);
 fitBg();
}
window.addEventListener("resize",resize);

/* BACKGROUND */
function fitBg(){
 if(!bgImg)return;
 const cw=canvas.getWidth(),ch=canvas.getHeight();
 const s=Math.min(cw/bgImg.width,ch/bgImg.height);
 bgImg.set({
  left:(cw-bgImg.width*s)/2,
  top:(ch-bgImg.height*s)/2,
  scaleX:s,scaleY:s
 });
 canvas.sendToBack(bgImg);
 canvas.getObjects("rect").forEach(r=>{
  if(!r._img)return;
  r.set({
   left:bgImg.left+r._img.x*s,
   top:bgImg.top+r._img.y*s,
   width:r._img.w*s,
   height:r._img.h*s
  });
 });
 canvas.requestRenderAll();
}

/* LOAD IMAGE */
fabric.Image.fromURL(IMAGE_URL,img=>{
 bgImg=img;
 img.selectable=false;
 canvas.add(img);
 resize();
},{crossOrigin:"anonymous"});

/* LOAD PARTS */
fetch(PARTS_JSON).then(r=>r.json()).then(d=>{
 d.forEach(p=>{
  const o=document.createElement("option");
  o.value=p.id;o.textContent=p.id+" – "+p.name;
  pieceSelect.appendChild(o);
 });
});

/* DRAW RECT */
let drawing=false,start={},rect=null;

canvas.on("mouse:down",o=>{
 if(isReading||tool!==TOOL.RECT||o.target)return;
 const p=canvas.getPointer(o.e,true);
 drawing=true;start=p;
 rect=new fabric.Rect({
  left:p.x,top:p.y,width:1,height:1,
  fill:"rgba(0,140,255,.1)",
  stroke:"rgba(0,140,255,.9)",strokeWidth:2
 });
 canvas.add(rect);
 canvas.setActiveObject(rect);
});

canvas.on("mouse:move",o=>{
 if(!drawing)return;
 const p=canvas.getPointer(o.e,true);
 rect.set({
  left:Math.min(start.x,p.x),
  top:Math.min(start.y,p.y),
  width:Math.abs(p.x-start.x),
  height:Math.abs(p.y-start.y)
 });
 canvas.requestRenderAll();
});

canvas.on("mouse:up",()=>{
 if(!drawing)return;
 drawing=false;
 rect._img={
  x:(rect.left-bgImg.left)/bgImg.scaleX,
  y:(rect.top-bgImg.top)/bgImg.scaleY,
  w:rect.width/bgImg.scaleX,
  h:rect.height/bgImg.scaleY
 };
 pieceSelect.focus(); // 🔑 OUVERTURE AUTO
});

/* APPLY */
btnApply.onclick=()=>{
 const r=canvas.getActiveObject();
 if(!r)return;
 r.partId=pieceSelect.value;
};

/* DELETE */
btnDelete.onclick=()=>{
 const r=canvas.getActiveObject();
 if(r)canvas.remove(r);
};

/* TOOLS */
btnHand.onclick=()=>tool=TOOL.HAND;
btnRect.onclick=()=>tool=TOOL.RECT;

/* FULLSCREEN */
btnFs.onclick=()=>{
 if(!document.fullscreenElement)document.documentElement.requestFullscreen();
 else document.exitFullscreen();
};
document.addEventListener("fullscreenchange",()=>{
 document.body.classList.toggle("fs-mode",!!document.fullscreenElement);
 setTimeout(()=>{resize();applyZoom(currentZoom)},120);
});

/* MODE */
toggleMode.onclick=()=>{
 if(isReading && prompt("Mot de passe")!==EDIT_PW)return;
 isReading=!isReading;
 modeLabel.textContent=isReading?"Lecture":"Éditeur";
};

/* INIT */
resize();
</script>

</body>
</html>
